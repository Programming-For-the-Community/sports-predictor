# Single repo-wide SonarQube Cloud project. sonar.organization/sonar.projectKey
# are passed in via -D args in sonar_scan.yml (from vars.SONAR_ORGANIZATION/
# vars.SONAR_PROJECT_KEY) rather than hardcoded here.
sonar.sources=Source
sonar.tests=Source/tests,Source/front-end/test
sonar.exclusions=**/build/**,**/.dart_tool/**,**/*.g.dart,**/*.freezed.dart,Terraform/**,**/node_modules/**
sonar.python.version=3.12
