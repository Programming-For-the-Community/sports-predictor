# Builds, packages, and deploys the PGA AI training code. Runs standalone
# (workflow_dispatch) or called from pga_deploy.yml (workflow_call) --
# either way the work is identical: build and push image(s).
#
# This stage builds two images: Feature Engineering and Train Top-10
# Model (the latter also serves train_top5_model.py/train_score_model.py/
# train_cutline_model.py/train_round_model.py/train_match_winprob_model.py/
# train_cup_winprob_model.py -- Terraform/ecs-task-pga-train-{top5,score,
# cutline,round,match-winprob,cup-winprob}-model.tf all point at this same
# image tag and override `command` to run their own script instead, same
# shared-image/command-override pattern NBA's own train-win-probability-
# model image uses for score/player-prop).
#
# Each image gets its OWN version constant below, bumped independently --
# feature engineering and train-top10-model are unrelated Fargate tasks
# with unrelated code, so a change to one has no reason to force a
# version bump (and a new image tag/deploy) of the other. Bump only the
# constant for whichever image actually changed, never both just to keep
# them in sync.

name: PGA AI Training

on:
  workflow_dispatch:
  workflow_call:

env:
  # FEATURE_ENGINEERING bumped again 2026-08-27, two real live crashes in
  # one afternoon: (1) TypeError: int + str in rolling_golfer_averages'
  # sum() -- a withdrawn golfer's non-numeric score ("WD") reached it
  # unguarded, fixed at the source (library/normalize/pga.py's
  # _parse_score) plus a type-check here matching library/features/
  # common.py's existing rolling_player_stat_averages discipline; (2)
  # pyarrow.lib.ArrowInvalid on the Parquet write itself -- a row already
  # in DynamoDB from BEFORE fix (1) shipped (a real empty-string
  # score_to_par) still crashed the ENTIRE dataset write (one bad value
  # poisons the whole column, not just its row), so every raw passthrough
  # field in library/features/pga.py (purse, cut_score, cut_count,
  # finish_position, every label_*, season_stats values) now goes through
  # a new _as_number() coercion -- a normalizer fix alone can't protect
  # against data already written before it existed.
  #
  # TRAIN_TOP10_MODEL bumped 2026-08-27, same afternoon: the _as_number()
  # coercion above means label_round_score_to_par/label_cut_score can now
  # be a real None for a dirty stored row, same as train_score_model.py's
  # own label (label_remaining_score_to_par as of 2026-08-28, previously
  # label_score_to_par) already could be -- but unlike train_score_model.py's own
  # _filter_to_scored_rows, train_round_model.py/train_cutline_model.py
  # had no notna() filter before handing y_train/y_test to run_backtest,
  # so a dirty row would reach .fit() and crash every non-XGBoost
  # candidate (sklearn regressors reject a NaN target) instead of feature-
  # engineering. Found by auditing every train_*.py's own label-nullity
  # handling after the match/cup status bug below, not from a live crash
  # -- both scripts now filter the same way train_score_model.py already
  # did.
  #
  # TRAIN_TOP10_MODEL bumped again 2026-08-27, real live crash:
  # ValueError: Cannot have number of folds=9 greater than the number of
  # samples=6, in train_cup_winprob_model -- cup-win-probability's real
  # dataset is only 8 rows total (one Ryder/Presidents Cup a year), 6
  # after the chronological train/test split, and library/ml/
  # model_types.py hardcoded every adapter's TimeSeriesSplit at
  # n_splits=8 (needs 9+ samples) with no accommodation for a target
  # this small. Fixed with a new shared _time_series_splits() helper
  # (clamps down to what the data can support, floored at 2) applied to
  # all 8 cv=TimeSeriesSplit(...) call sites in that file, not just
  # XGBoost (the one that happened to crash first in the candidate
  # tournament) -- behaviorally a no-op for every other target/sport,
  # since none of them have ever had fewer than 9 training rows.
  FEATURE_ENGINEERING_IMAGE_VERSION: '1.1.1'
  TRAIN_TOP10_MODEL_IMAGE_VERSION: '1.1.2'

permissions:
  id-token: write
  contents: read

jobs:
  # Two independent test jobs, not one shared one -- a failing
  # model-training test shouldn't fail feature engineering's deployment
  # too, even though both re-run Source/tests/library/ redundantly.
  #
  # feature-engineering's own requirements.txt has no reason to carry
  # xgboost/scikit-learn/pandas/lightgbm's ML-training extras (it only
  # writes Parquet) -- library/tests/ml/ needs those and is excluded here.
  # train-top10-model's own job below already has all of them, so it
  # needs no such exclusion.
  test-feature-engineering:
    name: Run feature engineering tests
    uses: ./.github/workflows/run_python_tests.yml
    with:
      test_path: 'Source/tests/library/ Source/tests/feature-engineering/pga/ --ignore=Source/tests/library/ml'
      requirements_files: 'Source/feature-engineering/pga/requirements.txt'

  test-train-top10-model:
    name: Run train top-10-probability model tests
    uses: ./.github/workflows/run_python_tests.yml
    with:
      test_path: 'Source/tests/library/ Source/tests/model-training/pga/'
      requirements_files: 'Source/model-training/pga/requirements.txt'

  set-versions:
    name: Resolve image versions
    runs-on: ubuntu-latest
    outputs:
      feature_engineering_version: ${{ steps.out.outputs.feature_engineering_version }}
      train_top10_model_version: ${{ steps.out.outputs.train_top10_model_version }}
    steps:
      - id: out
        run: |
          echo "feature_engineering_version=${{ env.FEATURE_ENGINEERING_IMAGE_VERSION }}" >> "$GITHUB_OUTPUT"
          echo "train_top10_model_version=${{ env.TRAIN_TOP10_MODEL_IMAGE_VERSION }}" >> "$GITHUB_OUTPUT"

  build-feature-engineering-image:
    name: Build and push feature engineering image
    needs: [set-versions, test-feature-engineering]
    uses: ./.github/workflows/docker_build_push.yml
    secrets: inherit
    with:
      dockerfile_path: 'Source/feature-engineering/pga/Dockerfile'
      docker_context: 'Source'
      image_name: 'pga-feature-engineering'
      image_version: ${{ needs.set-versions.outputs.feature_engineering_version }}

  build-train-top10-model-image:
    name: Build and push train top-10-probability model image
    needs: [set-versions, test-train-top10-model]
    uses: ./.github/workflows/docker_build_push.yml
    secrets: inherit
    with:
      dockerfile_path: 'Source/model-training/pga/Dockerfile'
      docker_context: 'Source'
      image_name: 'pga-train-top10-model'
      image_version: ${{ needs.set-versions.outputs.train_top10_model_version }}
