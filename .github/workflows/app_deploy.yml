      (needs.test-ncaambb-live-scores.result == 'success' || needs.test-ncaambb-live-scores.result == 'skipped') &&
      (needs.test-ncaambb-ingest.result == 'success' || needs.test-ncaambb-ingest.result == 'skipped') &&
      (needs.test-ncaambb-normalize.result == 'success' || needs.test-ncaambb-normalize.result == 'skipped') &&
      (needs.test-ncaambb-schedule-sync.result == 'success' || needs.test-ncaambb-schedule-sync.result == 'skipped') &&
      (needs.test-pga-backfill.result == 'success' || needs.test-pga-backfill.result == 'skipped') &&
      (needs.test-pga-feature-engineering.result == 'success' || needs.test-pga-feature-engineering.result == 'skipped') &&
