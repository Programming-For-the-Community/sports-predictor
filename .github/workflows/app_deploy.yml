      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Flutter
        uses: subosito/flutter-action@v2
        with:
          flutter-version: ${{ env.FLUTTER_VERSION }}
          channel: stable

      - name: Install dependencies
        working-directory: Source/front-end
        run: flutter pub get

      - name: Analyze
        working-directory: Source/front-end
        run: flutter analyze

      - name: Test
        working-directory: Source/front-end
        run: flutter test --coverage

      - name: Upload coverage data
        uses: actions/upload-artifact@v4
        with:
          name: dart-coverage
          path: Source/front-end/coverage/lcov.info
          retention-days: 1
          if-no-files-found: ignore

  # =========================== the one scan job ===========================
  scan:
    name: SonarQube Cloud scan
    needs: [
      test-nfl-backfill, test-nfl-feature-engineering, test-nfl-train-model, test-nfl-predict,
      test-nfl-predict-read, test-nfl-live-scores, test-nfl-ingest, test-nfl-normalize, test-nfl-schedule-sync,
      test-ncaafb-backfill, test-ncaafb-feature-engineering, test-ncaafb-train-models, test-ncaafb-predict,
      test-ncaafb-predict-read, test-ncaafb-live-scores, test-ncaafb-ingest, test-ncaafb-normalize, test-ncaafb-schedule-sync,
      test-nba-backfill, test-nba-feature-engineering, test-nba-train-model, test-nba-predict,
      test-nba-predict-read, test-nba-live-scores, test-nba-ingest, test-nba-normalize, test-nba-schedule-sync,
      test-ncaambb-backfill, test-ncaambb-feature-engineering, test-ncaambb-train-models, test-ncaambb-predict,
      test-ncaambb-predict-read, test-ncaambb-live-scores, test-ncaambb-ingest, test-ncaambb-normalize, test-ncaambb-schedule-sync,
      test-pga-backfill, test-pga-feature-engineering, test-pga-train-top10-model, test-pga-predict,
      test-pga-predict-read, test-pga-live-scores, test-pga-ingest, test-pga-normalize, test-pga-schedule-sync,
      test-f1-backfill, test-f1-feature-engineering, test-f1-train-winprob-model, test-f1-predict,
      test-f1-predict-read, test-f1-live-scores, test-f1-ingest, test-f1-normalize,
      test-season-gate, test-cloudwatch-geo-widget, test-ec2-training-reaper,
      test-frontend,
    ]
    if: |
      always() &&
      (needs.test-nfl-backfill.result == 'success' || needs.test-nfl-backfill.result == 'skipped') &&
      (needs.test-nfl-feature-engineering.result == 'success' || needs.test-nfl-feature-engineering.result == 'skipped') &&
      (needs.test-nfl-train-model.result == 'success' || needs.test-nfl-train-model.result == 'skipped') &&
      (needs.test-nfl-predict.result == 'success' || needs.test-nfl-predict.result == 'skipped') &&
      (needs.test-nfl-predict-read.result == 'success' || needs.test-nfl-predict-read.result == 'skipped') &&
      (needs.test-nfl-live-scores.result == 'success' || needs.test-nfl-live-scores.result == 'skipped') &&
      (needs.test-nfl-ingest.result == 'success' || needs.test-nfl-ingest.result == 'skipped') &&
      (needs.test-nfl-normalize.result == 'success' || needs.test-nfl-normalize.result == 'skipped') &&
      (needs.test-nfl-schedule-sync.result == 'success' || needs.test-nfl-schedule-sync.result == 'skipped') &&
      (needs.test-ncaafb-backfill.result == 'success' || needs.test-ncaafb-backfill.result == 'skipped') &&
      (needs.test-ncaafb-feature-engineering.result == 'success' || needs.test-ncaafb-feature-engineering.result == 'skipped') &&
      (needs.test-ncaafb-train-models.result == 'success' || needs.test-ncaafb-train-models.result == 'skipped') &&
