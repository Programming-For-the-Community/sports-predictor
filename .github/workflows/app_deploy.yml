      (needs.pga_ai_hosting_build.result == 'success' || needs.pga_ai_hosting_build.result == 'skipped') &&
      (needs.f1_backfill_build.result == 'success' || needs.f1_backfill_build.result == 'skipped') &&
      (needs.f1_ai_training_build.result == 'success' || needs.f1_ai_training_build.result == 'skipped') &&
      (needs.f1_ai_hosting_build.result == 'success' || needs.f1_ai_hosting_build.result == 'skipped')
