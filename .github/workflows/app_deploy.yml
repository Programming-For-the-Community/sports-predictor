# Top-level orchestrator for every component's deploy, across every sport
# and the frontend. Triggers only on a push to main or manual dispatch.
#
# Calls `tf_install.yml` exactly ONCE, not once per component, fed from
# one shared `infra` job.
#
# Anything that only builds/pushes an artifact (no Terraform-created
# resource to read or write) runs BEFORE infra; anything that needs a
# Terraform-created resource to already exist (pointing a Lambda at an
# image, deploying zip code to a function, syncing to a bucket, or reading
# Terraform outputs directly for the frontend build) runs AFTER.

name: App Deploy

on:
  workflow_dispatch:
  push:
    branches:
      - main
  workflow_call:

# Terraform/main.tf's S3 backend has no state locking configured, so this
# queues a second trigger rather than running it concurrently.
# cancel-in-progress: false because killing an in-flight terraform apply
# can leave real AWS resources half-applied.
concurrency:
  group: terraform-deploy-pipeline
  cancel-in-progress: false

permissions:
  id-token: write
  contents: read
  actions: read

jobs:
  # --- Before infra: build/push only, no Terraform dependency ---
  nfl_backfill_build:
    name: NFL backfill (build)
    uses: ./.github/workflows/nfl_backfill.yml
    secrets: inherit

  nfl_ai_training_build:
    name: NFL AI training (build)
    uses: ./.github/workflows/nfl_ai_training.yml
    secrets: inherit

  nfl_ai_hosting_build:
    name: NFL AI hosting (build)
    uses: ./.github/workflows/nfl_ai_hosting.yml
    secrets: inherit

  ncaafb_backfill_build:
    name: NCAAFB backfill (build)
    uses: ./.github/workflows/ncaafb_backfill.yml
    secrets: inherit

  ncaafb_ai_training_build:
    name: NCAAFB AI training (build)
    uses: ./.github/workflows/ncaafb_ai_training.yml
    secrets: inherit

  ncaafb_ai_hosting_build:
    name: NCAAFB AI hosting (build)
    uses: ./.github/workflows/ncaafb_ai_hosting.yml
    secrets: inherit

  nba_backfill_build:
    name: NBA backfill (build)
    uses: ./.github/workflows/nba_backfill.yml
    secrets: inherit

  nba_ai_training_build:
    name: NBA AI training (build)
    uses: ./.github/workflows/nba_ai_training.yml
    secrets: inherit

  nba_ai_hosting_build:
    name: NBA AI hosting (build)
    uses: ./.github/workflows/nba_ai_hosting.yml
    secrets: inherit

  ncaambb_backfill_build:
    name: NCAA MBB backfill (build)
    uses: ./.github/workflows/ncaambb_backfill.yml
    secrets: inherit

  ncaambb_ai_training_build:
    name: NCAA MBB AI training (build)
    uses: ./.github/workflows/ncaambb_ai_training.yml
    secrets: inherit

  ncaambb_ai_hosting_build:
    name: NCAA MBB AI hosting (build)
    uses: ./.github/workflows/ncaambb_ai_hosting.yml
    secrets: inherit

  pga_backfill_build:
    name: PGA backfill (build)
    uses: ./.github/workflows/pga_backfill.yml
    secrets: inherit

  pga_ai_training_build:
    name: PGA AI training (build)
    uses: ./.github/workflows/pga_ai_training.yml
    secrets: inherit

  pga_ai_hosting_build:
    name: PGA AI hosting (build)
    uses: ./.github/workflows/pga_ai_hosting.yml
    secrets: inherit

  # --- Infra: applies once, gated on every "before" job tolerating
  # success-or-skip ---
  infra:
    name: Apply shared infrastructure
    needs: [
      nfl_backfill_build, nfl_ai_training_build, nfl_ai_hosting_build,
      ncaafb_backfill_build, ncaafb_ai_training_build, ncaafb_ai_hosting_build,
      nba_backfill_build, nba_ai_training_build, nba_ai_hosting_build,
      ncaambb_backfill_build, ncaambb_ai_training_build, ncaambb_ai_hosting_build,
      pga_backfill_build, pga_ai_training_build, pga_ai_hosting_build,
    ]
    if: |
      always() &&
      (needs.nfl_backfill_build.result == 'success' || needs.nfl_backfill_build.result == 'skipped') &&
      (needs.nfl_ai_training_build.result == 'success' || needs.nfl_ai_training_build.result == 'skipped') &&
      (needs.nfl_ai_hosting_build.result == 'success' || needs.nfl_ai_hosting_build.result == 'skipped') &&
      (needs.ncaafb_backfill_build.result == 'success' || needs.ncaafb_backfill_build.result == 'skipped') &&
      (needs.ncaafb_ai_training_build.result == 'success' || needs.ncaafb_ai_training_build.result == 'skipped') &&
      (needs.ncaafb_ai_hosting_build.result == 'success' || needs.ncaafb_ai_hosting_build.result == 'skipped') &&
      (needs.nba_backfill_build.result == 'success' || needs.nba_backfill_build.result == 'skipped') &&
      (needs.nba_ai_training_build.result == 'success' || needs.nba_ai_training_build.result == 'skipped') &&
      (needs.nba_ai_hosting_build.result == 'success' || needs.nba_ai_hosting_build.result == 'skipped') &&
      (needs.ncaambb_backfill_build.result == 'success' || needs.ncaambb_backfill_build.result == 'skipped') &&
      (needs.ncaambb_ai_training_build.result == 'success' || needs.ncaambb_ai_training_build.result == 'skipped') &&
      (needs.ncaambb_ai_hosting_build.result == 'success' || needs.ncaambb_ai_hosting_build.result == 'skipped') &&
      (needs.pga_backfill_build.result == 'success' || needs.pga_backfill_build.result == 'skipped') &&
      (needs.pga_ai_training_build.result == 'success' || needs.pga_ai_training_build.result == 'skipped') &&
      (needs.pga_ai_hosting_build.result == 'success' || needs.pga_ai_hosting_build.result == 'skipped')
    uses: ./.github/workflows/tf_install.yml
    secrets: inherit

  # --- After infra: needs a Terraform-created resource to already exist ---
  shared_lambdas_deploy:
    name: Shared lambdas (deploy)
    needs: infra
    uses: ./.github/workflows/shared_lambdas_deploy.yml
    secrets: inherit
    with:
      season_gate_function_name: ${{ needs.infra.outputs.season_gate_function_name }}

  nfl_predict_deploy:
    name: NFL predict (deploy)
    needs: [infra, nfl_ai_hosting_build]
    uses: ./.github/workflows/nfl_predict_deploy.yml
    secrets: inherit
    with:
      function_name: ${{ needs.infra.outputs.nfl_predict_function_name }}
      image_uri: ${{ needs.nfl_ai_hosting_build.outputs.predict_image_uri }}

  nfl_data_pipeline:
    name: NFL data pipeline (deploy)
    needs: infra
    uses: ./.github/workflows/nfl_data_pipeline.yml
    secrets: inherit
    with:
      ingest_function_name: ${{ needs.infra.outputs.nfl_ingest_function_name }}
      normalize_function_name: ${{ needs.infra.outputs.nfl_normalize_function_name }}
      schedule_sync_function_name: ${{ needs.infra.outputs.nfl_schedule_sync_function_name }}

  nfl_predict_read_deploy:
    name: NFL predict-read (deploy)
    needs: infra
    uses: ./.github/workflows/nfl_predict_read_deploy.yml
    secrets: inherit
    with:
      function_name: ${{ needs.infra.outputs.nfl_predict_read_function_name }}

  nfl_live_scores_deploy:
    name: NFL live-scores (deploy)
    needs: infra
    uses: ./.github/workflows/nfl_live_scores_deploy.yml
    secrets: inherit
    with:
      function_name: ${{ needs.infra.outputs.nfl_live_scores_function_name }}

  ncaafb_predict_deploy:
    name: NCAAFB AI hosting (deploy)
    needs: [infra, ncaafb_ai_hosting_build]
    uses: ./.github/workflows/ncaafb_predict_deploy.yml
    secrets: inherit
    with:
      function_name: ${{ needs.infra.outputs.ncaafb_predict_function_name }}
      image_uri: ${{ needs.ncaafb_ai_hosting_build.outputs.predict_image_uri }}

  ncaafb_data_pipeline:
    name: NCAAFB data pipeline (deploy)
    needs: infra
    uses: ./.github/workflows/ncaafb_data_pipeline.yml
    secrets: inherit
    with:
      ingest_function_name: ${{ needs.infra.outputs.ncaafb_ingest_function_name }}
      normalize_function_name: ${{ needs.infra.outputs.ncaafb_normalize_function_name }}
      schedule_sync_function_name: ${{ needs.infra.outputs.ncaafb_schedule_sync_function_name }}

  ncaafb_predict_read_deploy:
    name: NCAAFB predict-read (deploy)
    needs: infra
    uses: ./.github/workflows/ncaafb_predict_read_deploy.yml
    secrets: inherit
    with:
      function_name: ${{ needs.infra.outputs.ncaafb_predict_read_function_name }}

  ncaafb_live_scores_deploy:
    name: NCAAFB live-scores (deploy)
    needs: infra
    uses: ./.github/workflows/ncaafb_live_scores_deploy.yml
    secrets: inherit
    with:
      function_name: ${{ needs.infra.outputs.ncaafb_live_scores_function_name }}

  nba_predict_deploy:
    name: NBA AI hosting (deploy)
    needs: [infra, nba_ai_hosting_build]
    uses: ./.github/workflows/nba_predict_deploy.yml
    secrets: inherit
    with:
      function_name: ${{ needs.infra.outputs.nba_predict_function_name }}
      image_uri: ${{ needs.nba_ai_hosting_build.outputs.predict_image_uri }}

  nba_data_pipeline:
    name: NBA data pipeline (deploy)
    needs: infra
    uses: ./.github/workflows/nba_data_pipeline.yml
    secrets: inherit
    with:
      ingest_function_name: ${{ needs.infra.outputs.nba_ingest_function_name }}
      normalize_function_name: ${{ needs.infra.outputs.nba_normalize_function_name }}
      schedule_sync_function_name: ${{ needs.infra.outputs.nba_schedule_sync_function_name }}

  nba_predict_read_deploy:
    name: NBA predict-read (deploy)
    needs: infra
    uses: ./.github/workflows/nba_predict_read_deploy.yml
    secrets: inherit
    with:
      function_name: ${{ needs.infra.outputs.nba_predict_read_function_name }}

  nba_live_scores_deploy:
    name: NBA live-scores (deploy)
    needs: infra
    uses: ./.github/workflows/nba_live_scores_deploy.yml
    secrets: inherit
    with:
      function_name: ${{ needs.infra.outputs.nba_live_scores_function_name }}

  # NCAA MBB has no live_scores job yet -- onboarding in progress (see
  # project-ncaambb-onboarding memory), added in the same step that builds
  # it (step 7), not batched here ahead of time.
  ncaambb_predict_deploy:
    name: NCAA MBB AI hosting (deploy)
    needs: [infra, ncaambb_ai_hosting_build]
    uses: ./.github/workflows/ncaambb_predict_deploy.yml
    secrets: inherit
    with:
      function_name: ${{ needs.infra.outputs.ncaambb_predict_function_name }}
      image_uri: ${{ needs.ncaambb_ai_hosting_build.outputs.predict_image_uri }}

  ncaambb_predict_read_deploy:
    name: NCAA MBB predict-read (deploy)
    needs: infra
    uses: ./.github/workflows/ncaambb_predict_read_deploy.yml
    secrets: inherit
    with:
      function_name: ${{ needs.infra.outputs.ncaambb_predict_read_function_name }}

  ncaambb_data_pipeline:
    name: NCAA MBB data pipeline (deploy)
    needs: infra
    uses: ./.github/workflows/ncaambb_data_pipeline.yml
    secrets: inherit
    with:
      ingest_function_name: ${{ needs.infra.outputs.ncaambb_ingest_function_name }}
      normalize_function_name: ${{ needs.infra.outputs.ncaambb_normalize_function_name }}
      schedule_sync_function_name: ${{ needs.infra.outputs.ncaambb_schedule_sync_function_name }}

  pga_predict_deploy:
    name: PGA AI hosting (deploy)
    needs: [infra, pga_ai_hosting_build]
    uses: ./.github/workflows/pga_predict_deploy.yml
    secrets: inherit
    with:
      function_name: ${{ needs.infra.outputs.pga_predict_function_name }}
      image_uri: ${{ needs.pga_ai_hosting_build.outputs.predict_image_uri }}

  pga_data_pipeline:
    name: PGA data pipeline (deploy)
    needs: infra
    uses: ./.github/workflows/pga_data_pipeline.yml
    secrets: inherit
    with:
      ingest_function_name: ${{ needs.infra.outputs.pga_ingest_function_name }}
      normalize_function_name: ${{ needs.infra.outputs.pga_normalize_function_name }}
      schedule_sync_function_name: ${{ needs.infra.outputs.pga_schedule_sync_function_name }}

  pga_predict_read_deploy:
    name: PGA predict-read (deploy)
    needs: infra
    uses: ./.github/workflows/pga_predict_read_deploy.yml
    secrets: inherit
    with:
      function_name: ${{ needs.infra.outputs.pga_predict_read_function_name }}

  pga_live_scores_deploy:
    name: PGA live-scores (deploy)
    needs: infra
    uses: ./.github/workflows/pga_live_scores_deploy.yml
    secrets: inherit
    with:
      function_name: ${{ needs.infra.outputs.pga_live_scores_function_name }}

  # No config `with:` block for either -- both read directly from
  # Terraform state instead of relaying it through needs.infra.outputs.*.
  # `needs: infra` still enforces ordering.
  frontend_build:
    name: Frontend hosting (build)
    needs: infra
    uses: ./.github/workflows/frontend_hosting.yml
    secrets: inherit

  frontend_deploy:
    name: Frontend hosting (deploy)
    needs: [infra, frontend_build]
    uses: ./.github/workflows/frontend_sync_deploy.yml
    secrets: inherit
    with:
      source_run_id: ${{ github.run_id }}
