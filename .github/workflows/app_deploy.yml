# Top-level orchestrator for every component's deploy, across every sport
# and the frontend. Triggers only on a push to main or manual dispatch.
#
# Calls `tf_install.yml` exactly ONCE, not once per component, fed from
# one shared `infra` job.
#
# Anything that only builds/pushes an artifact (no Terraform-created
# resource to read or write) runs BEFORE infra; anything that needs a
# Terraform-created resource to already exist (pointing a Lambda at an
# image, deploying zip code to a function, syncing to a bucket, or reading
# Terraform outputs directly for the frontend build) runs AFTER.
#
# Calls the generic per-category workflows (backfill.yml, ai_training.yml,
# etc. -- shared across every sport) with each sport's own paths/test
# lists/image versions as inputs, duplicating the same per-sport `with:`
# blocks each sport's own _deploy.yml uses (this file intentionally does
# NOT call nfl_deploy.yml/etc. directly -- doing so would re-run
# tf_install.yml once per sport instead of once total). Keeps GitHub's cap
# on how many distinct reusable workflows one workflow run can reference
# from ballooning as sports are added.

name: App Deploy

on:
  workflow_dispatch:
  push:
    branches:
      - main
  workflow_call:

# Terraform/main.tf's S3 backend has no state locking configured, so this
# queues a second trigger rather than running it concurrently.
# cancel-in-progress: false because killing an in-flight terraform apply
# can leave real AWS resources half-applied.
concurrency:
  group: terraform-deploy-pipeline
  cancel-in-progress: false

permissions:
  id-token: write
  contents: read
  actions: read

jobs:
  # --- Before infra: build/push only, no Terraform dependency ---
  nfl_backfill_build:
    name: NFL backfill (build)
    uses: ./.github/workflows/docker_image_deploy.yml
    secrets: inherit
    with:
      sport: 'NFL'
      test_path: 'Source/tests/data-backfills/nfl/'
      requirements_files: 'Source/data-backfills/nfl/requirements-dev.txt'
      dockerfile_path: 'Source/data-backfills/nfl/Dockerfile'
      image_name: 'nfl-backfill'
      image_version: '1.0.0'

  nfl_ai_training_build:
    name: NFL AI training (build)
