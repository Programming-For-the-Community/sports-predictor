      (needs.test-f1-backfill.result == 'success' || needs.test-f1-backfill.result == 'skipped') &&
      (needs.test-f1-feature-engineering.result == 'success' || needs.test-f1-feature-engineering.result == 'skipped') &&
      (needs.test-f1-train-winprob-model.result == 'success' || needs.test-f1-train-winprob-model.result == 'skipped') &&
      (needs.test-f1-predict.result == 'success' || needs.test-f1-predict.result == 'skipped') &&
      (needs.test-f1-predict-read.result == 'success' || needs.test-f1-predict-read.result == 'skipped') &&
      (needs.test-f1-live-scores.result == 'success' || needs.test-f1-live-scores.result == 'skipped') &&
      (needs.test-f1-ingest.result == 'success' || needs.test-f1-ingest.result == 'skipped') &&
      (needs.test-f1-normalize.result == 'success' || needs.test-f1-normalize.result == 'skipped') &&
      (needs.test-season-gate.result == 'success' || needs.test-season-gate.result == 'skipped') &&
      (needs.test-cloudwatch-geo-widget.result == 'success' || needs.test-cloudwatch-geo-widget.result == 'skipped') &&
      (needs.test-ec2-training-reaper.result == 'success' || needs.test-ec2-training-reaper.result == 'skipped') &&
      (needs.test-frontend.result == 'success' || needs.test-frontend.result == 'skipped')
    uses: ./.github/workflows/sonar_scan.yml
    secrets: inherit
    with:
      # TEMPORARY: normally true (the one pipeline where a failing quality
      # gate actually halts the deployment -- every sport's own _deploy.yml
      # scan stays advisory, see sonar_scan.yml's own comment). Flipped to
      # false so pending coverage/duplication findings don't block getting
      # current work deployed. The scan itself still runs and still reports
      # to the SonarQube Cloud dashboard -- this only stops a failing gate
      # from halting THIS job. Revert to true once coverage/duplication are
      # back under the gate's thresholds.
      wait_for_quality_gate: false
      environment: ${{ github.event.inputs.environment || 'development' }}
      parent_workflow: ${{ github.workflow }}

