# Builds and deploys the NFL recurring data pipeline Lambdas: nfl-ingest
# (EventBridge-triggered, writes raw JSON to S3), nfl-normalize
# (S3-triggered, writes to DynamoDB), and nfl-schedule-sync (EventBridge-
# triggered, writes raw schedule JSON to S3). Deployed in parallel; each
# is independent.
#
# Lambda function names come from the caller (nfl_deploy.yml) via
# Terraform outputs, with defaults for standalone workflow_dispatch runs.

name: NFL Data Pipeline

on:
  workflow_dispatch:
  workflow_call:
    inputs:
      ingest_function_name:
        description: 'NFL ingest Lambda function name (from Terraform output nfl_ingest_function_name)'
        required: false
        type: string
        default: 'sports-predictor-nfl-ingest'
      normalize_function_name:
        description: 'NFL normalize Lambda function name (from Terraform output nfl_normalize_function_name)'
        required: false
        type: string
        default: 'sports-predictor-nfl-normalize'
      schedule_sync_function_name:
        description: 'NFL schedule-sync Lambda function name (from Terraform output nfl_schedule_sync_function_name)'
        required: false
        type: string
        default: 'sports-predictor-nfl-schedule-sync'

permissions:
  id-token: write
  contents: read

jobs:
  test-ingest:
    name: Run nfl-ingest tests
    uses: ./.github/workflows/run_python_tests.yml
    with:
      test_path: >-
        Source/tests/aws-lambdas/nfl/test_ingest_lambda_handler.py
        Source/tests/aws-lambdas/nfl/test_ingest_helpers.py
        Source/tests/aws-lambdas/nfl/test_ingest_rosters.py
        Source/tests/aws-lambdas/nfl/test_ingest_depth_charts.py
        Source/tests/aws-lambdas/nfl/test_ingest_coaches.py
        Source/tests/aws-lambdas/nfl/test_enrichment.py
      requirements_files: 'Source/aws-lambdas/nfl/ingest/requirements.txt'

  test-normalize:
    name: Run nfl-normalize tests
    uses: ./.github/workflows/run_python_tests.yml
    with:
      test_path: 'Source/tests/aws-lambdas/nfl/test_normalize.py'
      requirements_files: 'Source/aws-lambdas/nfl/normalize/requirements.txt'

  deploy-ingest:
    name: Deploy nfl-ingest Lambda
    needs: test-ingest
    uses: ./.github/workflows/python_lambda_build.yml
    secrets: inherit
    with:
      function_name: ${{ inputs.ingest_function_name || 'sports-predictor-nfl-ingest' }}
      handler_dir: 'Source/aws-lambdas/nfl/ingest'
      library_path: 'Source/library'
      extra_source_files: 'Source/aws-lambdas/nfl/ingest/enrichment.py'

  deploy-normalize:
    name: Deploy nfl-normalize Lambda
    needs: test-normalize
    uses: ./.github/workflows/python_lambda_build.yml
    secrets: inherit
    with:
      function_name: ${{ inputs.normalize_function_name || 'sports-predictor-nfl-normalize' }}
      handler_dir: 'Source/aws-lambdas/nfl/normalize'
      library_path: 'Source/library'

  test-schedule-sync:
    name: Run nfl-schedule-sync tests
    uses: ./.github/workflows/run_python_tests.yml
    with:
      test_path: 'Source/tests/aws-lambdas/nfl/test_schedule_sync.py'
      requirements_files: 'Source/aws-lambdas/nfl/schedule-sync/requirements.txt'

  deploy-schedule-sync:
    name: Deploy nfl-schedule-sync Lambda
    needs: test-schedule-sync
    uses: ./.github/workflows/python_lambda_build.yml
    secrets: inherit
    with:
      function_name: ${{ inputs.schedule_sync_function_name || 'sports-predictor-nfl-schedule-sync' }}
      handler_dir: 'Source/aws-lambdas/nfl/schedule-sync'
      library_path: 'Source/library'