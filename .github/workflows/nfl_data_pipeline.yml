# Builds and deploys the NFL recurring data pipeline Lambdas: nfl-ingest
# (EventBridge-triggered, writes raw JSON to S3) and nfl-normalize
# (S3-triggered, writes to DynamoDB). Both are deployed in parallel since
# they are independent -- a failure in one does not block the other.
#
# Lambda function names are supplied by the caller (nfl_deploy.yml) from
# Terraform outputs so this workflow never hard-codes names that Terraform
# owns. Defaults are provided so workflow_dispatch (manual, standalone run)
# still works without needing the Terraform output values.
#
# Terraform (tf_install.yml) creates each Lambda function with a placeholder
# ZIP and lifecycle { ignore_changes } so it never overwrites what this
# workflow deploys. This workflow owns all subsequent code updates.

name: NFL Data Pipeline

on:
  workflow_dispatch:
  workflow_call:
    inputs:
      ingest_function_name:
        description: 'NFL ingest Lambda function name (from Terraform output nfl_ingest_function_name)'
        required: false
        type: string
        default: 'sports-predictor-nfl-ingest'
      normalize_function_name:
        description: 'NFL normalize Lambda function name (from Terraform output nfl_normalize_function_name)'
        required: false
        type: string
        default: 'sports-predictor-nfl-normalize'

permissions:
  id-token: write
  contents: read

jobs:
  # Each Lambda gets its own upstream test job, pointed at its own
  # specific test file -- not the whole Source/tests/aws-lambdas/nfl/
  # directory. conftest.py there loads both nfl_ingest and nfl_normalize
  # regardless (either test file could run standalone), but a failing
  # normalize test used to fail the ingest deploy too, and vice versa,
  # purely because both deploys pointed at the same shared directory.
  test-ingest:
    name: Run nfl-ingest tests
    uses: ./.github/workflows/run_python_tests.yml
    with:
      test_path: 'Source/tests/aws-lambdas/nfl/test_ingest.py'
      requirements_files: 'Source/aws-lambdas/nfl/ingest/requirements.txt'

  test-normalize:
    name: Run nfl-normalize tests
    uses: ./.github/workflows/run_python_tests.yml
    with:
      test_path: 'Source/tests/aws-lambdas/nfl/test_normalize.py'
      requirements_files: 'Source/aws-lambdas/nfl/normalize/requirements.txt'

  deploy-ingest:
    name: Deploy nfl-ingest Lambda
    needs: test-ingest
    uses: ./.github/workflows/python_lambda_build.yml
    secrets: inherit
    with:
      function_name: ${{ inputs.ingest_function_name || 'sports-predictor-nfl-ingest' }}
      handler_dir: 'Source/aws-lambdas/nfl/ingest'
      library_path: 'Source/library'

  deploy-normalize:
    name: Deploy nfl-normalize Lambda
    needs: test-normalize
    uses: ./.github/workflows/python_lambda_build.yml
    secrets: inherit
    with:
      function_name: ${{ inputs.normalize_function_name || 'sports-predictor-nfl-normalize' }}
      handler_dir: 'Source/aws-lambdas/nfl/normalize'
      library_path: 'Source/library'