# Top-level NCAAFB deploy pipeline. Runs on every push to an ncaafb*
# branch, but pauses for manual approval (via the environment's required
# reviewers -- configure this in Settings > Environments, it can't be set
# from this file) before doing anything.
#
# Calls the generic per-category workflows (backfill.yml, ai_training.yml,
# etc. -- shared across every sport) with NCAAFB's own paths/test
# lists/image versions as inputs, rather than a dedicated ncaafb_*.yml
# file per category -- keeps GitHub's cap on how many distinct reusable
# workflows one workflow run can reference from ballooning as sports are
# added (app_deploy.yml bundles every sport into one run).
#
# Both this job's `approval` step AND tf_install.yml's own terraform job
# gate on the `development`/`production` environment, so a run through
# this pipeline prompts for approval twice.

name: NCAAFB Deploy

on:
  workflow_dispatch:
  push:
    branches:
      - 'ncaafb*'
  workflow_call:

# Shared group across every workflow that can reach tf_install.yml's
# terraform apply, since Terraform/main.tf's S3 backend has no state
# locking configured.
concurrency:
  group: terraform-deploy-pipeline
  cancel-in-progress: false

permissions:
  id-token: write
  contents: read

jobs:
  approval:
    name: Await deployment approval
    if: github.event_name != 'workflow_call'
    runs-on: ubuntu-latest
    environment: development
    steps:
      - name: Approved
        run: echo "Deployment approved -- proceeding."

  backfill:
    name: Historical backfill (build)
    needs: approval
    if: |
      always() &&
      (needs.approval.result == 'success' || needs.approval.result == 'skipped')
    uses: ./.github/workflows/docker_image_deploy.yml
    secrets: inherit
    with:
      sport: 'NCAAFB'
      test_path: 'Source/tests/data-backfills/ncaafb/'
      requirements_files: 'Source/data-backfills/ncaafb/requirements-dev.txt'
      dockerfile_path: 'Source/data-backfills/ncaafb/Dockerfile'
      image_name: 'ncaafb-backfill'
      image_version: '1.0.0'

  # Builds feature engineering, win-probability/score/player-prop training
  # (shared image), and national-ranking training (separate image).
  ai_training:
    name: AI training (build)
    needs: approval
    if: |
      always() &&
      (needs.approval.result == 'success' || needs.approval.result == 'skipped')
    uses: ./.github/workflows/ai_training.yml
    secrets: inherit
    with:
      sport: 'NCAAFB'
      feature_engineering_test_path: 'Source/tests/library/ Source/tests/feature-engineering/ncaafb/ --ignore=Source/tests/library/ml'
      feature_engineering_requirements_files: 'Source/feature-engineering/ncaafb/requirements.txt'
      feature_engineering_dockerfile_path: 'Source/feature-engineering/ncaafb/Dockerfile'
      feature_engineering_image_name: 'ncaafb-feature-engineering'
      feature_engineering_image_version: '1.0.0'
      # Also used by train_score_model.py/train_player_prop_model.py via a container command override.
      train_model_test_path: 'Source/tests/library/ Source/tests/model-training/ncaafb/'
      train_model_requirements_files: 'Source/model-training/ncaafb/requirements.txt'
      train_model_dockerfile_path: 'Source/model-training/ncaafb/Dockerfile'
      train_model_image_name: 'ncaafb-train-win-probability-model'
      train_model_image_version: '1.0.0'
      ranking_model_dockerfile_path: 'Source/model-training/ncaafb/Dockerfile.ranking'
      ranking_model_image_name: 'ncaafb-train-ranking-model'
      ranking_model_image_version: '1.0.0'

  ai_hosting:
    name: AI hosting (build)
    needs: approval
    if: |
      always() &&
      (needs.approval.result == 'success' || needs.approval.result == 'skipped')
    uses: ./.github/workflows/docker_image_deploy.yml
    secrets: inherit
    with:
      sport: 'NCAAFB'
      test_path: >-
        Source/tests/library/
        Source/tests/aws-lambdas/ncaafb/test_live_features.py
        Source/tests/aws-lambdas/ncaafb/test_event_prediction.py
        Source/tests/aws-lambdas/ncaafb/test_predict_handler.py
        Source/tests/aws-lambdas/ncaafb/test_season_simulation.py
        Source/tests/aws-lambdas/ncaafb/test_season_projection.py
      requirements_files: 'Source/aws-lambdas/ncaafb/predict/requirements.txt Source/aws-lambdas/ncaafb/predict/requirements-nodeps.txt'
      dockerfile_path: 'Source/aws-lambdas/ncaafb/predict/Dockerfile'
      image_name: 'ncaafb-predict'
      image_version: '1.0.0'
      platform: 'linux/arm64'

  infra:
    name: Apply shared infrastructure
    needs: [backfill, ai_training, ai_hosting]
    if: |
      always() &&
      (needs.backfill.result == 'success' || needs.backfill.result == 'skipped') &&
      (needs.ai_training.result == 'success' || needs.ai_training.result == 'skipped') &&
      (needs.ai_hosting.result == 'success' || needs.ai_hosting.result == 'skipped')
    uses: ./.github/workflows/tf_install.yml
    secrets: inherit

  deploy_predict_lambda:
    name: AI hosting (deploy)
    needs: [infra, ai_hosting]
    uses: ./.github/workflows/docker_lambda_deploy.yml
    secrets: inherit
    with:
      function_name: ${{ needs.infra.outputs.ncaafb_predict_function_name }}
      image_uri: ${{ needs.ai_hosting.outputs.image_uri }}
      default_image_tag: 'ncaafb-predict-latest'

  predict_read_deploy:
    name: NCAAFB predict-read (test + deploy)
    needs: [approval, infra]
    if: |
      always() &&
      (needs.approval.result == 'success' || needs.approval.result == 'skipped')
    uses: ./.github/workflows/zip_lambda_deploy.yml
    secrets: inherit
    with:
      sport: 'NCAAFB'
      function_name: ${{ needs.infra.outputs.ncaafb_predict_read_function_name }}
      test_path: 'Source/tests/aws-lambdas/ncaafb/test_predict_read_handler.py Source/tests/library/serving/test_ncaafb_reads.py Source/tests/library/storage/test_prediction_cache.py Source/tests/library/storage/test_model_artifacts.py Source/tests/library/aws/test_lambda_invoker.py'
      requirements_files: 'Source/aws-lambdas/ncaafb/predict-read/requirements.txt'
      handler_dir: 'Source/aws-lambdas/ncaafb/predict-read'

  live_scores_deploy:
    name: NCAAFB live-scores (test + deploy)
    needs: [approval, infra]
    if: |
      always() &&
      (needs.approval.result == 'success' || needs.approval.result == 'skipped')
    uses: ./.github/workflows/zip_lambda_deploy.yml
    secrets: inherit
    with:
      sport: 'NCAAFB'
      function_name: ${{ needs.infra.outputs.ncaafb_live_scores_function_name }}
      test_path: 'Source/tests/aws-lambdas/ncaafb/test_live_scores.py Source/tests/aws-lambdas/ncaafb/test_live_scores_handler.py'
      requirements_files: 'Source/aws-lambdas/ncaafb/live-scores/requirements.txt'
      handler_dir: 'Source/aws-lambdas/ncaafb/live-scores'
      extra_source_files: 'Source/aws-lambdas/ncaafb/live-scores/live_scores.py'

  data_pipeline:
    name: Data pipeline
    needs: infra
    uses: ./.github/workflows/data_pipeline.yml
    secrets: inherit
    with:
      sport: 'NCAAFB'
      ingest_function_name: ${{ needs.infra.outputs.ncaafb_ingest_function_name }}
      ingest_test_path: >-
        Source/tests/aws-lambdas/ncaafb/test_ingest_lambda_handler.py
        Source/tests/aws-lambdas/ncaafb/test_ingest_enrichment.py
      ingest_requirements_files: 'Source/aws-lambdas/ncaafb/ingest/requirements.txt'
      ingest_handler_dir: 'Source/aws-lambdas/ncaafb/ingest'
      ingest_extra_source_files: 'Source/aws-lambdas/ncaafb/ingest/enrichment.py'
      normalize_function_name: ${{ needs.infra.outputs.ncaafb_normalize_function_name }}
      normalize_test_path: 'Source/tests/aws-lambdas/ncaafb/test_normalize.py'
      normalize_requirements_files: 'Source/aws-lambdas/ncaafb/normalize/requirements.txt'
      normalize_handler_dir: 'Source/aws-lambdas/ncaafb/normalize'
      schedule_sync_function_name: ${{ needs.infra.outputs.ncaafb_schedule_sync_function_name }}
      schedule_sync_test_path: 'Source/tests/aws-lambdas/ncaafb/test_schedule_sync.py'
      schedule_sync_requirements_files: 'Source/aws-lambdas/ncaafb/schedule-sync/requirements.txt'
      schedule_sync_handler_dir: 'Source/aws-lambdas/ncaafb/schedule-sync'
