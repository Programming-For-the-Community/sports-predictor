# Top-level NCAAFB deploy pipeline. Runs on every push to an ncaafb*/
# ncaa-fb* branch, pausing for manual approval (via the environment's
# required reviewers, configured in Settings > Environments) before
# doing anything.

name: NCAAFB Deploy

on:
  workflow_dispatch:
  push:
    branches:
      - 'ncaafb*'
      - 'ncaafb/*'
      - 'ncaa-fb*'
      - 'ncaa-fb/*'
  workflow_call:

# Shared group across all workflows that reach tf_install.yml's terraform
# apply, since Terraform state is shared across sports.
concurrency:
  group: terraform-deploy-pipeline
  cancel-in-progress: false

permissions:
  id-token: write
  contents: read

jobs:
  approval:
    name: Await deployment approval
    if: github.event_name != 'workflow_call'
    runs-on: ubuntu-latest
    environment: development
    steps:
      - name: Approved
        run: echo "Deployment approved -- proceeding."

  backfill:
    name: Historical backfill (build)
    needs: approval
    if: |
      always() &&
      (needs.approval.result == 'success' || needs.approval.result == 'skipped')
    uses: ./.github/workflows/ncaafb_backfill.yml
    secrets: inherit

  ai_training:
    name: AI training (build)
    needs: approval
    if: |
      always() &&
      (needs.approval.result == 'success' || needs.approval.result == 'skipped')
    uses: ./.github/workflows/ncaafb_ai_training.yml
    secrets: inherit

  ai_hosting:
    name: AI hosting (build)
    needs: approval
    if: |
      always() &&
      (needs.approval.result == 'success' || needs.approval.result == 'skipped')
    uses: ./.github/workflows/ncaafb_ai_hosting.yml
    secrets: inherit

  infra:
    name: Apply shared infrastructure
    needs: [backfill, ai_training, ai_hosting]
    if: |
      always() &&
      (needs.backfill.result == 'success' || needs.backfill.result == 'skipped') &&
      (needs.ai_training.result == 'success' || needs.ai_training.result == 'skipped') &&
      (needs.ai_hosting.result == 'success' || needs.ai_hosting.result == 'skipped')
    uses: ./.github/workflows/tf_install.yml
    secrets: inherit

  data_pipeline:
    name: Data pipeline
    needs: infra
    uses: ./.github/workflows/ncaafb_data_pipeline.yml
    secrets: inherit
    with:
      ingest_function_name: ${{ needs.infra.outputs.ncaafb_ingest_function_name }}
      normalize_function_name: ${{ needs.infra.outputs.ncaafb_normalize_function_name }}
      schedule_sync_function_name: ${{ needs.infra.outputs.ncaafb_schedule_sync_function_name }}

  shared_lambdas_deploy:
    name: Shared lambdas (deploy)
    needs: infra
    uses: ./.github/workflows/shared_lambdas_deploy.yml
    secrets: inherit
    with:
      season_gate_function_name: ${{ needs.infra.outputs.season_gate_function_name }}

  deploy_predict_lambda:
    name: AI hosting (deploy)
    needs: [infra, ai_hosting]
    uses: ./.github/workflows/ncaafb_predict_deploy.yml
    secrets: inherit
    with:
      function_name: ${{ needs.infra.outputs.ncaafb_predict_function_name }}
      image_uri: ${{ needs.ai_hosting.outputs.predict_image_uri }}

  predict_read_deploy:
    name: NCAAFB predict-read (test + deploy)
    needs: [approval, infra]
    if: |
      always() &&
      (needs.approval.result == 'success' || needs.approval.result == 'skipped')
    uses: ./.github/workflows/ncaafb_predict_read_deploy.yml
    secrets: inherit
    with:
      function_name: ${{ needs.infra.outputs.ncaafb_predict_read_function_name }}

  live_scores_deploy:
    name: NCAAFB live-scores (test + deploy)
    needs: [approval, infra]
    if: |
      always() &&
      (needs.approval.result == 'success' || needs.approval.result == 'skipped')
    uses: ./.github/workflows/ncaafb_live_scores_deploy.yml
    secrets: inherit
    with:
      function_name: ${{ needs.infra.outputs.ncaafb_live_scores_function_name }}
