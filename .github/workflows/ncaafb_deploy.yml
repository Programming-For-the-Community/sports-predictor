# Top-level NCAAFB deploy pipeline. Runs on every push to an ncaafb*
# branch, but pauses for manual approval (via the environment's required
# reviewers -- configure this in Settings > Environments, it can't be set
# from this file) before doing anything.
#
# Exactly one SonarQube Cloud scan for this whole pipeline: every
# component's own test job runs directly against run_python_tests.yml
# (not nested inside a category workflow, since a scan job can't depend on
# jobs nested inside a called reusable workflow -- only a sibling job in
# the SAME file), `scan` needs all of them, and every build/deploy job
# needs `scan`.

name: NCAAFB Deploy

on:
  workflow_dispatch:
  push:
    branches:
      - 'ncaafb*'
  workflow_call:

# Shared group across every workflow that can reach tf_install.yml's
# terraform apply, since Terraform/main.tf's S3 backend has no state
# locking configured.
concurrency:
  group: terraform-deploy-pipeline
  cancel-in-progress: false

permissions:
  id-token: write
  contents: read
  actions: read

jobs:
  approval:
    name: Await deployment approval
    if: github.event_name != 'workflow_call'
    runs-on: ubuntu-latest
    environment: development
    steps:
      - name: Approved
        run: echo "Deployment approved -- proceeding."

  # Each test job below repeats the same tolerant check against `approval`
  # directly -- approval is intentionally skipped (not failed) when called
  # via workflow_call, and without this tolerant check a skipped `needs`
  # job would cause everything downstream to be skipped too.
  test-backfill:
    name: Run NCAAFB backfill tests
    needs: approval
    if: |
      always() &&
      (needs.approval.result == 'success' || needs.approval.result == 'skipped')
    uses: ./.github/workflows/run_python_tests.yml
    with:
      test_path: 'Source/tests/data-backfills/ncaafb/'
      requirements_files: 'Source/data-backfills/ncaafb/requirements-dev.txt'

  test-feature-engineering:
    name: Run NCAAFB feature engineering tests
    needs: approval
    if: |
      always() &&
      (needs.approval.result == 'success' || needs.approval.result == 'skipped')
    uses: ./.github/workflows/run_python_tests.yml
    with:
      test_path: 'Source/tests/library/ Source/tests/feature-engineering/ncaafb/ --ignore=Source/tests/library/ml'
      requirements_files: 'Source/feature-engineering/ncaafb/requirements.in'

  # Covers every model-training/ncaafb/*.py script, including the ranking
  # model script -- feeds both build-train-model-image and
  # build-ranking-model-image below.
  test-train-models:
    name: Run NCAAFB training model tests
    needs: approval
    if: |
      always() &&
      (needs.approval.result == 'success' || needs.approval.result == 'skipped')
    uses: ./.github/workflows/run_python_tests.yml
    with:
      test_path: 'Source/tests/library/ Source/tests/model-training/ncaafb/'
      requirements_files: 'Source/model-training/ncaafb/requirements.in'

  test-predict:
    name: Run NCAAFB predict tests
    needs: approval
    if: |
      always() &&
      (needs.approval.result == 'success' || needs.approval.result == 'skipped')
    uses: ./.github/workflows/run_python_tests.yml
    with:
      test_path: >-
        Source/tests/library/
        Source/tests/aws-lambdas/ncaafb/test_live_features.py
        Source/tests/aws-lambdas/ncaafb/test_event_prediction.py
        Source/tests/aws-lambdas/ncaafb/test_predict_handler.py
        Source/tests/aws-lambdas/ncaafb/test_season_simulation.py
        Source/tests/aws-lambdas/ncaafb/test_season_projection.py
      requirements_files: 'Source/aws-lambdas/ncaafb/predict/requirements.in Source/aws-lambdas/ncaafb/predict/requirements-nodeps.in'

  test-live-scores:
    name: Run NCAAFB live-scores tests
    needs: approval
    if: |
      always() &&
      (needs.approval.result == 'success' || needs.approval.result == 'skipped')
    uses: ./.github/workflows/run_python_tests.yml
    with:
      test_path: 'Source/tests/aws-lambdas/ncaafb/test_live_scores.py Source/tests/aws-lambdas/ncaafb/test_live_scores_handler.py'
      requirements_files: 'Source/aws-lambdas/ncaafb/live-scores/requirements.txt'

  test-ingest:
    name: Run NCAAFB ingest tests
    needs: approval
    if: |
      always() &&
      (needs.approval.result == 'success' || needs.approval.result == 'skipped')
    uses: ./.github/workflows/run_python_tests.yml
    with:
      test_path: >-
        Source/tests/aws-lambdas/ncaafb/test_ingest_lambda_handler.py
        Source/tests/aws-lambdas/ncaafb/test_ingest_enrichment.py
      requirements_files: 'Source/aws-lambdas/ncaafb/ingest/requirements.txt'

  test-normalize:
    name: Run NCAAFB normalize tests
    needs: approval
    if: |
      always() &&
      (needs.approval.result == 'success' || needs.approval.result == 'skipped')
    uses: ./.github/workflows/run_python_tests.yml
    with:
      test_path: 'Source/tests/aws-lambdas/ncaafb/test_normalize.py'
      requirements_files: 'Source/aws-lambdas/ncaafb/normalize/requirements.txt'

  test-schedule-sync:
    name: Run NCAAFB schedule-sync tests
    needs: approval
    if: |
      always() &&
      (needs.approval.result == 'success' || needs.approval.result == 'skipped')
    uses: ./.github/workflows/run_python_tests.yml
    with:
      test_path: 'Source/tests/aws-lambdas/ncaafb/test_schedule_sync.py'
      requirements_files: 'Source/aws-lambdas/ncaafb/schedule-sync/requirements.txt'

  scan:
    name: SonarQube Cloud scan
    needs: [
      test-backfill, test-feature-engineering, test-train-models, test-predict,
      test-live-scores, test-ingest, test-normalize, test-schedule-sync,
    ]
    # always() -- see app_deploy.yml's own copy of this comment: gating on
    # every listed test job being success-or-skipped meant one flaky/
    # failing test anywhere skipped this job entirely, cascading to skip
    # every downstream build/deploy job below (`needs: scan`, default
    # `if: success()`).
    if: always()
    uses: ./.github/workflows/sonar_scan.yml
    secrets: inherit
    with:
      environment: ${{ github.event.inputs.environment || 'development' }}
      parent_workflow: ${{ github.workflow }}

  backfill:
    name: Historical backfill (build)
    needs: scan
    uses: ./.github/workflows/docker_image_deploy.yml
    secrets: inherit
    with:
      sport: 'NCAAFB'
      dockerfile_path: 'Source/data-backfills/ncaafb/Dockerfile'
      image_name: 'ncaafb-backfill'
      image_version: '1.0.0'

  # Builds feature engineering and win-probability/score/player-prop
  # training (shared image). National-ranking training is a separate
  # image, built below by ranking_model_build.
  ai_training:
    name: AI training (build)
    needs: scan
    uses: ./.github/workflows/ai_training.yml
    secrets: inherit
    with:
      sport: 'NCAAFB'
      feature_engineering_dockerfile_path: 'Source/feature-engineering/ncaafb/Dockerfile'
      feature_engineering_image_name: 'ncaafb-feature-engineering'
      feature_engineering_image_version: '1.0.0'
      # Also used by train_score_model.py/train_player_prop_model.py via a container command override.
      train_model_dockerfile_path: 'Source/model-training/ncaafb/Dockerfile'
      train_model_image_name: 'ncaafb-train-win-probability-model'
      train_model_image_version: '1.0.0'

  ranking_model_build:
    name: National ranking model (build)
    needs: scan
    uses: ./.github/workflows/docker_image_deploy.yml
    secrets: inherit
    with:
      sport: 'NCAAFB'
      dockerfile_path: 'Source/model-training/ncaafb/Dockerfile.ranking'
      image_name: 'ncaafb-train-ranking-model'
      image_version: '1.0.0'

  ai_hosting:
    name: AI hosting (build)
    needs: scan
    uses: ./.github/workflows/docker_image_deploy.yml
    secrets: inherit
    with:
      sport: 'NCAAFB'
      dockerfile_path: 'Source/aws-lambdas/ncaafb/predict/Dockerfile'
      image_name: 'ncaafb-predict'
      image_version: '1.0.0'
      platform: 'linux/arm64'

  # Only ai_hosting is a real dependency here -- see app_deploy.yml's own
  # infra job comment for why backfill/ai_training images aren't a
  # terraform-apply-time dependency at all.
  infra:
    name: Apply shared infrastructure
    needs: [ai_hosting]
    uses: ./.github/workflows/tf_install.yml
    secrets: inherit

  deploy_predict_lambda:
    name: AI hosting (deploy)
    needs: [infra, ai_hosting]
    uses: ./.github/workflows/docker_lambda_deploy.yml
    secrets: inherit
    with:
      function_name: ${{ needs.infra.outputs.ncaafb_predict_function_name }}
      image_tag: ${{ needs.ai_hosting.outputs.image_tag }}
      default_image_tag: 'ncaafb-predict-latest'

  live_scores_deploy:
    name: NCAAFB live-scores (deploy)
    needs: [scan, infra]
    uses: ./.github/workflows/zip_lambda_deploy.yml
    secrets: inherit
    with:
      sport: 'NCAAFB'
      function_name: ${{ needs.infra.outputs.ncaafb_live_scores_function_name }}
      handler_dir: 'Source/aws-lambdas/ncaafb/live-scores'
      extra_source_files: 'Source/aws-lambdas/ncaafb/live-scores/live_scores.py'

  data_pipeline:
    name: Data pipeline
    needs: [scan, infra]
    uses: ./.github/workflows/data_pipeline.yml
    secrets: inherit
    with:
      sport: 'NCAAFB'
      ingest_function_name: ${{ needs.infra.outputs.ncaafb_ingest_function_name }}
      ingest_handler_dir: 'Source/aws-lambdas/ncaafb/ingest'
      ingest_extra_source_files: 'Source/aws-lambdas/ncaafb/ingest/enrichment.py'
      normalize_function_name: ${{ needs.infra.outputs.ncaafb_normalize_function_name }}
      normalize_handler_dir: 'Source/aws-lambdas/ncaafb/normalize'
      schedule_sync_function_name: ${{ needs.infra.outputs.ncaafb_schedule_sync_function_name }}
      schedule_sync_handler_dir: 'Source/aws-lambdas/ncaafb/schedule-sync'
