# Top-level NCAAFB deploy pipeline. Runs on every push to an ncaafb*/
# ncaa-fb* branch, but pauses for manual approval (via the environment's
# required reviewers -- configure this in Settings > Environments, it
# can't be set from this file) before doing anything. Mirrors
# nfl_deploy.yml's shape and reasoning exactly.
#
# Deliberately trimmed vs. nfl_deploy.yml today: only backfill and the
# ingest/normalize/schedule-sync data pipeline exist as real CI workflows
# so far (see project plan's build order -- training/inference/live-
# scores land in later phases). Add jobs here the same way NFL has them,
# in this order, as each phase's own workflow file gets built:
#   - ai_training (needs: approval; feeds into `infra`'s needs/if, same
#     shape as `backfill` below)
#   - ai_hosting (same)
#   - deploy_predict_lambda, predict_read_deploy, live_scores_deploy
#     (needs: [infra, ai_hosting] or [approval, infra] -- see
#     nfl_deploy.yml's own versions of these jobs for the exact shape)
# tf_install.yml already exposes every ncaafb_*_function_name output
# these future jobs will need (added alongside this file), so none of
# that wiring should be missing when those phases land.
#
# Both this job's `approval` step AND tf_install.yml's own terraform job
# gate on the `development`/`production` environment, so a run through
# this pipeline prompts for approval twice -- same accepted tradeoff
# nfl_deploy.yml's own comment documents (keeping tf_install.yml's
# environment always attached, for its environment-scoped secrets/
# variables, matters more than avoiding a second click).

name: NCAAFB Deploy

on:
  workflow_dispatch:
  push:
    branches:
      - 'ncaafb*'
      - 'ncaafb/*'
      - 'ncaa-fb*'
      - 'ncaa-fb/*'
  workflow_call:

# Shared with every other workflow that can reach tf_install.yml's
# terraform apply -- Terraform/main.tf's S3 backend has no state locking
# configured, and this is one shared Terraform state for every sport, not
# one per sport. See app_deploy.yml/nfl_deploy.yml's own identical comment.
concurrency:
  group: terraform-deploy-pipeline
  cancel-in-progress: false

permissions:
  id-token: write
  contents: read

jobs:
  approval:
    name: Await deployment approval
    if: github.event_name != 'workflow_call'
    runs-on: ubuntu-latest
    environment: development
    steps:
      - name: Approved
        run: echo "Deployment approved -- proceeding."

  # approval is intentionally skipped (not failed) when called via
  # workflow_call -- without this, a skipped `needs` job would cause
  # everything downstream to be skipped too. Same tolerant check
  # nfl_deploy.yml's own build jobs use.
  backfill:
    name: Historical backfill (build)
    needs: approval
    if: |
      always() &&
      (needs.approval.result == 'success' || needs.approval.result == 'skipped')
    uses: ./.github/workflows/ncaafb_backfill.yml
    secrets: inherit

  infra:
    name: Apply shared infrastructure
    needs: backfill
    if: |
      always() &&
      (needs.backfill.result == 'success' || needs.backfill.result == 'skipped')
    uses: ./.github/workflows/tf_install.yml
    secrets: inherit

  data_pipeline:
    name: Data pipeline
    needs: infra
    uses: ./.github/workflows/ncaafb_data_pipeline.yml
    secrets: inherit
    with:
      ingest_function_name: ${{ needs.infra.outputs.ncaafb_ingest_function_name }}
      normalize_function_name: ${{ needs.infra.outputs.ncaafb_normalize_function_name }}
      schedule_sync_function_name: ${{ needs.infra.outputs.ncaafb_schedule_sync_function_name }}
