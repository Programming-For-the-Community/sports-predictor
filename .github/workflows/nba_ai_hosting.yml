# Builds, tests, and pushes the NBA AI hosting/inference image. Runs
# standalone (workflow_dispatch) or called from nba_deploy.yml
# (workflow_call) -- mirrors nfl_ai_hosting.yml's/ncaafb_ai_hosting.yml's
# own shape and reasoning exactly (see nfl_ai_hosting.yml's own comment
# for the full build-before-infra, deploy-after-infra ordering
# rationale).
#
# Real code as of Sub-phase 3A step 6 -- this file was a placeholder-only
# stub from 2026-08-14 through step 5 (see project-nba-onboarding memory
# for why ai_hosting had to exist that early: aws_lambda_function.
# nba_predict is a container-image Lambda, and CreateFunction validates
# its image tag already exists in ECR before Terraform can create it).
# The test job is back, and docker_context changed from this directory to
# 'Source' now that the real Dockerfile COPYs library/ from there (see
# Source/aws-lambdas/nba/predict/Dockerfile's own comment) -- nothing else
# about this file's shape needed to change.
#
# Container image, not the zip packaging ingest/normalize/schedule-sync
# use (see python_lambda_build.yml) -- same xgboost/numpy/scipy size
# reasoning as nfl_ai_hosting.yml's own comment.

name: NBA AI Hosting

on:
  workflow_dispatch:
  workflow_call:
    outputs:
      predict_image_uri:
        description: 'Versioned tag of the pushed nba-predict image, for nba_predict_deploy.yml to point the Lambda at'
        value: ${{ jobs.build-predict-image.outputs.versioned_tag }}

env:
  PREDICT_IMAGE_VERSION: '1.0.0'

permissions:
  id-token: write
  contents: read

jobs:
  test-predict:
    name: Run nba-predict tests
    uses: ./.github/workflows/run_python_tests.yml
    with:
      test_path: >-
        Source/tests/library/
        Source/tests/aws-lambdas/nba/test_live_features.py
        Source/tests/aws-lambdas/nba/test_event_prediction.py
        Source/tests/aws-lambdas/nba/test_predict_handler.py
        Source/tests/aws-lambdas/nba/test_season_simulation.py
        Source/tests/aws-lambdas/nba/test_predict_season_simulation.py
      # Both requirements files -- requirements-nodeps.txt (xgboost, only
      # ever installed --no-deps in the real Dockerfile build to dodge its
      # nvidia-nccl-cu12 GPU dependency) still needs to be installed HERE
      # for xgboost itself to be importable at all in this test job. Same
      # reasoning as nfl_ai_hosting.yml's own identical comment.
      requirements_files: 'Source/aws-lambdas/nba/predict/requirements.txt Source/aws-lambdas/nba/predict/requirements-nodeps.txt'

  set-versions:
    name: Resolve image versions
    runs-on: ubuntu-latest
    outputs:
      predict_version: ${{ steps.out.outputs.predict_version }}
    steps:
      - id: out
        run: echo "predict_version=${{ env.PREDICT_IMAGE_VERSION }}" >> "$GITHUB_OUTPUT"

  build-predict-image:
    name: Build and push predict image
    needs: [set-versions, test-predict]
    uses: ./.github/workflows/docker_build_push.yml
    secrets: inherit
    with:
      dockerfile_path: 'Source/aws-lambdas/nba/predict/Dockerfile'
      docker_context: 'Source'
      image_name: 'nba-predict'
      image_version: ${{ needs.set-versions.outputs.predict_version }}
      # arm64 -- matches aws_lambda_function.nba_predict's own
      # architectures = ["arm64"] (Terraform/lambda-nba-predict.tf).
      platform: 'linux/arm64'
