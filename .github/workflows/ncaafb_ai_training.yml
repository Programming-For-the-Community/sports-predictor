# Runs tests, scans with SonarQube Cloud, then builds and pushes the
# NCAAFB training images: feature engineering, win-probability/score/
# player-prop training (shared image), and national-ranking training
# (separate image). Each image has its own version constant, bumped
# independently. One scan gates all three builds -- SonarQube Cloud
# analyzes the whole repo either way, so there's no value in scanning
# three times per pipeline run.

name: NCAAFB AI Training

on:
  workflow_dispatch:
  workflow_call:

env:
  FEATURE_ENGINEERING_IMAGE_VERSION: '1.0.0'
  TRAIN_WIN_PROBABILITY_MODEL_IMAGE_VERSION: '1.0.0'
  TRAIN_RANKING_MODEL_IMAGE_VERSION: '1.0.0'

permissions:
  id-token: write
  contents: read

jobs:
  test-feature-engineering:
    name: Run feature engineering tests
    uses: ./.github/workflows/run_python_tests.yml
    with:
      test_path: 'Source/tests/library/ Source/tests/feature-engineering/ncaafb/ --ignore=Source/tests/library/ml'
      requirements_files: 'Source/feature-engineering/ncaafb/requirements.txt'

  test-train-models:
    name: Run training model tests
    uses: ./.github/workflows/run_python_tests.yml
    with:
      test_path: 'Source/tests/library/ Source/tests/model-training/ncaafb/'
      requirements_files: 'Source/model-training/ncaafb/requirements.txt'

  scan:
    name: SonarQube Cloud scan
    needs: [test-feature-engineering, test-train-models]
    uses: ./.github/workflows/sonar_scan.yml
    secrets: inherit

  set-versions:
    name: Resolve image versions
    runs-on: ubuntu-latest
    outputs:
      feature_engineering_version: ${{ steps.out.outputs.feature_engineering_version }}
      train_win_probability_model_version: ${{ steps.out.outputs.train_win_probability_model_version }}
      train_ranking_model_version: ${{ steps.out.outputs.train_ranking_model_version }}
    steps:
      - id: out
        run: |
          echo "feature_engineering_version=${{ env.FEATURE_ENGINEERING_IMAGE_VERSION }}" >> "$GITHUB_OUTPUT"
          echo "train_win_probability_model_version=${{ env.TRAIN_WIN_PROBABILITY_MODEL_IMAGE_VERSION }}" >> "$GITHUB_OUTPUT"
          echo "train_ranking_model_version=${{ env.TRAIN_RANKING_MODEL_IMAGE_VERSION }}" >> "$GITHUB_OUTPUT"

  build-feature-engineering-image:
    name: Build feature engineering image
    needs: [set-versions, scan]
    uses: ./.github/workflows/docker_build.yml
    secrets: inherit
    with:
      dockerfile_path: 'Source/feature-engineering/ncaafb/Dockerfile'
      docker_context: 'Source'
      image_name: 'ncaafb-feature-engineering'
      image_version: ${{ needs.set-versions.outputs.feature_engineering_version }}

  push-feature-engineering-image:
    name: Push feature engineering image
    needs: build-feature-engineering-image
    uses: ./.github/workflows/docker_push.yml
    secrets: inherit
    with:
      artifact_name: ${{ needs.build-feature-engineering-image.outputs.artifact_name }}
      versioned_tag: ${{ needs.build-feature-engineering-image.outputs.versioned_tag }}
      latest_tag: ${{ needs.build-feature-engineering-image.outputs.latest_tag }}

  # Also used by train_score_model.py/train_player_prop_model.py via a container command override.
  build-train-win-probability-model-image:
    name: Build train win-probability/score/player-prop model image
    needs: [set-versions, scan]
    uses: ./.github/workflows/docker_build.yml
    secrets: inherit
    with:
      dockerfile_path: 'Source/model-training/ncaafb/Dockerfile'
      docker_context: 'Source'
      image_name: 'ncaafb-train-win-probability-model'
      image_version: ${{ needs.set-versions.outputs.train_win_probability_model_version }}

  push-train-win-probability-model-image:
    name: Push train win-probability/score/player-prop model image
    needs: build-train-win-probability-model-image
    uses: ./.github/workflows/docker_push.yml
    secrets: inherit
    with:
      artifact_name: ${{ needs.build-train-win-probability-model-image.outputs.artifact_name }}
      versioned_tag: ${{ needs.build-train-win-probability-model-image.outputs.versioned_tag }}
      latest_tag: ${{ needs.build-train-win-probability-model-image.outputs.latest_tag }}

  build-train-ranking-model-image:
    name: Build train ranking model image
    needs: [set-versions, scan]
    uses: ./.github/workflows/docker_build.yml
    secrets: inherit
    with:
      dockerfile_path: 'Source/model-training/ncaafb/Dockerfile.ranking'
      docker_context: 'Source'
      image_name: 'ncaafb-train-ranking-model'
      image_version: ${{ needs.set-versions.outputs.train_ranking_model_version }}

  push-train-ranking-model-image:
    name: Push train ranking model image
    needs: build-train-ranking-model-image
    uses: ./.github/workflows/docker_push.yml
    secrets: inherit
    with:
      artifact_name: ${{ needs.build-train-ranking-model-image.outputs.artifact_name }}
      versioned_tag: ${{ needs.build-train-ranking-model-image.outputs.versioned_tag }}
      latest_tag: ${{ needs.build-train-ranking-model-image.outputs.latest_tag }}
