# Builds and pushes the NCAAFB training images: feature engineering,
# win-probability/score/player-prop training (shared image), and
# national-ranking training (separate image). Each image has its own
# version constant, bumped independently.

name: NCAAFB AI Training

on:
  workflow_dispatch:
  workflow_call:

env:
  FEATURE_ENGINEERING_IMAGE_VERSION: '1.0.0'
  TRAIN_WIN_PROBABILITY_MODEL_IMAGE_VERSION: '1.0.0'
  TRAIN_RANKING_MODEL_IMAGE_VERSION: '1.0.0'

permissions:
  id-token: write
  contents: read

jobs:
  test-feature-engineering:
    name: Run feature engineering tests
    uses: ./.github/workflows/run_python_tests.yml
    with:
      test_path: 'Source/tests/library/ Source/tests/feature-engineering/ncaafb/ --ignore=Source/tests/library/ml'
      requirements_files: 'Source/feature-engineering/ncaafb/requirements.txt'

  test-train-models:
    name: Run training model tests
    uses: ./.github/workflows/run_python_tests.yml
    with:
      test_path: 'Source/tests/library/ Source/tests/model-training/ncaafb/'
      requirements_files: 'Source/model-training/ncaafb/requirements.txt'

  set-versions:
    name: Resolve image versions
    runs-on: ubuntu-latest
    outputs:
      feature_engineering_version: ${{ steps.out.outputs.feature_engineering_version }}
      train_win_probability_model_version: ${{ steps.out.outputs.train_win_probability_model_version }}
      train_ranking_model_version: ${{ steps.out.outputs.train_ranking_model_version }}
    steps:
      - id: out
        run: |
          echo "feature_engineering_version=${{ env.FEATURE_ENGINEERING_IMAGE_VERSION }}" >> "$GITHUB_OUTPUT"
          echo "train_win_probability_model_version=${{ env.TRAIN_WIN_PROBABILITY_MODEL_IMAGE_VERSION }}" >> "$GITHUB_OUTPUT"
          echo "train_ranking_model_version=${{ env.TRAIN_RANKING_MODEL_IMAGE_VERSION }}" >> "$GITHUB_OUTPUT"

  build-feature-engineering-image:
    name: Build and push feature engineering image
    needs: [set-versions, test-feature-engineering]
    uses: ./.github/workflows/docker_build_push.yml
    secrets: inherit
    with:
      dockerfile_path: 'Source/feature-engineering/ncaafb/Dockerfile'
      docker_context: 'Source'
      image_name: 'ncaafb-feature-engineering'
      image_version: ${{ needs.set-versions.outputs.feature_engineering_version }}

  # Also used by train_score_model.py/train_player_prop_model.py via a container command override.
  build-train-win-probability-model-image:
    name: Build and push train win-probability/score/player-prop model image
    needs: [set-versions, test-train-models]
    uses: ./.github/workflows/docker_build_push.yml
    secrets: inherit
    with:
      dockerfile_path: 'Source/model-training/ncaafb/Dockerfile'
      docker_context: 'Source'
      image_name: 'ncaafb-train-win-probability-model'
      image_version: ${{ needs.set-versions.outputs.train_win_probability_model_version }}

  build-train-ranking-model-image:
    name: Build and push train ranking model image
    needs: [set-versions, test-train-models]
    uses: ./.github/workflows/docker_build_push.yml
    secrets: inherit
    with:
      dockerfile_path: 'Source/model-training/ncaafb/Dockerfile.ranking'
      docker_context: 'Source'
      image_name: 'ncaafb-train-ranking-model'
      image_version: ${{ needs.set-versions.outputs.train_ranking_model_version }}
