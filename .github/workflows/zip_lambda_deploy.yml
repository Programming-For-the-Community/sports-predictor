# Reusable workflow: builds and deploys a single zip-packaged Lambda.
# Build+deploy only -- no test, no scan. The caller is responsible for
# testing the relevant code and running exactly one SonarQube Cloud scan
# per pipeline run (gating this job on that scan via `needs:`), since a
# scan job can't depend on jobs nested inside a called reusable workflow --
# only a sibling job in the SAME calling file can be a `needs:` target.
# See nfl_deploy.yml/app_deploy.yml for the pattern: explicit `test-*`
# jobs, one shared `scan` job needing all of them, then this workflow
# needing `scan`.
#
# Generic single-Lambda pattern -- used for any Lambda that gets its own
# dedicated test suite and doesn't share a scan with sibling Lambdas
# (predict-read, live-scores today). Multi-Lambda files that deliberately
# share ONE scan across several Lambdas (data_pipeline.yml,
# shared_lambdas_deploy.yml) call python_lambda_build.yml/
# python_lambda_deploy.yml directly instead of this file.

name: Zip Lambda Deploy

on:
  workflow_dispatch:
    inputs: &inputs
      sport:
        description: 'Sport display name for job labels (e.g. NFL, PGA)'
        required: true
        type: string
      function_name:
        description: 'Lambda function name'
        required: true
        type: string
      handler_dir:
        description: 'Relative path to the directory containing handler.py and requirements.txt'
        required: true
        type: string
      extra_source_files:
        description: 'Space-separated list of extra source files to copy into the ZIP root (e.g. live_scores.py) -- leave blank if none'
        required: false
        type: string
        default: ''
  workflow_call:
    inputs: *inputs

permissions:
  id-token: write
  contents: read

jobs:
  build:
    name: Build ${{ inputs.sport }} Lambda
    uses: ./.github/workflows/python_lambda_build.yml
    with:
      function_name: ${{ inputs.function_name }}
      handler_dir: ${{ inputs.handler_dir }}
      library_path: 'Source/library'
      extra_source_files: ${{ inputs.extra_source_files }}

  deploy:
    name: Deploy ${{ inputs.sport }} Lambda
    needs: build
    uses: ./.github/workflows/python_lambda_deploy.yml
    secrets: inherit
    with:
      function_name: ${{ inputs.function_name }}
      artifact_name: ${{ needs.build.outputs.artifact_name }}
