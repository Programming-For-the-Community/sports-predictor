# Reusable workflow: installs the shared library package plus whatever
# additional requirements files a caller needs, then runs pytest against a
# given test path. This is the single test gate every Python artifact
# (Lambda or Fargate task) deploy/build depends on -- each caller passes
# its OWN test_path and requirements_files, so one artifact's test
# failure only blocks that artifact's own job, never an unrelated one's.
# Before this existed, multiple artifacts sharing one test job (or one
# workflow_call's test_dir pointed at a whole directory instead of a
# specific file) meant an ingest test failure could fail a normalize
# deploy, or a model-training test failure could block a feature-
# engineering image build, even though the two were otherwise unrelated.

name: Run Python Tests

on:
  workflow_call:
    inputs:
      test_path:
        description: 'Path(s) to the pytest test file(s)/directory(ies) to run, space-separated'
        required: true
        type: string
      requirements_files:
        description: 'Space-separated list of additional requirements.txt files to install beyond Source/library itself (leave empty if none needed)'
        required: false
        type: string
        default: ''
      python_version:
        description: 'Python version to run tests with'
        required: false
        type: string
        default: '3.12'

jobs:
  test:
    name: Run tests
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python ${{ inputs.python_version }}
        uses: actions/setup-python@v5
        with:
          python-version: ${{ inputs.python_version }}

      - name: Install library package
        run: pip install --no-cache-dir ./Source/library

      - name: Install additional requirements
        if: inputs.requirements_files != ''
        run: |
          for f in ${{ inputs.requirements_files }}; do
            pip install --no-cache-dir -r "$f"
          done

      - name: Install pytest
        run: pip install --no-cache-dir pytest

      - name: Run tests
        run: pytest ${{ inputs.test_path }} -v
