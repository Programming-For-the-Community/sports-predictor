# Reusable workflow: installs the shared library package plus whatever
# additional requirements files a caller needs, then runs pytest against a
# given test path. Each caller passes its own test_path and
# requirements_files.
#
# Also collects coverage (--cov=Source) and uploads the raw .coverage data
# file as an artifact, named from a hash of test_path so the ~90 separate
# calls to this workflow across every pipeline never collide. sonar_scan.yml
# downloads and combines every one of these before running its scan --
# since scan always transitively depends on the test jobs before it (GitHub
# Actions artifacts are run-scoped, not job-scoped), this needs no changes
# to any caller's own job graph.

name: Run Python Tests

on:
  workflow_call:
    inputs:
      test_path:
        description: 'Path(s) to the pytest test file(s)/directory(ies) to run, space-separated'
        required: true
        type: string
      requirements_files:
        description: 'Space-separated list of additional requirements.txt files to install beyond Source/library itself (leave empty if none needed)'
        required: false
        type: string
        default: ''
      python_version:
        description: 'Python version to run tests with'
        required: false
        type: string
        default: '3.12'

jobs:
  test:
    name: Run tests
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python ${{ inputs.python_version }}
        uses: actions/setup-python@v5
        with:
          python-version: ${{ inputs.python_version }}

      - name: Install library package
        run: pip install --no-cache-dir ./Source/library

      - name: Install additional requirements
        if: inputs.requirements_files != ''
        run: |
          for f in ${{ inputs.requirements_files }}; do
            case "$f" in
              *requirements-nodeps.*) pip install --no-cache-dir --only-binary :all: --no-deps -r "$f" ;;
              *)                      pip install --no-cache-dir --only-binary :all: -r "$f" ;;
            esac
          done

      # Matches every requirements-dev.txt's own pytest pin.
      - name: Install pytest
        run: 'pip install --no-cache-dir --only-binary :all: pytest==8.0.2 pytest-cov==5.0.0 coverage==7.4.4'

      - name: Run tests
        run: pytest ${{ inputs.test_path }} -v --cov=Source --cov-report=

      - name: Resolve coverage artifact name
        id: cov_name
        run: echo "name=coverage-$(echo -n '${{ inputs.test_path }}' | md5sum | cut -c1-12)" >> "$GITHUB_OUTPUT"

      - name: Upload coverage data
        uses: actions/upload-artifact@v4
        with:
          name: ${{ steps.cov_name.outputs.name }}
          path: .coverage
          retention-days: 1
          if-no-files-found: ignore
