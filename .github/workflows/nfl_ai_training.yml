# Builds, packages, and deploys the NFL AI training code. Runs standalone
# (workflow_dispatch) or called from nfl_deploy.yml (workflow_call) --
# either way the work is identical: build and push image(s).
#
# This stage builds more than one image (see design/ARCHITECTURE.md's
# "Scheduled Training" subgraph: separate Feature Engineering and Train
# Model Fargate tasks). Both exist now; a future score-margin or
# player-prop training task would get its own job here too, shaped
# exactly like the two below.
#
# Each image gets its OWN version constant below, bumped independently --
# feature engineering and train model are unrelated Fargate tasks with
# unrelated code, so a change to one has no reason to force a version bump
# (and a new image tag/deploy) of the other. Bump only the constant for
# whichever image actually changed, never both just to keep them in sync.

name: NFL AI Training

on:
  workflow_dispatch:
  workflow_call:

env:
  FEATURE_ENGINEERING_IMAGE_VERSION: '1.0.0'
  TRAIN_MODEL_IMAGE_VERSION: '1.0.0'

permissions:
  id-token: write
  contents: read

jobs:
  # Two independent test jobs, not one shared one -- a failing
  # model-training test used to fail feature engineering's deployment too
  # (and vice versa) purely because they shared one test job both image
  # builds depended on, even though the two Fargate tasks are otherwise
  # unrelated. Each re-runs Source/tests/library/ redundantly (a
  # ~1-second cost) rather than trying to split library tests by exact
  # consumer -- library.aws.dynamodb_table, for instance, is used by
  # both, so there's no clean partition anyway.
  test-feature-engineering:
    name: Run feature engineering tests
    uses: ./.github/workflows/run_python_tests.yml
    with:
      test_path: 'Source/tests/library/ Source/tests/feature-engineering/'
      requirements_files: 'Source/feature-engineering/nfl/requirements.txt'

  test-train-model:
    name: Run train model tests
    uses: ./.github/workflows/run_python_tests.yml
    with:
      test_path: 'Source/tests/library/ Source/tests/model-training/'
      requirements_files: 'Source/model-training/nfl/requirements.txt'

  set-versions:
    name: Resolve image versions
    runs-on: ubuntu-latest
    outputs:
      feature_engineering_version: ${{ steps.out.outputs.feature_engineering_version }}
      train_model_version: ${{ steps.out.outputs.train_model_version }}
    steps:
      - id: out
        run: |
          echo "feature_engineering_version=${{ env.FEATURE_ENGINEERING_IMAGE_VERSION }}" >> "$GITHUB_OUTPUT"
          echo "train_model_version=${{ env.TRAIN_MODEL_IMAGE_VERSION }}" >> "$GITHUB_OUTPUT"

  build-feature-engineering-image:
    name: Build and push feature engineering image
    needs: [set-versions, test-feature-engineering]
    uses: ./.github/workflows/docker_build_push.yml
    secrets: inherit
    with:
      dockerfile_path: 'Source/feature-engineering/nfl/Dockerfile'
      docker_context: 'Source'
      image_name: 'nfl-feature-engineering'
      image_version: ${{ needs.set-versions.outputs.feature_engineering_version }}

  build-train-model-image:
    name: Build and push train model image
    needs: [set-versions, test-train-model]
    uses: ./.github/workflows/docker_build_push.yml
    secrets: inherit
    with:
      dockerfile_path: 'Source/model-training/nfl/Dockerfile'
      docker_context: 'Source'
      image_name: 'nfl-train-model'
      image_version: ${{ needs.set-versions.outputs.train_model_version }}
