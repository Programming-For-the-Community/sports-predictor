# Builds and pushes the NFL training images: feature engineering and
# win-probability model training. Each image has its own version
# constant, bumped independently.

name: NFL AI Training

on:
  workflow_dispatch:
  workflow_call:

env:
  FEATURE_ENGINEERING_IMAGE_VERSION: '1.0.0'
  TRAIN_WIN_PROBABILITY_MODEL_IMAGE_VERSION: '1.0.0'

permissions:
  id-token: write
  contents: read

jobs:
  test-feature-engineering:
    name: Run feature engineering tests
    uses: ./.github/workflows/run_python_tests.yml
    with:
      test_path: 'Source/tests/library/ Source/tests/feature-engineering/nfl/ --ignore=Source/tests/library/ml'
      requirements_files: 'Source/feature-engineering/nfl/requirements.txt'

  test-train-win-probability-model:
    name: Run train win-probability model tests
    uses: ./.github/workflows/run_python_tests.yml
    with:
      test_path: 'Source/tests/library/ Source/tests/model-training/nfl/'
      requirements_files: 'Source/model-training/nfl/requirements.txt'

  set-versions:
    name: Resolve image versions
    runs-on: ubuntu-latest
    outputs:
      feature_engineering_version: ${{ steps.out.outputs.feature_engineering_version }}
      train_win_probability_model_version: ${{ steps.out.outputs.train_win_probability_model_version }}
    steps:
      - id: out
        run: |
          echo "feature_engineering_version=${{ env.FEATURE_ENGINEERING_IMAGE_VERSION }}" >> "$GITHUB_OUTPUT"
          echo "train_win_probability_model_version=${{ env.TRAIN_WIN_PROBABILITY_MODEL_IMAGE_VERSION }}" >> "$GITHUB_OUTPUT"

  build-feature-engineering-image:
    name: Build and push feature engineering image
    needs: [set-versions, test-feature-engineering]
    uses: ./.github/workflows/docker_build_push.yml
    secrets: inherit
    with:
      dockerfile_path: 'Source/feature-engineering/nfl/Dockerfile'
      docker_context: 'Source'
      image_name: 'nfl-feature-engineering'
      image_version: ${{ needs.set-versions.outputs.feature_engineering_version }}

  build-train-win-probability-model-image:
    name: Build and push train win-probability model image
    needs: [set-versions, test-train-win-probability-model]
    uses: ./.github/workflows/docker_build_push.yml
    secrets: inherit
    with:
      dockerfile_path: 'Source/model-training/nfl/Dockerfile'
      docker_context: 'Source'
      image_name: 'nfl-train-win-probability-model'
      image_version: ${{ needs.set-versions.outputs.train_win_probability_model_version }}
