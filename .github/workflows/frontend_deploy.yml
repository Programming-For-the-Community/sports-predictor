# Top-level frontend deploy pipeline: push to a branch prefix,
# workflow_dispatch, workflow_call, an approval gate.
#
# Terraform is one shared state/config for the whole account, so a push
# to a front-end branch applies the full config via tf_install.yml.
#
# S3/CloudFront have no build-before-infra ordering requirement, so here
# `infra` runs first, and test/scan/build_frontend/deploy_frontend all run
# after.
#
# Exactly one SonarQube Cloud scan for this whole pipeline -- test-frontend
# runs `flutter test` directly (frontend_hosting.yml itself is build-only,
# since a scan job can't depend on jobs nested inside a called reusable
# workflow) and `scan` gates build_frontend on it.

name: Frontend Deploy

on:
  workflow_dispatch:
  push:
    branches:
      - 'frontend/**'
      - 'front-end*'
      - 'front-end/**'
  workflow_call:

concurrency:
  group: terraform-deploy-pipeline
  cancel-in-progress: false

permissions:
  id-token: write
  contents: read
  actions: read

env:
  FLUTTER_VERSION: '3.29.3'

jobs:
  approval:
    name: Await deployment approval
    if: github.event_name != 'workflow_call'
    runs-on: ubuntu-latest
    environment: development
    steps:
      - name: Approved
        run: echo "Deployment approved -- proceeding."

  infra:
    name: Apply shared infrastructure
    needs: approval
    if: |
      always() &&
      (needs.approval.result == 'success' || needs.approval.result == 'skipped')
    uses: ./.github/workflows/tf_install.yml
    secrets: inherit

  test-frontend:
    name: Run frontend tests
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Flutter
        uses: subosito/flutter-action@v2
        with:
          flutter-version: ${{ env.FLUTTER_VERSION }}
          channel: stable

      - name: Install dependencies
        working-directory: Source/front-end
        run: flutter pub get

      - name: Analyze
        working-directory: Source/front-end
        run: flutter analyze

      - name: Test
        working-directory: Source/front-end
        run: flutter test --coverage

      - name: Upload coverage data
        uses: actions/upload-artifact@v4
        with:
          name: dart-coverage
          path: Source/front-end/coverage/lcov.info
          retention-days: 1
          if-no-files-found: ignore

  scan:
    name: SonarQube Cloud scan
    needs: test-frontend
    uses: ./.github/workflows/sonar_scan.yml
    secrets: inherit
    with:
      environment: ${{ github.event.inputs.environment || 'development' }}
      parent_workflow: ${{ github.workflow }}

  build_frontend:
    name: Frontend hosting (build)
    needs: [infra, scan]
    uses: ./.github/workflows/frontend_hosting.yml
    secrets: inherit

  deploy_frontend:
    name: Frontend hosting (deploy)
    needs: [infra, build_frontend]
    uses: ./.github/workflows/frontend_sync_deploy.yml
    secrets: inherit
    with:
      source_run_id: ${{ github.run_id }}
