# Top-level frontend deploy pipeline: push to a branch prefix,
# workflow_dispatch, workflow_call, an approval gate.
#
# Terraform is one shared state/config for the whole account, so a push
# to a front-end branch applies the full config via tf_install.yml.
#
# S3/CloudFront have no build-before-infra ordering requirement, so here
# `infra` runs first, and build_frontend/deploy_frontend both run after.

name: Frontend Deploy

on:
  workflow_dispatch:
  push:
    branches:
      - 'frontend/**'
      - 'front-end*'
      - 'front-end/**'
  workflow_call:

# Shared group across every workflow that can reach tf_install.yml's
# terraform apply, since Terraform/main.tf's S3 backend has no state
# locking configured.
concurrency:
  group: terraform-deploy-pipeline
  cancel-in-progress: false

permissions:
  id-token: write
  contents: read
  actions: read

jobs:
  approval:
    name: Await deployment approval
    if: github.event_name != 'workflow_call'
    runs-on: ubuntu-latest
    environment: development
    steps:
      - name: Approved
        run: echo "Deployment approved -- proceeding."

  # approval is intentionally skipped (not failed) when called via
  # workflow_call.
  infra:
    name: Apply shared infrastructure
    needs: approval
    if: |
      always() &&
      (needs.approval.result == 'success' || needs.approval.result == 'skipped')
    uses: ./.github/workflows/tf_install.yml
    secrets: inherit

  # No `with:` block -- frontend_hosting.yml/frontend_sync_deploy.yml read
  # their own config directly from Terraform state. `needs: infra` still
  # enforces the ordering (S3 bucket/CloudFront distribution must exist
  # first).
  build_frontend:
    name: Frontend hosting (build)
    needs: infra
    uses: ./.github/workflows/frontend_hosting.yml
    secrets: inherit

  deploy_frontend:
    name: Frontend hosting (deploy)
    needs: [infra, build_frontend]
    uses: ./.github/workflows/frontend_sync_deploy.yml
    secrets: inherit
    with:
      source_run_id: ${{ github.run_id }}