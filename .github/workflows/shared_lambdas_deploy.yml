# Builds and deploys the season-gate Lambda (Terraform/lambda-season-gate.tf,
# shared across every sport's orchestrator state machine), the
# cloudwatch-geo-widget Lambda, and the ec2-training-reaper Lambda.
# Build+deploy only -- no test, no scan. The caller (each sport's own
# _deploy.yml and app_deploy.yml) is responsible for testing
# Source/tests/library/test_season.py, test_season_gate.py,
# test_cloudwatch_geo_widget.py, and test_ec2_training_reaper.py directly
# and folding them into that pipeline's own single SonarQube Cloud scan --
# a scan job can't depend on jobs nested inside a called reusable
# workflow, only a sibling job in the SAME calling file, so those tests
# can't live inside this file if every caller is to have exactly one scan.

name: Shared Lambdas Deploy

on:
  workflow_dispatch:
    inputs: &inputs
      season_gate_function_name:
        description: 'season-gate Lambda function name (from Terraform output season_gate_function_name)'
        required: false
        type: string
        default: 'sports-predictor-season-gate'
      cloudwatch_geo_widget_function_name:
        description: 'cloudwatch-geo-widget Lambda function name (from Terraform output cloudwatch_geo_widget_function_name)'
        required: false
        type: string
        default: 'sports-predictor-cloudwatch-geo-widget'
      ec2_training_reaper_function_name:
        description: 'ec2-training-reaper Lambda function name (from Terraform output ec2_training_reaper_function_name)'
        required: false
        type: string
        default: 'sports-predictor-ec2-training-reaper'
  workflow_call:
    inputs: *inputs

permissions:
  id-token: write
  contents: read

jobs:
  build_season_gate:
    name: Build season-gate Lambda
    uses: ./.github/workflows/python_lambda_build.yml
    with:
      function_name: ${{ inputs.season_gate_function_name || 'sports-predictor-season-gate' }}
      handler_dir: 'Source/aws-lambdas/shared/season-gate'
      library_path: 'Source/library'

  deploy_season_gate:
    name: Deploy season-gate Lambda
    needs: build_season_gate
    uses: ./.github/workflows/python_lambda_deploy.yml
    secrets: inherit
    with:
      function_name: ${{ inputs.season_gate_function_name || 'sports-predictor-season-gate' }}
      artifact_name: ${{ needs.build_season_gate.outputs.artifact_name }}

  build_cloudwatch_geo_widget:
    name: Build cloudwatch-geo-widget Lambda
    uses: ./.github/workflows/python_lambda_build.yml
    with:
      function_name: ${{ inputs.cloudwatch_geo_widget_function_name || 'sports-predictor-cloudwatch-geo-widget' }}
      handler_dir: 'Source/aws-lambdas/shared/cloudwatch-geo-widget'
      extra_source_files: 'Source/aws-lambdas/shared/cloudwatch-geo-widget/boundaries.json'

  deploy_cloudwatch_geo_widget:
    name: Deploy cloudwatch-geo-widget Lambda
    needs: build_cloudwatch_geo_widget
    uses: ./.github/workflows/python_lambda_deploy.yml
    secrets: inherit
    with:
      function_name: ${{ inputs.cloudwatch_geo_widget_function_name || 'sports-predictor-cloudwatch-geo-widget' }}
      artifact_name: ${{ needs.build_cloudwatch_geo_widget.outputs.artifact_name }}

  build_ec2_training_reaper:
    name: Build ec2-training-reaper Lambda
    uses: ./.github/workflows/python_lambda_build.yml
    with:
      function_name: ${{ inputs.ec2_training_reaper_function_name || 'sports-predictor-ec2-training-reaper' }}
      handler_dir: 'Source/aws-lambdas/shared/ec2-training-reaper'

  deploy_ec2_training_reaper:
    name: Deploy ec2-training-reaper Lambda
    needs: build_ec2_training_reaper
    uses: ./.github/workflows/python_lambda_deploy.yml
    secrets: inherit
    with:
      function_name: ${{ inputs.ec2_training_reaper_function_name || 'sports-predictor-ec2-training-reaper' }}
      artifact_name: ${{ needs.build_ec2_training_reaper.outputs.artifact_name }}
