# Runs tests, scans with SonarQube Cloud, then builds and pushes the
# NCAAFB historical backfill image (Source/data-backfills/ncaafb) -- each
# stage only runs if the one before it passed. Tests mock CFBDClient
# rather than hitting the live CFBD API.
#
# `set-version` exposes the IMAGE_VERSION env constant as a job output since
# a `uses:` job cannot read workflow-level `env:` directly in its `with:`.

name: NCAAFB Backfill

on:
  workflow_dispatch:
  workflow_call:

env:
  IMAGE_VERSION: '1.0.0'

permissions:
  id-token: write
  contents: read

jobs:
  test:
    name: Run tests
    uses: ./.github/workflows/run_python_tests.yml
    with:
      test_path: 'Source/tests/data-backfills/ncaafb/'
      requirements_files: 'Source/data-backfills/ncaafb/requirements-dev.txt'

  scan:
    name: SonarQube Cloud scan
    needs: test
    uses: ./.github/workflows/sonar_scan.yml
    secrets: inherit

  set-version:
    name: Resolve image version
    runs-on: ubuntu-latest
    outputs:
      version: ${{ steps.out.outputs.version }}
    steps:
      - id: out
        run: echo "version=${{ env.IMAGE_VERSION }}" >> "$GITHUB_OUTPUT"

  build-backfill-image:
    name: Build backfill image
    needs: [set-version, scan]
    uses: ./.github/workflows/docker_build.yml
    secrets: inherit
    with:
      dockerfile_path: 'Source/data-backfills/ncaafb/Dockerfile'
      docker_context: 'Source'
      image_name: 'ncaafb-backfill'
      image_version: ${{ needs.set-version.outputs.version }}

  push-backfill-image:
    name: Push backfill image
    needs: build-backfill-image
    uses: ./.github/workflows/docker_push.yml
    secrets: inherit
    with:
      artifact_name: ${{ needs.build-backfill-image.outputs.artifact_name }}
      versioned_tag: ${{ needs.build-backfill-image.outputs.versioned_tag }}
      latest_tag: ${{ needs.build-backfill-image.outputs.latest_tag }}
