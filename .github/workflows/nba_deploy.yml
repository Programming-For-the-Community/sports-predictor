# Top-level NBA deploy pipeline. Runs on every push to an nba* branch, but
# pauses for manual approval (via the environment's required reviewers --
# configure this in Settings > Environments, it can't be set from this
# file) before doing anything. Mirrors nfl_deploy.yml's own structure and
# comments, with the caveats below.
#
# STUB, BY DESIGN -- still missing live_scores_deploy, unlike
# nfl_deploy.yml's/ncaafb_deploy.yml's full 6-job shape. NBA's Sub-phase
# 3A build order (see project-nba-onboarding memory) hasn't reached
# live-scores yet (step 7), so there is no nba_live_scores_deploy.yml for
# this to call -- adding that job block now would reference a `uses:`
# target that doesn't exist and fail on first run. ai_hosting/
# deploy_predict_lambda/predict_read_deploy are all real as of step 6
# (inference) -- ai_hosting's own placeholder-image header from step 5 is
# now stale, see that file for the update.
#
# Why ai_hosting couldn't wait for step 6 like predict_read_deploy could:
# unlike the zip-based Lambdas, aws_lambda_function.nba_predict
# (Terraform/lambda-nba-predict.tf) is a container-image Lambda --
# CreateFunction validates its image tag already exists in ECR, and
# Terraform can't fabricate a placeholder image the way it does a
# placeholder ZIP. infra ran without this dependency once (2026-08-14)
# and failed at CreateFunction for exactly this reason -- see
# project-nba-onboarding memory. nfl_deploy.yml's own `infra` job
# depending on `ai_hosting` is what prevents this for NFL/NCAAFB; this
# file now mirrors that same invariant instead of a manual one-off image
# push.
#
# The still-missing job gets added here, not in a new file, once its own
# workflow file exists:
#   - live_scores_deploy -> after step 7 (live-scores)
#
# Once approved, backfill, ai_training, and ai_hosting (build) run BEFORE
# infra -- all three only need the ECR repo URL and AWS push credentials
# (plain GitHub variables/secrets), not anything Terraform manages, and
# infra's own `needs` list below depends on all three for exactly that
# reason -- the feature-engineering/train-win-probability-model images
# ai_training pushes must exist in ECR before the training ECS task
# definitions infra applies could ever actually run (RunTask pulls the
# image by tag; a missing tag fails at runtime, not at `terraform apply`,
# so this dependency is what catches it instead of a silent later
# failure -- see project-nba-onboarding memory for the exact same trap
# already hit and fixed for ai_hosting/nba-predict on 2026-08-14).
# tf_install then
# applies infra (including the NBA ECS task definition's env vars -- see
# Terraform/ecs-task-nba-backfill.tf -- and, for nba-predict specifically,
# its CreateFunction call, which now finds ai_hosting's just-pushed image).
# Only after infra do deploy_predict_lambda and data_pipeline run, since
# they deploy code into functions/point Lambdas at images Terraform just
# created.
#
# Both this job's `approval` step AND tf_install.yml's own terraform job
# gate on the `development`/`production` environment, so a run through
# this pipeline prompts for approval twice -- same accepted tradeoff as
# nfl_deploy.yml's own comment explains.

name: NBA Deploy

on:
  workflow_dispatch:
  push:
    branches:
      - 'nba*'
      - 'nba/*'
  workflow_call:

# See app_deploy.yml's own comment -- shared group across every workflow
# that can reach tf_install.yml's terraform apply, since
# Terraform/main.tf's S3 backend has no state locking configured.
concurrency:
  group: terraform-deploy-pipeline
  cancel-in-progress: false

permissions:
  id-token: write
  contents: read

jobs:
  approval:
    name: Await deployment approval
    if: github.event_name != 'workflow_call'
    runs-on: ubuntu-latest
    environment: development
    steps:
      - name: Approved
        run: echo "Deployment approved -- proceeding."

  # approval is intentionally skipped (not failed) when called via
  # workflow_call -- without this, a skipped `needs` job would cause
  # everything downstream to be skipped too. Each build job below repeats
  # this same tolerant check against `approval` directly.
  backfill:
    name: Historical backfill (build)
    needs: approval
    if: |
      always() &&
      (needs.approval.result == 'success' || needs.approval.result == 'skipped')
    uses: ./.github/workflows/nba_backfill.yml
    secrets: inherit

  # Real code as of step 6 -- see nba_ai_hosting.yml's own header. Also
  # ensures infra never runs without nba-predict-latest already in ECR.
  ai_hosting:
    name: AI hosting (build)
    needs: approval
    if: |
      always() &&
      (needs.approval.result == 'success' || needs.approval.result == 'skipped')
    uses: ./.github/workflows/nba_ai_hosting.yml
    secrets: inherit

  # Real code (Sub-phase 3A step 5), not a stub -- pushes
  # nba-feature-engineering-latest and nba-train-win-probability-model-
  # latest. infra never runs without both already in ECR, same invariant
  # ai_hosting enforces for nba-predict-latest.
  ai_training:
    name: AI training (build)
    needs: approval
    if: |
      always() &&
      (needs.approval.result == 'success' || needs.approval.result == 'skipped')
    uses: ./.github/workflows/nba_ai_training.yml
    secrets: inherit

  infra:
    name: Apply shared infrastructure
    needs: [backfill, ai_training, ai_hosting]
    if: |
      always() &&
      (needs.backfill.result == 'success' || needs.backfill.result == 'skipped') &&
      (needs.ai_training.result == 'success' || needs.ai_training.result == 'skipped') &&
      (needs.ai_hosting.result == 'success' || needs.ai_hosting.result == 'skipped')
    uses: ./.github/workflows/tf_install.yml
    secrets: inherit

  # Points nba-predict at whatever ai_hosting just pushed.
  deploy_predict_lambda:
    name: AI hosting (deploy)
    needs: [infra, ai_hosting]
    uses: ./.github/workflows/nba_predict_deploy.yml
    secrets: inherit
    with:
      function_name: ${{ needs.infra.outputs.nba_predict_function_name }}
      image_uri: ${{ needs.ai_hosting.outputs.predict_image_uri }}

  # nba-predict-read -- the light GET /nba/events + GET /nba/models Lambda
  # split out of nba-predict for cold start (see
  # Terraform/lambda-nba-predict-read.tf). A reusable workflow, not inline
  # jobs here -- same reasoning as nfl_deploy.yml's own predict_read_deploy
  # job (app_deploy.yml needs this exact same test+deploy pair too).
  predict_read_deploy:
    name: NBA predict-read (test + deploy)
    needs: [approval, infra]
    if: |
      always() &&
      (needs.approval.result == 'success' || needs.approval.result == 'skipped')
    uses: ./.github/workflows/nba_predict_read_deploy.yml
    secrets: inherit
    with:
      function_name: ${{ needs.infra.outputs.nba_predict_read_function_name }}

  data_pipeline:
    name: Data pipeline
    needs: infra
    uses: ./.github/workflows/nba_data_pipeline.yml
    secrets: inherit
    with:
      ingest_function_name: ${{ needs.infra.outputs.nba_ingest_function_name }}
      normalize_function_name: ${{ needs.infra.outputs.nba_normalize_function_name }}
      schedule_sync_function_name: ${{ needs.infra.outputs.nba_schedule_sync_function_name }}
