# Top-level NBA deploy pipeline. Runs on every push to an nba* branch, but
# pauses for manual approval (via the environment's required reviewers --
# configure this in Settings > Environments, it can't be set from this
# file) before doing anything.
#
# Exactly one SonarQube Cloud scan for this whole pipeline: every
# component's own test job runs directly against run_python_tests.yml
# (not nested inside a category workflow, since a scan job can't depend on
# jobs nested inside a called reusable workflow -- only a sibling job in
# the SAME file), `scan` needs all of them, and every build/deploy job
# needs `scan`.

name: NBA Deploy

on:
  workflow_dispatch:
  push:
    branches:
      - 'nba*'
  workflow_call:

# Shared group across every workflow that can reach tf_install.yml's
# terraform apply, since Terraform/main.tf's S3 backend has no state
# locking configured.
concurrency:
  group: terraform-deploy-pipeline
  cancel-in-progress: false

permissions:
  id-token: write
  contents: read
  actions: read

jobs:
  approval:
    name: Await deployment approval
    if: github.event_name != 'workflow_call'
    runs-on: ubuntu-latest
    environment: development
    steps:
      - name: Approved
        run: echo "Deployment approved -- proceeding."

  # Each test job below repeats the same tolerant check against `approval`
  # directly -- approval is intentionally skipped (not failed) when called
  # via workflow_call, and without this tolerant check a skipped `needs`
  # job would cause everything downstream to be skipped too.
  test-backfill:
    name: Run NBA backfill tests
    needs: approval
    if: |
      always() &&
      (needs.approval.result == 'success' || needs.approval.result == 'skipped')
    uses: ./.github/workflows/run_python_tests.yml
    with:
      test_path: 'Source/tests/data-backfills/nba/'
      requirements_files: 'Source/data-backfills/nba/requirements-dev.txt'

  test-feature-engineering:
    name: Run NBA feature engineering tests
    needs: approval
    if: |
      always() &&
      (needs.approval.result == 'success' || needs.approval.result == 'skipped')
    uses: ./.github/workflows/run_python_tests.yml
    with:
      test_path: 'Source/tests/library/ Source/tests/feature-engineering/nba/ --ignore=Source/tests/library/ml'
      requirements_files: 'Source/feature-engineering/nba/requirements.in'

  test-train-model:
    name: Run NBA training model tests
    needs: approval
    if: |
      always() &&
      (needs.approval.result == 'success' || needs.approval.result == 'skipped')
    uses: ./.github/workflows/run_python_tests.yml
    with:
      test_path: 'Source/tests/library/ Source/tests/model-training/nba/'
      requirements_files: 'Source/model-training/nba/requirements.in'

  test-predict:
    name: Run NBA predict tests
    needs: approval
    if: |
      always() &&
      (needs.approval.result == 'success' || needs.approval.result == 'skipped')
    uses: ./.github/workflows/run_python_tests.yml
    with:
      test_path: >-
        Source/tests/library/
        Source/tests/aws-lambdas/nba/test_live_features.py
        Source/tests/aws-lambdas/nba/test_event_prediction.py
        Source/tests/aws-lambdas/nba/test_predict_handler.py
        Source/tests/aws-lambdas/nba/test_season_simulation.py
        Source/tests/aws-lambdas/nba/test_predict_season_simulation.py
      requirements_files: 'Source/aws-lambdas/nba/predict/requirements.in Source/aws-lambdas/nba/predict/requirements-nodeps.in'

  test-predict-read:
    name: Run NBA predict-read tests
    needs: approval
    if: |
      always() &&
      (needs.approval.result == 'success' || needs.approval.result == 'skipped')
    uses: ./.github/workflows/run_python_tests.yml
    with:
      test_path: 'Source/tests/aws-lambdas/nba/test_predict_read_handler.py Source/tests/library/serving/test_nba_reads.py Source/tests/library/storage/test_prediction_cache.py Source/tests/library/storage/test_model_artifacts.py Source/tests/library/aws/test_lambda_invoker.py'
      requirements_files: 'Source/aws-lambdas/nba/predict-read/requirements.txt'

  test-live-scores:
    name: Run NBA live-scores tests
    needs: approval
    if: |
      always() &&
      (needs.approval.result == 'success' || needs.approval.result == 'skipped')
    uses: ./.github/workflows/run_python_tests.yml
    with:
      test_path: 'Source/tests/aws-lambdas/nba/test_live_scores.py Source/tests/aws-lambdas/nba/test_live_scores_handler.py'
      requirements_files: 'Source/aws-lambdas/nba/live-scores/requirements.txt'

  test-ingest:
    name: Run NBA ingest tests
    needs: approval
    if: |
      always() &&
      (needs.approval.result == 'success' || needs.approval.result == 'skipped')
    uses: ./.github/workflows/run_python_tests.yml
    with:
      test_path: 'Source/tests/aws-lambdas/nba/test_ingest.py'
      requirements_files: 'Source/aws-lambdas/nba/ingest/requirements.txt'

  test-normalize:
    name: Run NBA normalize tests
    needs: approval
    if: |
      always() &&
      (needs.approval.result == 'success' || needs.approval.result == 'skipped')
    uses: ./.github/workflows/run_python_tests.yml
    with:
      test_path: 'Source/tests/aws-lambdas/nba/test_normalize.py'
      requirements_files: 'Source/aws-lambdas/nba/normalize/requirements.txt'

  test-schedule-sync:
    name: Run NBA schedule-sync tests
    needs: approval
    if: |
      always() &&
      (needs.approval.result == 'success' || needs.approval.result == 'skipped')
    uses: ./.github/workflows/run_python_tests.yml
    with:
      test_path: 'Source/tests/aws-lambdas/nba/test_schedule_sync.py'
      requirements_files: 'Source/aws-lambdas/nba/schedule-sync/requirements.txt'

  scan:
    name: SonarQube Cloud scan
    needs: [
      test-backfill, test-feature-engineering, test-train-model, test-predict,
      test-predict-read, test-live-scores, test-ingest, test-normalize, test-schedule-sync,
    ]
    if: |
      always() &&
      (needs.test-backfill.result == 'success' || needs.test-backfill.result == 'skipped') &&
      (needs.test-feature-engineering.result == 'success' || needs.test-feature-engineering.result == 'skipped') &&
      (needs.test-train-model.result == 'success' || needs.test-train-model.result == 'skipped') &&
      (needs.test-predict.result == 'success' || needs.test-predict.result == 'skipped') &&
      (needs.test-predict-read.result == 'success' || needs.test-predict-read.result == 'skipped') &&
      (needs.test-live-scores.result == 'success' || needs.test-live-scores.result == 'skipped') &&
      (needs.test-ingest.result == 'success' || needs.test-ingest.result == 'skipped') &&
      (needs.test-normalize.result == 'success' || needs.test-normalize.result == 'skipped') &&
      (needs.test-schedule-sync.result == 'success' || needs.test-schedule-sync.result == 'skipped')
    uses: ./.github/workflows/sonar_scan.yml
    secrets: inherit
    with:
      environment: ${{ github.event.inputs.environment || 'development' }}
      parent_workflow: ${{ github.workflow }}

  backfill:
    name: Historical backfill (build)
    needs: scan
    uses: ./.github/workflows/docker_image_deploy.yml
    secrets: inherit
    with:
      sport: 'NBA'
      dockerfile_path: 'Source/data-backfills/nba/Dockerfile'
      image_name: 'nba-backfill'
      image_version: '1.0.0'

  ai_training:
    name: AI training (build)
    needs: scan
    uses: ./.github/workflows/ai_training.yml
    secrets: inherit
    with:
      sport: 'NBA'
      feature_engineering_dockerfile_path: 'Source/feature-engineering/nba/Dockerfile'
      feature_engineering_image_name: 'nba-feature-engineering'
      feature_engineering_image_version: '1.0.0'
      train_model_dockerfile_path: 'Source/model-training/nba/Dockerfile'
      train_model_image_name: 'nba-train-win-probability-model'
      train_model_image_version: '1.0.0'

  # Pushes nba-predict-latest. infra never runs without it already in ECR
  # -- aws_lambda_function.nba_predict is a container-image Lambda, and
  # CreateFunction validates its image tag already exists in ECR before
  # Terraform can create it.
  ai_hosting:
    name: AI hosting (build)
    needs: scan
    uses: ./.github/workflows/docker_image_deploy.yml
    secrets: inherit
    with:
      sport: 'NBA'
      dockerfile_path: 'Source/aws-lambdas/nba/predict/Dockerfile'
      image_name: 'nba-predict'
      image_version: '1.0.0'
      platform: 'linux/arm64'

  # Only ai_hosting is a real dependency here -- see app_deploy.yml's own
  # infra job comment for why backfill/ai_training images aren't a
  # terraform-apply-time dependency at all.
  infra:
    name: Apply shared infrastructure
    needs: [ai_hosting]
    uses: ./.github/workflows/tf_install.yml
    secrets: inherit

  deploy_predict_lambda:
    name: AI hosting (deploy)
    needs: [infra, ai_hosting]
    uses: ./.github/workflows/docker_lambda_deploy.yml
    secrets: inherit
    with:
      function_name: ${{ needs.infra.outputs.nba_predict_function_name }}
      image_tag: ${{ needs.ai_hosting.outputs.image_tag }}
      default_image_tag: 'nba-predict-latest'

  predict_read_deploy:
    name: NBA predict-read (deploy)
    needs: [scan, infra]
    uses: ./.github/workflows/zip_lambda_deploy.yml
    secrets: inherit
    with:
      sport: 'NBA'
      function_name: ${{ needs.infra.outputs.nba_predict_read_function_name }}
      handler_dir: 'Source/aws-lambdas/nba/predict-read'

  live_scores_deploy:
    name: NBA live-scores (deploy)
    needs: [scan, infra]
    uses: ./.github/workflows/zip_lambda_deploy.yml
    secrets: inherit
    with:
      sport: 'NBA'
      function_name: ${{ needs.infra.outputs.nba_live_scores_function_name }}
      handler_dir: 'Source/aws-lambdas/nba/live-scores'
      extra_source_files: 'Source/aws-lambdas/nba/live-scores/live_scores.py'

  data_pipeline:
    name: Data pipeline
    needs: [scan, infra]
    uses: ./.github/workflows/data_pipeline.yml
    secrets: inherit
    with:
      sport: 'NBA'
      ingest_function_name: ${{ needs.infra.outputs.nba_ingest_function_name }}
      ingest_handler_dir: 'Source/aws-lambdas/nba/ingest'
      normalize_function_name: ${{ needs.infra.outputs.nba_normalize_function_name }}
      normalize_handler_dir: 'Source/aws-lambdas/nba/normalize'
      schedule_sync_function_name: ${{ needs.infra.outputs.nba_schedule_sync_function_name }}
      schedule_sync_handler_dir: 'Source/aws-lambdas/nba/schedule-sync'
