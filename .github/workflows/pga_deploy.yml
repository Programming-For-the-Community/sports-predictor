# Top-level PGA deploy pipeline. Runs on every push to a pga* branch, but
# pauses for manual approval (via the environment's required reviewers --
# configure this in Settings > Environments, it can't be set from this
# file) before doing anything.
#
# Exactly one SonarQube Cloud scan for this whole pipeline: every
# component's own test job runs directly against run_python_tests.yml
# (not nested inside a category workflow, since a scan job can't depend on
# jobs nested inside a called reusable workflow -- only a sibling job in
# the SAME file), `scan` needs all of them, and every build/deploy job
# needs `scan`.

name: PGA Deploy

on:
  workflow_dispatch:
  push:
    branches:
      - 'pga*'
  workflow_call:

# Shared group across every workflow that can reach tf_install.yml's
# terraform apply, since Terraform/main.tf's S3 backend has no state
# locking configured.
concurrency:
  group: terraform-deploy-pipeline
  cancel-in-progress: false

permissions:
  id-token: write
  contents: read
  actions: read

jobs:
  approval:
    name: Await deployment approval
    if: github.event_name != 'workflow_call'
    runs-on: ubuntu-latest
    environment: development
    steps:
      - name: Approved
        run: echo "Deployment approved -- proceeding."

  # Each test job below repeats the same tolerant check against `approval`
  # directly -- approval is intentionally skipped (not failed) when called
  # via workflow_call, and without this tolerant check a skipped `needs`
  # job would cause everything downstream to be skipped too.
  #
  # The test suite (Source/tests/data-backfills/pga/) includes a real-ESPN
  # integration file (test_espn_pga.py) alongside the mocked unit tests --
  # there's no offline fixture layer yet, so this gate depends on ESPN
  # being reachable and not rate-limiting the runner.
  test-backfill:
    name: Run PGA backfill tests
    needs: approval
    if: |
      always() &&
      (needs.approval.result == 'success' || needs.approval.result == 'skipped')
    uses: ./.github/workflows/run_python_tests.yml
    with:
      test_path: 'Source/tests/data-backfills/pga/'
      requirements_files: 'Source/data-backfills/pga/requirements-dev.txt'

  test-feature-engineering:
    name: Run PGA feature engineering tests
    needs: approval
    if: |
      always() &&
      (needs.approval.result == 'success' || needs.approval.result == 'skipped')
    uses: ./.github/workflows/run_python_tests.yml
    with:
      test_path: 'Source/tests/library/ Source/tests/feature-engineering/pga/ --ignore=Source/tests/library/ml'
      requirements_files: 'Source/feature-engineering/pga/requirements.txt'

  test-train-top10-model:
    name: Run PGA train top-10-probability model tests
    needs: approval
    if: |
      always() &&
      (needs.approval.result == 'success' || needs.approval.result == 'skipped')
    uses: ./.github/workflows/run_python_tests.yml
    with:
      test_path: 'Source/tests/library/ Source/tests/model-training/pga/'
      requirements_files: 'Source/model-training/pga/requirements.txt'

  test-predict:
    name: Run PGA predict tests
    needs: approval
    if: |
      always() &&
      (needs.approval.result == 'success' || needs.approval.result == 'skipped')
    uses: ./.github/workflows/run_python_tests.yml
    with:
      test_path: >-
        Source/tests/library/
        Source/tests/aws-lambdas/pga/test_live_features.py
        Source/tests/aws-lambdas/pga/test_event_prediction.py
        Source/tests/aws-lambdas/pga/test_predict_handler.py
        Source/tests/aws-lambdas/pga/test_season_simulation.py
        Source/tests/aws-lambdas/pga/test_season_projection.py
      requirements_files: 'Source/aws-lambdas/pga/predict/requirements.txt Source/aws-lambdas/pga/predict/requirements-nodeps.txt'

  test-predict-read:
    name: Run PGA predict-read tests
    needs: approval
    if: |
      always() &&
      (needs.approval.result == 'success' || needs.approval.result == 'skipped')
    uses: ./.github/workflows/run_python_tests.yml
    with:
      test_path: 'Source/tests/aws-lambdas/pga/test_predict_read_handler.py Source/tests/library/serving/test_pga_reads.py Source/tests/library/serving/test_common.py Source/tests/library/storage/test_prediction_cache.py Source/tests/library/storage/test_model_artifacts.py Source/tests/library/aws/test_lambda_invoker.py'
      requirements_files: 'Source/aws-lambdas/pga/predict-read/requirements.txt'

  test-live-scores:
    name: Run PGA live-scores tests
    needs: approval
    if: |
      always() &&
      (needs.approval.result == 'success' || needs.approval.result == 'skipped')
    uses: ./.github/workflows/run_python_tests.yml
    with:
      test_path: >-
        Source/tests/aws-lambdas/pga/test_live_scores.py
        Source/tests/aws-lambdas/pga/test_live_scores_handler.py
        Source/tests/library/normalize/test_pga_event.py
        Source/tests/library/normalize/test_pga_matchplay.py
      requirements_files: 'Source/aws-lambdas/pga/live-scores/requirements.txt'

  test-ingest:
    name: Run PGA ingest tests
    needs: approval
    if: |
      always() &&
      (needs.approval.result == 'success' || needs.approval.result == 'skipped')
    uses: ./.github/workflows/run_python_tests.yml
    with:
      test_path: 'Source/tests/aws-lambdas/pga/test_ingest.py'
      requirements_files: 'Source/aws-lambdas/pga/ingest/requirements.txt'

  test-normalize:
    name: Run PGA normalize tests
    needs: approval
    if: |
      always() &&
      (needs.approval.result == 'success' || needs.approval.result == 'skipped')
    uses: ./.github/workflows/run_python_tests.yml
    with:
      test_path: 'Source/tests/aws-lambdas/pga/test_normalize.py'
      requirements_files: 'Source/aws-lambdas/pga/normalize/requirements.txt'

  test-schedule-sync:
    name: Run PGA schedule-sync tests
    needs: approval
    if: |
      always() &&
      (needs.approval.result == 'success' || needs.approval.result == 'skipped')
    uses: ./.github/workflows/run_python_tests.yml
    with:
      test_path: 'Source/tests/aws-lambdas/pga/test_schedule_sync.py'
      requirements_files: 'Source/aws-lambdas/pga/schedule-sync/requirements.txt'

  scan:
    name: SonarQube Cloud scan
    needs: [
      test-backfill, test-feature-engineering, test-train-top10-model, test-predict,
      test-predict-read, test-live-scores, test-ingest, test-normalize, test-schedule-sync,
    ]
    if: |
      always() &&
      (needs.test-backfill.result == 'success' || needs.test-backfill.result == 'skipped') &&
      (needs.test-feature-engineering.result == 'success' || needs.test-feature-engineering.result == 'skipped') &&
      (needs.test-train-top10-model.result == 'success' || needs.test-train-top10-model.result == 'skipped') &&
      (needs.test-predict.result == 'success' || needs.test-predict.result == 'skipped') &&
      (needs.test-predict-read.result == 'success' || needs.test-predict-read.result == 'skipped') &&
      (needs.test-live-scores.result == 'success' || needs.test-live-scores.result == 'skipped') &&
      (needs.test-ingest.result == 'success' || needs.test-ingest.result == 'skipped') &&
      (needs.test-normalize.result == 'success' || needs.test-normalize.result == 'skipped') &&
      (needs.test-schedule-sync.result == 'success' || needs.test-schedule-sync.result == 'skipped')
    uses: ./.github/workflows/sonar_scan.yml
    secrets: inherit
    with:
      environment: ${{ github.event.inputs.environment || 'development' }}
      parent_workflow: ${{ github.workflow }}

  backfill:
    name: Historical backfill (build)
    needs: scan
    uses: ./.github/workflows/docker_image_deploy.yml
    secrets: inherit
    with:
      sport: 'PGA'
      dockerfile_path: 'Source/data-backfills/pga/Dockerfile'
      image_name: 'pga-backfill'
      # library/normalize/pga.py: event_status now keys off state=="post"
      # not type.completed -- a match-play session's own status object
      # never carries "completed" (real crash: every match_play event
      # silently stored as "scheduled", 0 ever loaded as completed).
      image_version: '1.1.2'

  # Builds Feature Engineering and Train Top-10 Model (the latter also
  # serves train_top5_model.py/train_score_model.py/train_cutline_model.py/
  # train_round_model.py/train_match_winprob_model.py/
  # train_cup_winprob_model.py -- Terraform/ecs-task-pga-train-{top5,score,
  # cutline,round,match-winprob,cup-winprob}-model.tf all point at this
  # same image tag and override `command` to run their own script instead,
  # same shared-image/command-override pattern NBA's own
  # train-win-probability-model image uses for score/player-prop).
  ai_training:
    name: AI training (build)
    needs: scan
    uses: ./.github/workflows/ai_training.yml
    secrets: inherit
    with:
      sport: 'PGA'
      feature_engineering_dockerfile_path: 'Source/feature-engineering/pga/Dockerfile'
      feature_engineering_image_name: 'pga-feature-engineering'
      # Bumped 2026-08-27, two real live crashes in one afternoon: (1)
      # TypeError: int + str in rolling_golfer_averages' sum() -- a
      # withdrawn golfer's non-numeric score ("WD") reached it unguarded,
      # fixed at the source (library/normalize/pga.py's _parse_score) plus
      # a type-check here matching library/features/common.py's existing
      # rolling_player_stat_averages discipline; (2) pyarrow.lib.ArrowInvalid
      # on the Parquet write itself -- a row already in DynamoDB from
      # BEFORE fix (1) shipped (a real empty-string score_to_par) still
      # crashed the ENTIRE dataset write (one bad value poisons the whole
      # column, not just its row), so every raw passthrough field in
      # library/features/pga.py (purse, cut_score, cut_count,
      # finish_position, every label_*, season_stats values) now goes
      # through a new _as_number() coercion -- a normalizer fix alone
      # can't protect against data already written before it existed.
      feature_engineering_image_version: '1.1.1'
      train_model_dockerfile_path: 'Source/model-training/pga/Dockerfile'
      train_model_image_name: 'pga-train-top10-model'
      # Bumped 2026-08-27, same afternoon: the _as_number() coercion above
      # means label_round_score_to_par/label_cut_score can now be a real
      # None for a dirty stored row, same as train_score_model.py's own
      # label (label_remaining_score_to_par) already could be -- but
      # unlike train_score_model.py's own _filter_to_scored_rows,
      # train_round_model.py/train_cutline_model.py had no notna() filter
      # before handing y_train/y_test to run_backtest, so a dirty row
      # would reach .fit() and crash every non-XGBoost candidate (sklearn
      # regressors reject a NaN target) instead of feature-engineering.
      # Found by auditing every train_*.py's own label-nullity handling
      # after the match/cup status bug above, not from a live crash --
      # both scripts now filter the same way train_score_model.py already
      # did.
      #
      # Bumped again 2026-08-27, real live crash: ValueError: Cannot have
      # number of folds=9 greater than the number of samples=6, in
      # train_cup_winprob_model -- cup-win-probability's real dataset is
      # only 8 rows total (one Ryder/Presidents Cup a year), 6 after the
      # chronological train/test split, and library/ml/model_types.py
      # hardcoded every adapter's TimeSeriesSplit at n_splits=8 (needs 9+
      # samples) with no accommodation for a target this small. Fixed with
      # a new shared _time_series_splits() helper (clamps down to what the
      # data can support, floored at 2) applied to all 8
      # cv=TimeSeriesSplit(...) call sites in that file, not just XGBoost
      # (the one that happened to crash first in the candidate
      # tournament) -- behaviorally a no-op for every other target/sport,
      # since none of them have ever had fewer than 9 training rows.
      train_model_image_version: '1.1.2'

  ai_hosting:
    name: AI hosting (build)
    needs: scan
    uses: ./.github/workflows/docker_image_deploy.yml
    secrets: inherit
    with:
      sport: 'PGA'
      dockerfile_path: 'Source/aws-lambdas/pga/predict/Dockerfile'
      image_name: 'pga-predict'
      image_version: '1.0.0'
      platform: 'linux/arm64'

  infra:
    name: Apply shared infrastructure
    needs: [backfill, ai_training, ai_hosting]
    if: |
      always() &&
      (needs.backfill.result == 'success' || needs.backfill.result == 'skipped') &&
      (needs.ai_training.result == 'success' || needs.ai_training.result == 'skipped') &&
      (needs.ai_hosting.result == 'success' || needs.ai_hosting.result == 'skipped')
    uses: ./.github/workflows/tf_install.yml
    secrets: inherit

  deploy_predict_lambda:
    name: AI hosting (deploy)
    needs: [infra, ai_hosting]
    uses: ./.github/workflows/docker_lambda_deploy.yml
    secrets: inherit
    with:
      function_name: ${{ needs.infra.outputs.pga_predict_function_name }}
      image_uri: ${{ needs.ai_hosting.outputs.image_uri }}
      default_image_tag: 'pga-predict-latest'

  predict_read_deploy:
    name: PGA predict-read (deploy)
    needs: [scan, infra]
    uses: ./.github/workflows/zip_lambda_deploy.yml
    secrets: inherit
    with:
      sport: 'PGA'
      function_name: ${{ needs.infra.outputs.pga_predict_read_function_name }}
      handler_dir: 'Source/aws-lambdas/pga/predict-read'

  live_scores_deploy:
    name: PGA live-scores (deploy)
    needs: [scan, infra]
    uses: ./.github/workflows/zip_lambda_deploy.yml
    secrets: inherit
    with:
      sport: 'PGA'
      function_name: ${{ needs.infra.outputs.pga_live_scores_function_name }}
      handler_dir: 'Source/aws-lambdas/pga/live-scores'
      extra_source_files: 'Source/aws-lambdas/pga/live-scores/live_scores.py'

  data_pipeline:
    name: Data pipeline
    needs: [scan, infra]
    uses: ./.github/workflows/data_pipeline.yml
    secrets: inherit
    with:
      sport: 'PGA'
      ingest_function_name: ${{ needs.infra.outputs.pga_ingest_function_name }}
      ingest_handler_dir: 'Source/aws-lambdas/pga/ingest'
      normalize_function_name: ${{ needs.infra.outputs.pga_normalize_function_name }}
      normalize_handler_dir: 'Source/aws-lambdas/pga/normalize'
      schedule_sync_function_name: ${{ needs.infra.outputs.pga_schedule_sync_function_name }}
      schedule_sync_handler_dir: 'Source/aws-lambdas/pga/schedule-sync'
