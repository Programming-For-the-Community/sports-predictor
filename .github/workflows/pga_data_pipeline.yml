# Builds and deploys the PGA recurring data pipeline Lambdas: pga-ingest
# (EventBridge-orchestrator-triggered, writes the current tournament's raw
# leaderboard JSON to S3), pga-normalize (S3-triggered, writes to
# DynamoDB), and pga-schedule-sync (EventBridge-triggered, discovers and
# writes the whole current season's tournament calendar -- see
# Terraform/lambda-pga-schedule-sync.tf for why this doesn't walk
# individual dates the way every other sport's schedule-sync does). All
# three are deployed in parallel since they are independent -- a failure
# in one does not block the others.
#
# Lambda function names are supplied by the caller (pga_deploy.yml) from
# Terraform outputs so this workflow never hard-codes names that Terraform
# owns. Defaults are provided so workflow_dispatch (manual, standalone run)
# still works without needing the Terraform output values.
#
# Terraform (tf_install.yml) creates each Lambda function with a placeholder
# ZIP and lifecycle { ignore_changes } so it never overwrites what this
# workflow deploys. This workflow owns all subsequent code updates.

name: PGA Data Pipeline

on:
  workflow_dispatch:
  workflow_call:
    inputs:
      ingest_function_name:
        description: 'PGA ingest Lambda function name (from Terraform output pga_ingest_function_name)'
        required: false
        type: string
        default: 'sports-predictor-pga-ingest'
      normalize_function_name:
        description: 'PGA normalize Lambda function name (from Terraform output pga_normalize_function_name)'
        required: false
        type: string
        default: 'sports-predictor-pga-normalize'
      schedule_sync_function_name:
        description: 'PGA schedule-sync Lambda function name (from Terraform output pga_schedule_sync_function_name)'
        required: false
        type: string
        default: 'sports-predictor-pga-schedule-sync'

permissions:
  id-token: write
  contents: read

jobs:
  # Each Lambda gets its own upstream test job, pointed at its own
  # specific test file -- not the whole Source/tests/aws-lambdas/pga/
  # directory. A failing normalize test shouldn't fail the ingest deploy,
  # or vice versa, purely because both deploys pointed at the same shared
  # directory.
  test-ingest:
    name: Run pga-ingest tests
    uses: ./.github/workflows/run_python_tests.yml
    with:
      test_path: 'Source/tests/aws-lambdas/pga/test_ingest.py'
      requirements_files: 'Source/aws-lambdas/pga/ingest/requirements.txt'

  test-normalize:
    name: Run pga-normalize tests
    uses: ./.github/workflows/run_python_tests.yml
    with:
      test_path: 'Source/tests/aws-lambdas/pga/test_normalize.py'
      requirements_files: 'Source/aws-lambdas/pga/normalize/requirements.txt'

  deploy-ingest:
    name: Deploy pga-ingest Lambda
    needs: test-ingest
    uses: ./.github/workflows/python_lambda_build.yml
    secrets: inherit
    with:
      function_name: ${{ inputs.ingest_function_name || 'sports-predictor-pga-ingest' }}
      handler_dir: 'Source/aws-lambdas/pga/ingest'
      library_path: 'Source/library'

  deploy-normalize:
    name: Deploy pga-normalize Lambda
    needs: test-normalize
    uses: ./.github/workflows/python_lambda_build.yml
    secrets: inherit
    with:
      function_name: ${{ inputs.normalize_function_name || 'sports-predictor-pga-normalize' }}
      handler_dir: 'Source/aws-lambdas/pga/normalize'
      library_path: 'Source/library'

  test-schedule-sync:
    name: Run pga-schedule-sync tests
    uses: ./.github/workflows/run_python_tests.yml
    with:
      test_path: 'Source/tests/aws-lambdas/pga/test_schedule_sync.py'
      requirements_files: 'Source/aws-lambdas/pga/schedule-sync/requirements.txt'

  deploy-schedule-sync:
    name: Deploy pga-schedule-sync Lambda
    needs: test-schedule-sync
    uses: ./.github/workflows/python_lambda_build.yml
    secrets: inherit
    with:
      function_name: ${{ inputs.schedule_sync_function_name || 'sports-predictor-pga-schedule-sync' }}
      handler_dir: 'Source/aws-lambdas/pga/schedule-sync'
      library_path: 'Source/library'
