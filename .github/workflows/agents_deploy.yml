# Top-level assistant (AgentCore agents) deploy pipeline. Runs on every push
# to an agents/* branch, but pauses for manual approval (via the
# environment's required reviewers -- configure this in Settings >
# Environments, it can't be set from this file) before doing anything.
#
# Covers the agent image (one image, two runtimes), the two runtimes, and
# the assistant's four zip Lambdas (tools and data producers). The chat UI
# ships with the app through app_deploy.yml on main.
#
# Exactly one SonarQube Cloud scan for this whole pipeline: every test job
# runs directly against run_python_tests.yml, `scan` needs all of them, and
# every build/deploy job needs `scan` -- same shape as nhl_deploy.yml.

name: Agents Deploy

on:
  workflow_dispatch:
  push:
    branches:
      - 'agents/*'
  workflow_call:

# Shared group across every workflow that can reach tf_install.yml's
# terraform apply.
concurrency:
  group: terraform-deploy-pipeline
  cancel-in-progress: false

permissions:
  id-token: write
  contents: read
  actions: read

jobs:
  approval:
    name: Await deployment approval
    if: github.event_name != 'workflow_call'
    runs-on: ubuntu-latest
    environment: development
    steps:
      - name: Approved
        run: echo "Deployment approved -- proceeding."

  # Each test job tolerates a skipped `approval` (workflow_call) -- see
  # nhl_deploy.yml's own comment.
  test-assistant-library:
    name: Run assistant library tests
    needs: approval
    if: |
      always() &&
      (needs.approval.result == 'success' || needs.approval.result == 'skipped')
    uses: ./.github/workflows/run_python_tests.yml
    with:
      test_path: 'Source/tests/library/assistant/'
      requirements_files: ''

  test-assistant-lambdas:
    name: Run assistant Lambda tests
    needs: approval
    if: |
      always() &&
      (needs.approval.result == 'success' || needs.approval.result == 'skipped')
    uses: ./.github/workflows/run_python_tests.yml
    with:
      test_path: 'Source/tests/aws-lambdas/shared/test_assistant_tools.py Source/tests/aws-lambdas/shared/test_assistant_producers.py'
      requirements_files: ''

  test-assistant-agent:
    name: Run assistant agent tests
    needs: approval
    if: |
      always() &&
      (needs.approval.result == 'success' || needs.approval.result == 'skipped')
    uses: ./.github/workflows/run_python_tests.yml
    with:
      test_path: 'Source/tests/agents/'
      requirements_files: ''

  scan:
    name: SonarQube Cloud scan
    needs: [test-assistant-library, test-assistant-lambdas, test-assistant-agent]
    # always() -- see app_deploy.yml's own copy of this comment.
    if: always()
    uses: ./.github/workflows/sonar_scan.yml
    secrets: inherit
    with:
      environment: ${{ github.event.inputs.environment || 'development' }}
      parent_workflow: ${{ github.workflow }}

  # Pushes assistant-agent-latest. infra never runs without it already in
  # ECR: creating an AgentCore runtime checks its image exists.
  assistant_agent_build:
    name: Assistant agent (build)
    needs: scan
    uses: ./.github/workflows/docker_image_deploy.yml
    secrets: inherit
    with:
      sport: 'Assistant'
      dockerfile_path: 'Source/agents/assistant/Dockerfile'
      image_name: 'assistant-agent'
      image_version: '1.0.0'
      platform: 'linux/arm64'

  infra:
    name: Apply shared infrastructure
    needs: [assistant_agent_build]
    uses: ./.github/workflows/tf_install.yml
    secrets: inherit

  assistant_public_runtime_deploy:
    name: Assistant public runtime (deploy)
    needs: [infra, assistant_agent_build]
    uses: ./.github/workflows/agentcore_runtime_deploy.yml
    secrets: inherit
    with:
      runtime_id: ${{ needs.infra.outputs.assistant_public_runtime_id }}
      image_tag: ${{ needs.assistant_agent_build.outputs.image_tag }}
      default_image_tag: 'assistant-agent-latest'

  assistant_admin_runtime_deploy:
    name: Assistant admin runtime (deploy)
    needs: [infra, assistant_agent_build]
    uses: ./.github/workflows/agentcore_runtime_deploy.yml
    secrets: inherit
    with:
      runtime_id: ${{ needs.infra.outputs.assistant_admin_runtime_id }}
      image_tag: ${{ needs.assistant_agent_build.outputs.image_tag }}
      default_image_tag: 'assistant-agent-latest'

  assistant_lambdas_deploy:
    name: Assistant Lambdas (deploy)
    needs: [scan, infra]
    uses: ./.github/workflows/assistant_lambdas_deploy.yml
    secrets: inherit
    with:
      public_tools_function_name: ${{ needs.infra.outputs.assistant_public_tools_function_name }}
      admin_tools_function_name: ${{ needs.infra.outputs.assistant_admin_tools_function_name }}
      cost_snapshot_function_name: ${{ needs.infra.outputs.assistant_cost_snapshot_function_name }}
      traffic_aggregate_function_name: ${{ needs.infra.outputs.assistant_traffic_aggregate_function_name }}
