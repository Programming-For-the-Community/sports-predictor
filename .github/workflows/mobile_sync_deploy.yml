# Publishes an already-built APK: overwrites app/sports-predictor.apk in the
# mobile-releases bucket (Terraform/s3-mobile-releases.tf) with the build's
# version/sha256 metadata. That object's metadata is the release signal --
# the website's download prompt and the app's update check both HEAD it
# through CloudFront's /app/* behavior. Bucket versioning keeps the
# previous builds.
#
# Uploaded with `Cache-Control: no-cache`; CloudFront's 0s default TTL on
# /app/* revalidates every request, so no invalidation is needed.
#
# Runs standalone (workflow_dispatch, from a previous run's mobile-build
# artifact) or called from mobile_deploy.yml/app_deploy.yml.

name: Mobile Sync Deploy

on:
  workflow_dispatch:
    inputs:
      source_run_id:
        description: 'Workflow run ID to download the mobile-build artifact from'
        required: true
        type: string
  workflow_call:
    inputs:
      source_run_id:
        description: 'Workflow run ID to download the mobile-build artifact from'
        required: true
        type: string

permissions:
  id-token: write
  contents: read
  actions: read

env:
  APK_KEY: app/sports-predictor.apk

jobs:
  deploy:
    name: Publish APK to S3
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Configure AWS credentials (OIDC)
        uses: aws-actions/configure-aws-credentials@e1253824e5c10ff9df46874f81ed3ec929e19cfd # v6.3.0
        with:
          role-to-assume: ${{ secrets.AWS_DEPLOY_SVC_ACCT_ARN }}
          aws-region: ${{ vars.AWS_RESOURCE_REGION }}
          role-session-name: GitHubActions-${{ github.run_id }}

      - name: Download build artifact
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          name: mobile-build
          path: release
          run-id: ${{ inputs.source_run_id }}
          github-token: ${{ secrets.GITHUB_TOKEN }}

      - name: Setup Terraform
        uses: hashicorp/setup-terraform@dfe3c3f87815947d99a8997f908cb6525fc44e9e # v4.0.1
        with:
          cli_config_credentials_token: ${{ secrets.TF_API_TOKEN }}

      - name: Resolve bucket
        id: resolve
        run: |
          terraform -chdir=Terraform init -reconfigure
          bucket="$(terraform -chdir=Terraform output -raw mobile_releases_bucket_name)"
          if [ -z "$bucket" ]; then
            echo "::error::Could not resolve mobile_releases_bucket_name from Terraform state"
            exit 1
          fi
          echo "Resolved bucket = $bucket"
          echo "bucket=$bucket" >> "$GITHUB_OUTPUT"

      - name: Verify APK checksum
        run: |
          expected="$(jq -r '.sha256' release/metadata.json)"
          actual="$(sha256sum release/sports-predictor.apk | cut -d' ' -f1)"
          if [ "$expected" != "$actual" ]; then
            echo "::error::APK sha256 $actual does not match metadata $expected"
            exit 1
          fi

      - name: Upload APK
        env:
          BUCKET: ${{ steps.resolve.outputs.bucket }}
        run: |
          aws s3 cp release/sports-predictor.apk "s3://$BUCKET/$APK_KEY" \
            --content-type application/vnd.android.package-archive \
            --content-disposition 'attachment; filename="sports-predictor.apk"' \
            --cache-control no-cache \
            --metadata "$(cat release/metadata.json)"
          aws s3api head-object --bucket "$BUCKET" --key "$APK_KEY" --query '{Version: VersionId, Metadata: Metadata}'
