# Builds and packages the Flutter Web frontend. Runs standalone
# (workflow_dispatch) or called from frontend_deploy.yml/app_deploy.yml
# (workflow_call). Build-only -- no test, no scan, no deploy step here.
# The caller runs `flutter test` directly and folds it into that
# pipeline's own single SonarQube Cloud scan (see frontend_deploy.yml/
# app_deploy.yml for the pattern) -- a scan job can't depend on jobs
# nested inside a called reusable workflow, only a sibling job in the
# SAME calling file, so the test step can't live inside this file if
# every caller is to have exactly one scan. Deploying (syncing to S3 +
# invalidating CloudFront) is frontend_sync_deploy.yml's job.
#
# The build job reads its config (API URL, Cognito IDs) directly from
# Terraform state via `terraform output`, so it needs AWS credentials and
# the Terraform CLI.
#
# No Dockerfile -- flutter build web runs directly on the runner via
# subosito/flutter-action.

name: Frontend Hosting

on:
  workflow_dispatch:
  workflow_call:
    outputs:
      artifact_name:
        description: 'Name of the uploaded build/web artifact, for frontend_sync_deploy.yml to download'
        value: ${{ jobs.build-frontend.outputs.artifact_name }}

env:
  FLUTTER_VERSION: '3.29.3'

permissions:
  id-token: write
  contents: read

jobs:
  build-frontend:
    name: Build frontend
    runs-on: ubuntu-latest
    outputs:
      artifact_name: frontend-build
    steps:
      - name: Checkout code
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Set up Flutter
        uses: subosito/flutter-action@1a449444c387b1966244ae4d4f8c696479add0b2 # v2.23.0
        with:
          flutter-version: ${{ env.FLUTTER_VERSION }}
          channel: stable

      - name: Configure AWS credentials (OIDC)
        uses: aws-actions/configure-aws-credentials@e1253824e5c10ff9df46874f81ed3ec929e19cfd # v6.3.0
        with:
          role-to-assume: ${{ secrets.AWS_DEPLOY_SVC_ACCT_ARN }}
          aws-region: ${{ vars.AWS_RESOURCE_REGION }}
          role-session-name: GitHubActions-${{ github.run_id }}

      - name: Setup Terraform
        uses: hashicorp/setup-terraform@dfe3c3f87815947d99a8997f908cb6525fc44e9e # v4.0.1
        with:
          cli_config_credentials_token: ${{ secrets.TF_API_TOKEN }}

      - name: Terraform init
        run: terraform -chdir=Terraform init -reconfigure

      - name: Fetch config from Terraform outputs
        id: tf_config
        run: |
          fetch() {
            local name="$1"
            local value
            if ! value="$(terraform -chdir=Terraform output -raw "$name")" || [ -z "$value" ]; then
              echo "::error::terraform output -raw $name did not produce a value"
              exit 1
            fi
            echo "Resolved $name = $value"
            echo "$name=$value" >> "$GITHUB_OUTPUT"
          }
          fetch api_endpoint
          fetch cognito_user_pool_id
          fetch cognito_client_id

      - name: Install dependencies
        working-directory: Source/front-end
        run: flutter pub get

      - name: Render production config
        working-directory: Source/front-end
        env:
          API_BASE_URL: ${{ steps.tf_config.outputs.api_endpoint }}
          COGNITO_USER_POOL_ID: ${{ steps.tf_config.outputs.cognito_user_pool_id }}
          COGNITO_CLIENT_ID: ${{ steps.tf_config.outputs.cognito_client_id }}
        run: bash scripts/render_frontend_config.sh

      # --pwa-strategy=none skips generating flutter_service_worker.js.
      # Flutter's default service worker cache-first-serves every RESOURCE
      # file including flutter_bootstrap.js itself -- the file that carries
      # the new serviceWorkerVersion each build uses to detect an update --
      # so once a service worker is installed, a normal reload keeps
      # re-serving its own stale cached flutter_bootstrap.js and never sees
      # the new version to trigger an update. Only a hard refresh (which
      # bypasses the service worker for that navigation) broke the loop.
      # No service worker means every request goes through the S3/CloudFront
      # no-cache + 0-TTL edge cache policy instead, which does update on a
      # normal reload.
      - name: Build web
        working-directory: Source/front-end
        run: flutter build web --release --pwa-strategy=none --dart-define-from-file=config/prod.json

      - name: Upload build artifact
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: frontend-build
          path: Source/front-end/build/web
          retention-days: 7
