# Builds, tests, and packages the Flutter Web frontend. Runs standalone
# (workflow_dispatch) or called from frontend_deploy.yml (workflow_call) --
# either way the work is identical: run tests, then build only if they
# pass, and upload the built site as an artifact.
#
# Build-only, same shape as nfl_ai_hosting.yml -- no deploy step here.
# Deploying (syncing to S3 + invalidating CloudFront) is
# frontend_sync_deploy.yml's job. Unlike the predict Lambda's image (which
# MUST be pushed before Terraform can create the function), S3/CloudFront
# have no such ordering requirement, so there's no reason for this job to
# touch Terraform/AWS at all -- frontend_deploy.yml runs this AFTER
# `infra` and passes the config values in directly as inputs.
#
# No Dockerfile -- flutter build web runs directly on the runner via
# subosito/flutter-action, the same way run_python_tests.yml installs
# Python directly rather than containerizing test runs.

name: Frontend Hosting

on:
  workflow_dispatch:
    inputs:
      api_base_url:
        required: true
        type: string
      cognito_user_pool_id:
        required: true
        type: string
      cognito_client_id:
        required: true
        type: string
  workflow_call:
    inputs:
      api_base_url:
        required: true
        type: string
      cognito_user_pool_id:
        required: true
        type: string
      cognito_client_id:
        required: true
        type: string
    outputs:
      artifact_name:
        description: 'Name of the uploaded build/web artifact, for frontend_sync_deploy.yml to download'
        value: ${{ jobs.build-frontend.outputs.artifact_name }}

env:
  FLUTTER_VERSION: '3.29.3'

permissions:
  contents: read

jobs:
  test-frontend:
    name: Run frontend tests
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Flutter
        uses: subosito/flutter-action@v2
        with:
          flutter-version: ${{ env.FLUTTER_VERSION }}
          channel: stable

      - name: Install dependencies
        working-directory: Source/front-end
        run: flutter pub get

      - name: Analyze
        working-directory: Source/front-end
        run: flutter analyze

      - name: Test
        working-directory: Source/front-end
        run: flutter test

  build-frontend:
    name: Build frontend
    needs: test-frontend
    runs-on: ubuntu-latest
    outputs:
      artifact_name: frontend-build
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Flutter
        uses: subosito/flutter-action@v2
        with:
          flutter-version: ${{ env.FLUTTER_VERSION }}
          channel: stable

      - name: Install dependencies
        working-directory: Source/front-end
        run: flutter pub get

      - name: Render production config
        working-directory: Source/front-end
        env:
          API_BASE_URL: ${{ inputs.api_base_url }}
          COGNITO_USER_POOL_ID: ${{ inputs.cognito_user_pool_id }}
          COGNITO_CLIENT_ID: ${{ inputs.cognito_client_id }}
        run: bash scripts/render_frontend_config.sh

      - name: Build web
        working-directory: Source/front-end
        run: flutter build web --release --dart-define-from-file=config/prod.json

      - name: Upload build artifact
        uses: actions/upload-artifact@v4
        with:
          name: frontend-build
          path: Source/front-end/build/web
          retention-days: 7
