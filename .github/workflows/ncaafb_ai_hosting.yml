# Builds, tests, and pushes the NCAAFB AI hosting/inference image. Runs
# standalone (workflow_dispatch) or called from ncaafb_deploy.yml
# (workflow_call) -- mirrors nfl_ai_hosting.yml's own shape and reasoning
# exactly (see that file's own comment for the full build-before-infra,
# deploy-after-infra ordering rationale).
#
# Container image, not the zip packaging ingest/normalize/schedule-sync
# use (see python_lambda_build.yml) -- same xgboost/numpy/scipy size
# reasoning as nfl_ai_hosting.yml's own comment. See
# Source/aws-lambdas/ncaafb/predict/Dockerfile.

name: NCAAFB AI Hosting

on:
  workflow_dispatch:
  workflow_call:
    outputs:
      predict_image_uri:
        description: 'Versioned tag of the pushed ncaafb-predict image, for ncaafb_predict_deploy.yml to point the Lambda at'
        value: ${{ jobs.build-predict-image.outputs.versioned_tag }}

env:
  PREDICT_IMAGE_VERSION: '1.0.0'

permissions:
  id-token: write
  contents: read

jobs:
  test-predict:
    name: Run ncaafb-predict tests
    uses: ./.github/workflows/run_python_tests.yml
    with:
      test_path: >-
        Source/tests/library/
        Source/tests/aws-lambdas/ncaafb/test_live_features.py
        Source/tests/aws-lambdas/ncaafb/test_event_prediction.py
        Source/tests/aws-lambdas/ncaafb/test_predict_handler.py
        Source/tests/aws-lambdas/ncaafb/test_season_simulation.py
        Source/tests/aws-lambdas/ncaafb/test_season_projection.py
      # Both requirements files -- requirements-nodeps.txt (xgboost, only
      # ever installed --no-deps in the real Dockerfile build to dodge its
      # nvidia-nccl-cu12 GPU dependency) still needs to be installed HERE
      # for xgboost itself to be importable at all in this test job. Same
      # reasoning as nfl_ai_hosting.yml's own identical comment.
      requirements_files: 'Source/aws-lambdas/ncaafb/predict/requirements.txt Source/aws-lambdas/ncaafb/predict/requirements-nodeps.txt'

  set-versions:
    name: Resolve image versions
    runs-on: ubuntu-latest
    outputs:
      predict_version: ${{ steps.out.outputs.predict_version }}
    steps:
      - id: out
        run: echo "predict_version=${{ env.PREDICT_IMAGE_VERSION }}" >> "$GITHUB_OUTPUT"

  build-predict-image:
    name: Build and push predict image
    needs: [set-versions, test-predict]
    uses: ./.github/workflows/docker_build_push.yml
    secrets: inherit
    with:
      dockerfile_path: 'Source/aws-lambdas/ncaafb/predict/Dockerfile'
      docker_context: 'Source'
      image_name: 'ncaafb-predict'
      image_version: ${{ needs.set-versions.outputs.predict_version }}
      # arm64 (Graviton) -- matches aws_lambda_function.ncaafb_predict's
      # own architectures = ["arm64"] (Terraform/lambda-ncaafb-predict.tf).
      # Same reasoning as nfl_ai_hosting.yml's own identical setting.
      platform: 'linux/arm64'
