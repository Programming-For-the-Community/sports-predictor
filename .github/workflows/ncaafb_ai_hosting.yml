# Builds, tests, and pushes the NCAAFB AI hosting/inference container image
# (Source/aws-lambdas/ncaafb/predict/Dockerfile).

name: NCAAFB AI Hosting

on:
  workflow_dispatch:
  workflow_call:
    outputs:
      predict_image_uri:
        description: 'Versioned tag of the pushed ncaafb-predict image, for ncaafb_predict_deploy.yml to point the Lambda at'
        value: ${{ jobs.build-predict-image.outputs.versioned_tag }}

env:
  PREDICT_IMAGE_VERSION: '1.0.0'

permissions:
  id-token: write
  contents: read

jobs:
  test-predict:
    name: Run ncaafb-predict tests
    uses: ./.github/workflows/run_python_tests.yml
    with:
      test_path: >-
        Source/tests/library/
        Source/tests/aws-lambdas/ncaafb/test_live_features.py
        Source/tests/aws-lambdas/ncaafb/test_event_prediction.py
        Source/tests/aws-lambdas/ncaafb/test_predict_handler.py
        Source/tests/aws-lambdas/ncaafb/test_season_simulation.py
        Source/tests/aws-lambdas/ncaafb/test_season_projection.py
      # Both requirements files are installed so xgboost is importable in this test job.
      requirements_files: 'Source/aws-lambdas/ncaafb/predict/requirements.txt Source/aws-lambdas/ncaafb/predict/requirements-nodeps.txt'

  set-versions:
    name: Resolve image versions
    runs-on: ubuntu-latest
    outputs:
      predict_version: ${{ steps.out.outputs.predict_version }}
    steps:
      - id: out
        run: echo "predict_version=${{ env.PREDICT_IMAGE_VERSION }}" >> "$GITHUB_OUTPUT"

  build-predict-image:
    name: Build and push predict image
    needs: [set-versions, test-predict]
    uses: ./.github/workflows/docker_build_push.yml
    secrets: inherit
    with:
      dockerfile_path: 'Source/aws-lambdas/ncaafb/predict/Dockerfile'
      docker_context: 'Source'
      image_name: 'ncaafb-predict'
      image_version: ${{ needs.set-versions.outputs.predict_version }}
      # Matches the ncaafb-predict Lambda's arm64 architecture.
      platform: 'linux/arm64'
