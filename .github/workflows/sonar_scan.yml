# Reusable workflow: runs a SonarQube Cloud analysis against the whole repo
# (single repo-wide project -- see sonar-project.properties at the repo
# root). Called once per component pipeline, between that pipeline's Test
# and Build jobs, deliberately re-analyzing the full repo every time rather
# than trying to scope the scan to just the calling component.
#
# wait_for_quality_gate controls whether a failing SonarQube Cloud quality
# gate fails THIS job (and, via the caller's plain `needs: scan`, blocks
# every downstream build/deploy job too). Defaults to false -- advisory
# only -- since every individual sport's own _deploy.yml calls this with
# the default, so a quality-gate dip on one sport's branch doesn't block
# that sport's own deploy. app_deploy.yml (the main-branch, whole-repo
# deploy) explicitly passes true, making it the one pipeline where a
# failing quality gate actually halts the deployment.
#
# Requires the SonarQube Cloud project's Analysis Method to be set to
# CI-based (Administration > Analysis Method) -- Automatic Analysis, the
# default for new projects, rejects CI-submitted reports.
#
# environment/parent_workflow are attached to the analysis as
# sonar.analysis.* custom properties (SonarQube Cloud's supported
# mechanism for per-analysis metadata -- visible via the Web API and
# webhooks, not project-level tags) so a given analysis run in the
# SonarQube Cloud dashboard can be traced back to which top-level
# pipeline produced it. parent_workflow should be passed as
# `${{ github.workflow }}` from the CALLER's own job -- evaluating that
# expression here inside the reusable callee would be ambiguous about
# which workflow it refers to.
#
# Coverage: this job always transitively depends on every test-* job in
# the calling pipeline (that's the whole reason `needs: scan` is enough
# for callers), and GitHub Actions artifacts are scoped to the whole
# workflow run rather than to whichever job uploaded them -- so every
# coverage-* artifact run_python_tests.yml's test jobs already uploaded
# is downloadable here with no changes to any caller's job graph. They're
# combined into one coverage.xml and pointed at via
# sonar.python.coverage.reportPaths, when any exist (a standalone
# workflow_dispatch run of just this file has none, which is fine --
# analysis just proceeds without coverage data that run).

name: SonarQube Cloud Scan

on:
  workflow_dispatch:
    inputs: &inputs
      wait_for_quality_gate:
        description: 'Fail this job (and everything downstream) if the SonarQube Cloud quality gate fails'
        required: false
        type: boolean
        default: false
      environment:
        description: 'Deployment environment this run belongs to (e.g. development, production) -- tagged on the analysis'
        required: false
        type: string
        default: 'development'
      parent_workflow:
        description: 'Name of the top-level pipeline calling this scan (pass the github.workflow context value from the caller''s own job) -- tagged on the analysis'
        required: false
        type: string
        default: ''
  workflow_call:
    inputs: *inputs

jobs:
  scan:
    name: SonarQube Cloud scan
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v4
        with:
          # Full history -- SonarQube's blame/new-code analysis needs it.
          fetch-depth: 0

      - name: Download coverage data from every test job
        # Tolerant of finding zero matches -- a standalone workflow_dispatch
        # run of just this file has no upstream test jobs in the same run.
        continue-on-error: true
        uses: actions/download-artifact@v4
        with:
          pattern: 'coverage-*'
          path: coverage-artifacts

      - name: Download Dart coverage data
        # Separate artifact/step from the Python coverage-* pattern above --
        # frontend_deploy.yml/app_deploy.yml's own test-frontend job uploads
        # one LCOV file (a different tool and format entirely from Python's
        # own .coverage SQLite files), nothing to combine. Same
        # continue-on-error reasoning as the Python download.
        continue-on-error: true
        uses: actions/download-artifact@v4
        with:
          name: dart-coverage
          path: dart-coverage

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      # Without this, SonarQube Cloud's Dart analyzer can't resolve a single
      # `package:` import anywhere in Source/front-end/lib (no Flutter SDK,
      # no resolved .dart_tool/package_config.json in this job's own
      # checkout) -- surfaces as "Target of URI doesn't exist"/"Undefined
      # class Widget/BuildContext/..." on nearly every Dart file, which look
      # like real code errors but aren't (flutter analyze passes clean on
      # the same code in frontend_deploy.yml's own test-frontend job, which
      # does run this same setup first). Version matches frontend_deploy.yml/
      # app_deploy.yml's own FLUTTER_VERSION.
      - name: Set up Flutter
        uses: subosito/flutter-action@v2
        with:
          flutter-version: '3.29.3'
          channel: stable

      - name: Resolve front-end package dependencies
        working-directory: Source/front-end
        run: flutter pub get

      # Regenerates Source/library's own pylock.toml (PEP 751) fresh, same
      # as run_python_tests.yml's own "Lock and install library package"
      # step -- that step's own generated file never leaves its own job's
      # ephemeral runner, so without this, this job's own checkout never
      # has a pylock.toml on disk for the scanner to see, regardless of
      # what every test job already generated. No actual install needed
      # here, this job never imports library -- just the lock file itself.
      - name: Regenerate Source/library's lock file
        run: |
          set -e
          pip install --no-cache-dir --quiet uv
          (cd Source/library && uv lock --quiet && uv export --quiet --format pylock.toml --no-emit-project -o pylock.toml)

      - name: Combine coverage data
        id: merge_coverage
        run: |
          pip install --no-cache-dir --only-binary :all: coverage==7.4.4

          echo "::group::Downloaded coverage artifacts"
          find coverage-artifacts -type f 2>/dev/null || echo "(coverage-artifacts directory not present)"
          echo "::endgroup::"

          mkdir -p merged_coverage
          found=false
          if [ -d coverage-artifacts ]; then
            i=0
            for d in coverage-artifacts/*/; do
              if [ -f "${d}.coverage" ]; then
                i=$((i + 1))
                cp "${d}.coverage" "merged_coverage/.coverage.$i"
                found=true
              fi
            done
          fi
          echo "Merged $i coverage data file(s)"

          if [ "$found" = true ]; then
            coverage combine merged_coverage
            coverage report -m || true
            coverage xml -o coverage.xml
            echo "::group::coverage.xml"
            head -c 2000 coverage.xml
            echo "::endgroup::"
            echo "report_path=coverage.xml" >> "$GITHUB_OUTPUT"
          else
            echo "report_path=" >> "$GITHUB_OUTPUT"
          fi

      - name: Resolve scanner args
        id: scanner_args
        run: |
          # Sanitized to one shell-safe token -- the scan action's own
          # script invokes sonar-scanner with this string unquoted, so a
          # raw space (e.g. github.workflow's "App Deploy") gets word-split
          # into a stray argument and the CLI rejects it.
          PARENT_WORKFLOW="${{ inputs.parent_workflow }}"
          PARENT_WORKFLOW="${PARENT_WORKFLOW// /_}"
          ENVIRONMENT="${{ inputs.environment }}"
          ENVIRONMENT="${ENVIRONMENT// /_}"
          # sonar.analysis.* custom properties aren't rendered anywhere in
          # the SonarQube Cloud UI (only retrievable via the
          # api/project_analyses/search Web API) -- sonar.buildString is
          # the property that actually shows up per-analysis on the
          # project's Activity page, so that's the one used for anything
          # meant to be human-visible on the dashboard.
          ARGS="-Dsonar.organization=${{ vars.SONAR_ORGANIZATION }} -Dsonar.projectKey=${{ vars.SONAR_PROJECT_KEY }} -Dsonar.qualitygate.wait=${{ inputs.wait_for_quality_gate }} -Dsonar.buildString=${ENVIRONMENT}-${PARENT_WORKFLOW} -Dsonar.analysis.environment=$ENVIRONMENT -Dsonar.analysis.parentWorkflow=$PARENT_WORKFLOW"
          if [ -n "${{ steps.merge_coverage.outputs.report_path }}" ]; then
            ARGS="$ARGS -Dsonar.python.coverage.reportPaths=${{ steps.merge_coverage.outputs.report_path }}"
          fi
          # sonar.dart.coverage.reportPaths, by analogy with sonar.python.
          # coverage.reportPaths above (same LANGUAGE.coverage.reportPaths
          # shape SonarQube's own Python/JS/TS coverage import uses) --
          # SonarQube Cloud's own Dart support is newer/less documented
          # than Python's, so double-check the dashboard's own Coverage
          # tab actually populates after this lands; an unrecognized -D
          # property is silently ignored by the scanner, not a hard
          # failure, so this is a safe attempt either way.
          if [ -f dart-coverage/lcov.info ]; then
            ARGS="$ARGS -Dsonar.dart.coverage.reportPaths=dart-coverage/lcov.info"
          fi
          echo "args=$ARGS" >> "$GITHUB_OUTPUT"

          # No secrets in $ARGS (SONAR_TOKEN is passed separately, as the
          # scan action's own env var, never as a -D property) -- safe to
          # print in full. Printed here, not just left to be inferred from
          # the report_path/dart-coverage steps above, because it's the
          # exact string handed to sonar-scanner -- the one thing to check
          # first if the dashboard's Coverage tab still shows 0% after this
          # job reports a non-empty report_path: either this project's
          # SonarQube Cloud Analysis Method is set to Automatic (see this
          # workflow's own top-of-file comment -- Automatic Analysis
          # ignores/rejects everything a CI-submitted scan sends, including
          # these -D properties) or coverage.xml's own recorded file paths
          # don't line up with sonar.sources=Source.
          echo "::group::Resolved sonar-scanner arguments"
          echo "$ARGS"
          echo "::endgroup::"

      - name: SonarQube Cloud Scan
        uses: SonarSource/sonarqube-scan-action@7006c4492b2e0ee0f816d36501671557c97f5995 # v8.1.0
        env:
          SONAR_TOKEN: ${{ secrets.SONAR_TOKEN }}
        with:
          args: ${{ steps.scanner_args.outputs.args }}
