# Reusable workflow: builds and pushes a single Docker image. Build-only --
# no test, no scan. The caller is responsible for testing the relevant
# code and running exactly one SonarQube Cloud scan per pipeline run
# (gating this job on that scan via `needs:`), since a scan job can't
# depend on jobs nested inside a called reusable workflow -- only a
# sibling job in the SAME calling file can be a `needs:` target. See
# nfl_deploy.yml/app_deploy.yml for the pattern: explicit `test-*` jobs,
# one shared `scan` job needing all of them, then this workflow needing
# `scan`.
#
# The `image_tag` output is only consumed by callers whose image feeds a
# Lambda (ai_hosting's own callers, via docker_lambda_deploy.yml) --
# harmless to ignore for an image that only feeds an ECS/Fargate task
# (backfill), which reads the floating "-latest" tag directly instead.

name: Docker Image Deploy

on:
  workflow_dispatch:
    inputs: &inputs
      sport:
        description: 'Sport display name for job labels (e.g. NFL, PGA)'
        required: true
        type: string
      dockerfile_path:
        required: true
        type: string
      image_name:
        description: 'e.g. nfl-backfill, nfl-predict'
        required: true
        type: string
      image_version:
        required: true
        type: string
      platform:
        description: 'linux/amd64 (the default) for every ECS/Fargate-consumed image, linux/arm64 to match a Graviton inference Lambda'
        required: false
        type: string
        default: 'linux/amd64'
  workflow_call:
    inputs: *inputs
    outputs:
      image_tag:
        description: 'Plain versioned tag of the pushed image (e.g. "nfl-predict-1.0.0"), no registry prefix -- for docker_lambda_deploy.yml to reconstruct a full image URI from its own secrets.ECR_URI access (unused by ECS/Fargate-only images). Deliberately not a full URI -- see docker_push.yml''s own push step comment for why embedding the ECR_URI secret in a job output silently breaks it.'
        value: ${{ jobs.push.outputs.versioned_tag }}

permissions:
  id-token: write
  contents: read

jobs:
  build:
    name: Build ${{ inputs.sport }} image
    uses: ./.github/workflows/docker_build.yml
    secrets: inherit
    with:
      dockerfile_path: ${{ inputs.dockerfile_path }}
      docker_context: 'Source'
      image_name: ${{ inputs.image_name }}
      image_version: ${{ inputs.image_version }}
      platform: ${{ inputs.platform }}

  push:
    name: Push ${{ inputs.sport }} image
    needs: build
    uses: ./.github/workflows/docker_push.yml
    secrets: inherit
    with:
      artifact_name: ${{ needs.build.outputs.artifact_name }}
      versioned_tag: ${{ needs.build.outputs.versioned_tag }}
      latest_tag: ${{ needs.build.outputs.latest_tag }}
