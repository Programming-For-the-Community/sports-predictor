# Tests, scans with SonarQube Cloud, builds, and deploys the NCAAFB
# recurring data pipeline Lambdas: ncaafb-ingest (writes raw CFBD JSON to
# S3), ncaafb-normalize (S3-triggered, writes to DynamoDB), and
# ncaafb-schedule-sync (EventBridge-triggered, writes raw schedule JSON to
# S3). One scan gates all three builds -- SonarQube Cloud analyzes the
# whole repo either way, so there's no value in scanning three times per
# pipeline run. Each of the three chains is otherwise independent -- a
# failure in one does not block the others.
#
# Lambda function names come from the caller (ncaafb_deploy.yml) via
# Terraform outputs, with defaults for standalone workflow_dispatch runs.

name: NCAAFB Data Pipeline

on:
  workflow_dispatch:
  workflow_call:
    inputs:
      ingest_function_name:
        description: 'NCAAFB ingest Lambda function name (from Terraform output ncaafb_ingest_function_name)'
        required: false
        type: string
        default: 'sports-predictor-ncaafb-ingest'
      normalize_function_name:
        description: 'NCAAFB normalize Lambda function name (from Terraform output ncaafb_normalize_function_name)'
        required: false
        type: string
        default: 'sports-predictor-ncaafb-normalize'
      schedule_sync_function_name:
        description: 'NCAAFB schedule-sync Lambda function name (from Terraform output ncaafb_schedule_sync_function_name)'
        required: false
        type: string
        default: 'sports-predictor-ncaafb-schedule-sync'

permissions:
  id-token: write
  contents: read

jobs:
  test-ingest:
    name: Run ncaafb-ingest tests
    uses: ./.github/workflows/run_python_tests.yml
    with:
      test_path: >-
        Source/tests/aws-lambdas/ncaafb/test_ingest_lambda_handler.py
        Source/tests/aws-lambdas/ncaafb/test_ingest_enrichment.py
      requirements_files: 'Source/aws-lambdas/ncaafb/ingest/requirements.txt'

  test-normalize:
    name: Run ncaafb-normalize tests
    uses: ./.github/workflows/run_python_tests.yml
    with:
      test_path: 'Source/tests/aws-lambdas/ncaafb/test_normalize.py'
      requirements_files: 'Source/aws-lambdas/ncaafb/normalize/requirements.txt'

  test-schedule-sync:
    name: Run ncaafb-schedule-sync tests
    uses: ./.github/workflows/run_python_tests.yml
    with:
      test_path: 'Source/tests/aws-lambdas/ncaafb/test_schedule_sync.py'
      requirements_files: 'Source/aws-lambdas/ncaafb/schedule-sync/requirements.txt'

  scan:
    name: SonarQube Cloud scan
    needs: [test-ingest, test-normalize, test-schedule-sync]
    uses: ./.github/workflows/sonar_scan.yml
    secrets: inherit

  build-ingest:
    name: Build ncaafb-ingest Lambda
    needs: scan
    uses: ./.github/workflows/python_lambda_build.yml
    with:
      function_name: ${{ inputs.ingest_function_name || 'sports-predictor-ncaafb-ingest' }}
      handler_dir: 'Source/aws-lambdas/ncaafb/ingest'
      library_path: 'Source/library'
      extra_source_files: 'Source/aws-lambdas/ncaafb/ingest/enrichment.py'

  deploy-ingest:
    name: Deploy ncaafb-ingest Lambda
    needs: build-ingest
    uses: ./.github/workflows/python_lambda_deploy.yml
    secrets: inherit
    with:
      function_name: ${{ inputs.ingest_function_name || 'sports-predictor-ncaafb-ingest' }}
      artifact_name: ${{ needs.build-ingest.outputs.artifact_name }}

  build-normalize:
    name: Build ncaafb-normalize Lambda
    needs: scan
    uses: ./.github/workflows/python_lambda_build.yml
    with:
      function_name: ${{ inputs.normalize_function_name || 'sports-predictor-ncaafb-normalize' }}
      handler_dir: 'Source/aws-lambdas/ncaafb/normalize'
      library_path: 'Source/library'

  deploy-normalize:
    name: Deploy ncaafb-normalize Lambda
    needs: build-normalize
    uses: ./.github/workflows/python_lambda_deploy.yml
    secrets: inherit
    with:
      function_name: ${{ inputs.normalize_function_name || 'sports-predictor-ncaafb-normalize' }}
      artifact_name: ${{ needs.build-normalize.outputs.artifact_name }}

  build-schedule-sync:
    name: Build ncaafb-schedule-sync Lambda
    needs: scan
    uses: ./.github/workflows/python_lambda_build.yml
    with:
      function_name: ${{ inputs.schedule_sync_function_name || 'sports-predictor-ncaafb-schedule-sync' }}
      handler_dir: 'Source/aws-lambdas/ncaafb/schedule-sync'
      library_path: 'Source/library'

  deploy-schedule-sync:
    name: Deploy ncaafb-schedule-sync Lambda
    needs: build-schedule-sync
    uses: ./.github/workflows/python_lambda_deploy.yml
    secrets: inherit
    with:
      function_name: ${{ inputs.schedule_sync_function_name || 'sports-predictor-ncaafb-schedule-sync' }}
      artifact_name: ${{ needs.build-schedule-sync.outputs.artifact_name }}
