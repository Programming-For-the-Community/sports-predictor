# Reusable workflow: builds and pushes a sport's training images -- feature
# engineering and a primary training model (win-probability for most
# sports, top-10 for PGA). NCAAFB/NCAA MBB's national-ranking training
# image is built separately, via ncaafb_deploy.yml/ncaambb_deploy.yml/
# app_deploy.yml's own `*_ranking_model_build` jobs (docker_image_deploy.yml).
# Build-only -- no test, no scan. The caller is responsible for testing the relevant
# code and running exactly one SonarQube Cloud scan per pipeline run
# (gating this job on that scan via `needs:`), since a scan job can't
# depend on jobs nested inside a called reusable workflow -- only a
# sibling job in the SAME calling file can be a `needs:` target. See
# nfl_deploy.yml/app_deploy.yml for the pattern: explicit `test-*` jobs,
# one shared `scan` job needing all of them, then this workflow needing
# `scan`.

name: Sport AI Training

on:
  workflow_dispatch:
    inputs: &inputs
      sport:
        description: 'Sport display name for job labels (e.g. NFL, PGA)'
        required: true
        type: string
      feature_engineering_dockerfile_path:
        required: true
        type: string
      feature_engineering_image_name:
        required: true
        type: string
      feature_engineering_image_version:
        required: true
        type: string
      train_model_dockerfile_path:
        required: true
        type: string
      train_model_image_name:
        description: 'e.g. nfl-train-win-probability-model, pga-train-top10-model'
        required: true
        type: string
      train_model_image_version:
        required: true
        type: string
  workflow_call:
    inputs: *inputs

permissions:
  id-token: write
  contents: read

jobs:
  build-feature-engineering-image:
    name: Build ${{ inputs.sport }} feature engineering image
    uses: ./.github/workflows/docker_build.yml
    secrets: inherit
    with:
      dockerfile_path: ${{ inputs.feature_engineering_dockerfile_path }}
      docker_context: 'Source'
      image_name: ${{ inputs.feature_engineering_image_name }}
      image_version: ${{ inputs.feature_engineering_image_version }}

  push-feature-engineering-image:
    name: Push ${{ inputs.sport }} feature engineering image
    needs: build-feature-engineering-image
    uses: ./.github/workflows/docker_push.yml
    secrets: inherit
    with:
      artifact_name: ${{ needs.build-feature-engineering-image.outputs.artifact_name }}
      versioned_tag: ${{ needs.build-feature-engineering-image.outputs.versioned_tag }}
      latest_tag: ${{ needs.build-feature-engineering-image.outputs.latest_tag }}

  build-train-model-image:
    name: Build ${{ inputs.sport }} train model image
    uses: ./.github/workflows/docker_build.yml
    secrets: inherit
    with:
      dockerfile_path: ${{ inputs.train_model_dockerfile_path }}
      docker_context: 'Source'
      image_name: ${{ inputs.train_model_image_name }}
      image_version: ${{ inputs.train_model_image_version }}

  push-train-model-image:
    name: Push ${{ inputs.sport }} train model image
    needs: build-train-model-image
    uses: ./.github/workflows/docker_push.yml
    secrets: inherit
    with:
      artifact_name: ${{ needs.build-train-model-image.outputs.artifact_name }}
      versioned_tag: ${{ needs.build-train-model-image.outputs.versioned_tag }}
      latest_tag: ${{ needs.build-train-model-image.outputs.latest_tag }}
