# Builds and pushes the one-off SageMaker GPU training benchmark image
# (see Source/model-training/ncaafb/sagemaker_gpu_poc/README.md). Not
# part of the regular pipeline -- workflow_call is only here because
# ncaafb_deploy.yml temporarily pulls this job in (see that file's own
# TEMPORARY comment) to get it built without merging to main; drop
# workflow_call again once that temporary wiring is removed.

name: NCAAFB SageMaker GPU POC Build

on:
  workflow_dispatch:
  workflow_call:

permissions:
  id-token: write
  contents: read

jobs:
  build-push:
    name: Build and push GPU POC image
    uses: ./.github/workflows/docker_build_push.yml
    secrets: inherit
    with:
      dockerfile_path: 'Source/model-training/ncaafb/sagemaker_gpu_poc/Dockerfile'
      docker_context: 'Source'
      image_name: 'ncaafb-sagemaker-gpu-poc'
      image_version: '1.0.0'
