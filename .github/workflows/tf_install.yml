# This workflow installs the latest version of Terraform CLI and configures the Terraform CLI configuration file
# with an API token for Terraform Cloud (app.terraform.io). On push/pull_requests to tf/dev runs a tf plan

name: AWS Setup

on:
  push: 
    branches:
        - tf/*
  pull_request:
    branches:
        - tf/*
  workflow_dispatch:
    inputs:
      environment:
        description: 'Deployment environment'
        required: true
        default: 'development'
        type: choice
        options:
          - development
          - production
    
  
  workflow_call:
    inputs:
      server_image_tag:
        description: 'Image tag of the server Docker image'
        required: false
        type: string
      server_version:
        description: 'Version of the server'
        required: false
        type: string
      client_image_tag:
        description: 'Image tag of the client Docker image'
        required: false
        type: string
      client_version:
        required: false
        type: string
        description: 'Version of the client'
    outputs:
      nfl_ingest_function_name:
        description: 'NFL ingest Lambda function name'
        value: ${{ jobs.terraform.outputs.nfl_ingest_function_name }}
      nfl_normalize_function_name:
        description: 'NFL normalize Lambda function name'
        value: ${{ jobs.terraform.outputs.nfl_normalize_function_name }}
      nfl_schedule_sync_function_name:
        description: 'NFL schedule-sync Lambda function name'
        value: ${{ jobs.terraform.outputs.nfl_schedule_sync_function_name }}
      nfl_predict_function_name:
        description: 'NFL predict Lambda function name'
        value: ${{ jobs.terraform.outputs.nfl_predict_function_name }}
      season_gate_function_name:
        description: 'Shared season-gate Lambda function name'
        value: ${{ jobs.terraform.outputs.season_gate_function_name }}
      nfl_predict_read_function_name:
        description: 'NFL predict-read Lambda function name'
        value: ${{ jobs.terraform.outputs.nfl_predict_read_function_name }}
      nfl_live_scores_function_name:
        description: 'NFL live-scores Lambda function name'
        value: ${{ jobs.terraform.outputs.nfl_live_scores_function_name }}
      ncaafb_ingest_function_name:
        description: 'NCAAFB ingest Lambda function name'
        value: ${{ jobs.terraform.outputs.ncaafb_ingest_function_name }}
      ncaafb_normalize_function_name:
        description: 'NCAAFB normalize Lambda function name'
        value: ${{ jobs.terraform.outputs.ncaafb_normalize_function_name }}
      ncaafb_schedule_sync_function_name:
        description: 'NCAAFB schedule-sync Lambda function name'
        value: ${{ jobs.terraform.outputs.ncaafb_schedule_sync_function_name }}
      ncaafb_predict_function_name:
        description: 'NCAAFB predict Lambda function name'
        value: ${{ jobs.terraform.outputs.ncaafb_predict_function_name }}
      ncaafb_predict_read_function_name:
        description: 'NCAAFB predict-read Lambda function name'
        value: ${{ jobs.terraform.outputs.ncaafb_predict_read_function_name }}
      ncaafb_live_scores_function_name:
        description: 'NCAAFB live-scores Lambda function name'
        value: ${{ jobs.terraform.outputs.ncaafb_live_scores_function_name }}
      nba_ingest_function_name:
        description: 'NBA ingest Lambda function name'
        value: ${{ jobs.terraform.outputs.nba_ingest_function_name }}
      nba_normalize_function_name:
        description: 'NBA normalize Lambda function name'
        value: ${{ jobs.terraform.outputs.nba_normalize_function_name }}
      nba_schedule_sync_function_name:
        description: 'NBA schedule-sync Lambda function name'
        value: ${{ jobs.terraform.outputs.nba_schedule_sync_function_name }}
      nba_predict_function_name:
        description: 'NBA predict Lambda function name'
        value: ${{ jobs.terraform.outputs.nba_predict_function_name }}
      nba_predict_read_function_name:
        description: 'NBA predict-read Lambda function name'
        value: ${{ jobs.terraform.outputs.nba_predict_read_function_name }}
      nba_live_scores_function_name:
        description: 'NBA live-scores Lambda function name'
        value: ${{ jobs.terraform.outputs.nba_live_scores_function_name }}
      ncaambb_ingest_function_name:
        description: 'NCAA MBB ingest Lambda function name'
        value: ${{ jobs.terraform.outputs.ncaambb_ingest_function_name }}
      ncaambb_normalize_function_name:
        description: 'NCAA MBB normalize Lambda function name'
        value: ${{ jobs.terraform.outputs.ncaambb_normalize_function_name }}
      ncaambb_schedule_sync_function_name:
        description: 'NCAA MBB schedule-sync Lambda function name'
        value: ${{ jobs.terraform.outputs.ncaambb_schedule_sync_function_name }}
      ncaambb_predict_function_name:
        description: 'NCAA MBB predict Lambda function name'
        value: ${{ jobs.terraform.outputs.ncaambb_predict_function_name }}
      ncaambb_predict_read_function_name:
        description: 'NCAA MBB predict-read Lambda function name'
        value: ${{ jobs.terraform.outputs.ncaambb_predict_read_function_name }}
      ncaambb_live_scores_function_name:
        description: 'NCAA MBB live-scores Lambda function name'
        value: ${{ jobs.terraform.outputs.ncaambb_live_scores_function_name }}
      pga_ingest_function_name:
        description: 'PGA ingest Lambda function name'
        value: ${{ jobs.terraform.outputs.pga_ingest_function_name }}
      pga_normalize_function_name:
        description: 'PGA normalize Lambda function name'
        value: ${{ jobs.terraform.outputs.pga_normalize_function_name }}
      pga_schedule_sync_function_name:
        description: 'PGA schedule-sync Lambda function name'
        value: ${{ jobs.terraform.outputs.pga_schedule_sync_function_name }}
      pga_predict_function_name:
        description: 'PGA predict Lambda function name'
        value: ${{ jobs.terraform.outputs.pga_predict_function_name }}
      pga_predict_read_function_name:
        description: 'PGA predict-read Lambda function name'
        value: ${{ jobs.terraform.outputs.pga_predict_read_function_name }}
      pga_live_scores_function_name:
        description: 'PGA live-scores Lambda function name'
        value: ${{ jobs.terraform.outputs.pga_live_scores_function_name }}
      f1_ingest_function_name:
        description: 'F1 ingest Lambda function name'
        value: ${{ jobs.terraform.outputs.f1_ingest_function_name }}
      f1_normalize_function_name:
        description: 'F1 normalize Lambda function name'
        value: ${{ jobs.terraform.outputs.f1_normalize_function_name }}
      f1_predict_function_name:
        description: 'F1 predict Lambda function name'
        value: ${{ jobs.terraform.outputs.f1_predict_function_name }}
      f1_predict_read_function_name:
        description: 'F1 predict-read Lambda function name'
        value: ${{ jobs.terraform.outputs.f1_predict_read_function_name }}
      f1_live_scores_function_name:
        description: 'F1 live-scores Lambda function name'
        value: ${{ jobs.terraform.outputs.f1_live_scores_function_name }}
      cognito_user_pool_id:
        description: 'Cognito User Pool ID'
        value: ${{ jobs.terraform.outputs.cognito_user_pool_id }}
      cognito_client_id:
        description: 'Cognito App Client ID'
        value: ${{ jobs.terraform.outputs.cognito_client_id }}
      api_endpoint:
        description: "The app's one public URL (frontend + API, via CloudFront)"
        value: ${{ jobs.terraform.outputs.api_endpoint }}
      frontend_bucket_name:
        description: 'Frontend static site S3 bucket name'
        value: ${{ jobs.terraform.outputs.frontend_bucket_name }}
      frontend_distribution_id:
        description: 'CloudFront distribution ID for the frontend/API'
        value: ${{ jobs.terraform.outputs.frontend_distribution_id }}

permissions:
  id-token: write
  contents: read

env:
  TF_VAR_vpc_id: ${{ secrets.VPC_ID }}
  TF_VAR_vpc_cidr: ${{ secrets.VPC_CIDR }}
  TF_VAR_domain_name: ${{ secrets.DOMAIN_NAME }}
  TF_VAR_hosted_zone_id: ${{ secrets.DOMAIN_HOSTED_ZONE_ID }}
  TF_VAR_account_id: ${{ secrets.AWS_ACCOUNT_ID }}
  TF_VAR_region: ${{ vars.AWS_RESOURCE_REGION }}
  TF_VAR_project: ${{ vars.PROJECT}}
  TF_VAR_owner: ${{ vars.OWNER}}
  TF_VAR_alert_email: ${{ secrets.ALERT_EMAIL }}
  TF_VAR_environment: ${{ github.event.inputs.environment || 'development' }}
  TF_VAR_private1_subnet_cidr: ${{ vars.SUBNET_A_CIDR }}
  TF_VAR_private2_subnet_cidr: ${{ vars.SUBNET_B_CIDR }}
  TF_VAR_private3_subnet_cidr: ${{ vars.SUBNET_C_CIDR }}
  TF_VAR_public1_subnet_cidr: ${{ vars.PUBLIC1_SUBNET_CIDR }}
  TF_VAR_public2_subnet_cidr: ${{ vars.PUBLIC2_SUBNET_CIDR }}
  TF_VAR_public3_subnet_cidr: ${{ vars.PUBLIC3_SUBNET_CIDR }}
  TF_VAR_ecr_repo_url: ${{ secrets.ECR_URI }}
  TF_VAR_espn_api_root_url: ${{ vars.ESPN_API_ROOT_URL }}
  TF_VAR_espn_core_api_root_url: ${{ vars.ESPN_CORE_API_ROOT_URL }}
  TF_VAR_ncaambb_espn_core_api_root_url: ${{ vars.NCAAMBB_ESPN_CORE_API_ROOT_URL }}
  TF_VAR_cfbd_api_root_url: ${{ vars.CFBD_API_ROOT_URL }}
  TF_VAR_jolpica_api_root_url: ${{ vars.JOLPICA_API_ROOT_URL }}
  TF_VAR_third_party_api_key_secret_arn: ${{ secrets.THIRD_PARTY_API_KEYS_SECRET_ARN }}
  TF_VAR_fargate_account_vcpu_limit: ${{ vars.FARGATE_VCPU_LIMIT }}
  TF_VAR_fargate_spot_account_vcpu_limit: ${{ vars.FARGATE_SPOT_VCPU_LIMIT }}
  TF_VAR_training_vcpu_budget_fraction: ${{ vars.VCPU_BUDGET_FRACTION }}
  TF_VAR_training_task_vcpu: ${{ vars.TRAINING_TASK_VCPU_LIMIT }}
  TF_VAR_ec2_ondemand_account_vcpu_limit: ${{ vars.EC2_ONDEMAND_VCPU_LIMIT }}
  TF_VAR_ec2_spot_account_vcpu_limit: ${{ vars.EC2_SPOT_VCPU_LIMIT }}
  TF_VAR_training_ec2_sport_concurrency: ${{ vars.TRAINING_EC2_SPORT_CONCURRENCY }}

jobs:
  terraform:
    name: 'Terraform'
    runs-on: ubuntu-latest
    outputs:
      nfl_ingest_function_name: ${{ steps.tf_outputs.outputs.nfl_ingest_function_name }}
      nfl_normalize_function_name: ${{ steps.tf_outputs.outputs.nfl_normalize_function_name }}
      nfl_schedule_sync_function_name: ${{ steps.tf_outputs.outputs.nfl_schedule_sync_function_name }}
      nfl_predict_function_name: ${{ steps.tf_outputs.outputs.nfl_predict_function_name }}
      season_gate_function_name: ${{ steps.tf_outputs.outputs.season_gate_function_name }}
      nfl_predict_read_function_name: ${{ steps.tf_outputs.outputs.nfl_predict_read_function_name }}
      nfl_live_scores_function_name: ${{ steps.tf_outputs.outputs.nfl_live_scores_function_name }}
      ncaafb_ingest_function_name: ${{ steps.tf_outputs.outputs.ncaafb_ingest_function_name }}
      ncaafb_normalize_function_name: ${{ steps.tf_outputs.outputs.ncaafb_normalize_function_name }}
      ncaafb_schedule_sync_function_name: ${{ steps.tf_outputs.outputs.ncaafb_schedule_sync_function_name }}
      ncaafb_predict_function_name: ${{ steps.tf_outputs.outputs.ncaafb_predict_function_name }}
      ncaafb_predict_read_function_name: ${{ steps.tf_outputs.outputs.ncaafb_predict_read_function_name }}
      ncaafb_live_scores_function_name: ${{ steps.tf_outputs.outputs.ncaafb_live_scores_function_name }}
      nba_ingest_function_name: ${{ steps.tf_outputs.outputs.nba_ingest_function_name }}
      nba_normalize_function_name: ${{ steps.tf_outputs.outputs.nba_normalize_function_name }}
      nba_schedule_sync_function_name: ${{ steps.tf_outputs.outputs.nba_schedule_sync_function_name }}
      nba_predict_function_name: ${{ steps.tf_outputs.outputs.nba_predict_function_name }}
      nba_predict_read_function_name: ${{ steps.tf_outputs.outputs.nba_predict_read_function_name }}
      nba_live_scores_function_name: ${{ steps.tf_outputs.outputs.nba_live_scores_function_name }}
      ncaambb_ingest_function_name: ${{ steps.tf_outputs.outputs.ncaambb_ingest_function_name }}
      ncaambb_normalize_function_name: ${{ steps.tf_outputs.outputs.ncaambb_normalize_function_name }}
      ncaambb_schedule_sync_function_name: ${{ steps.tf_outputs.outputs.ncaambb_schedule_sync_function_name }}
      ncaambb_predict_function_name: ${{ steps.tf_outputs.outputs.ncaambb_predict_function_name }}
      ncaambb_predict_read_function_name: ${{ steps.tf_outputs.outputs.ncaambb_predict_read_function_name }}
      ncaambb_live_scores_function_name: ${{ steps.tf_outputs.outputs.ncaambb_live_scores_function_name }}
      pga_ingest_function_name: ${{ steps.tf_outputs.outputs.pga_ingest_function_name }}
      pga_normalize_function_name: ${{ steps.tf_outputs.outputs.pga_normalize_function_name }}
      pga_schedule_sync_function_name: ${{ steps.tf_outputs.outputs.pga_schedule_sync_function_name }}
      pga_predict_function_name: ${{ steps.tf_outputs.outputs.pga_predict_function_name }}
      pga_predict_read_function_name: ${{ steps.tf_outputs.outputs.pga_predict_read_function_name }}
      pga_live_scores_function_name: ${{ steps.tf_outputs.outputs.pga_live_scores_function_name }}
      f1_ingest_function_name: ${{ steps.tf_outputs.outputs.f1_ingest_function_name }}
      f1_normalize_function_name: ${{ steps.tf_outputs.outputs.f1_normalize_function_name }}
      f1_predict_function_name: ${{ steps.tf_outputs.outputs.f1_predict_function_name }}
      f1_predict_read_function_name: ${{ steps.tf_outputs.outputs.f1_predict_read_function_name }}
      f1_live_scores_function_name: ${{ steps.tf_outputs.outputs.f1_live_scores_function_name }}
      cognito_user_pool_id: ${{ steps.tf_outputs.outputs.cognito_user_pool_id }}
      cognito_client_id: ${{ steps.tf_outputs.outputs.cognito_client_id }}
      api_endpoint: ${{ steps.tf_outputs.outputs.api_endpoint }}
      frontend_bucket_name: ${{ steps.tf_outputs.outputs.frontend_bucket_name }}
      frontend_distribution_id: ${{ steps.tf_outputs.outputs.frontend_distribution_id }}
    # Always attaches an environment so environment-scoped secrets/variables
    # (e.g. the subnet CIDRs below) resolve.
    environment: ${{ github.event.inputs.environment || 'development' }}

    # Use the Bash shell regardless whether the GitHub Actions runner is ubuntu-latest, macos-latest, or windows-latest
    defaults:
      run:
        shell: bash

    steps:
    # Checkout the repository to the GitHub Actions runner
    - name: Checkout
      uses: actions/checkout@v4

    # Fails here rather than letting an unset required variable resolve to
    # an empty string and propagate into a running container.
    - name: Validate required variables
      run: |
        if [ -z "$TF_VAR_espn_api_root_url" ]; then
          echo "::error::ESPN_API_ROOT_URL is not set. Create it under Settings > Secrets and variables > Actions > Variables (value: https://site.api.espn.com/apis/site/v2/sports)."
          exit 1
        fi
        if [ -z "$TF_VAR_espn_core_api_root_url" ]; then
          echo "::error::ESPN_CORE_API_ROOT_URL is not set. Create it under Settings > Secrets and variables > Actions > Variables (value: https://sports.core.api.espn.com/v2/sports/football/leagues/nfl)."
          exit 1
        fi
        if [ -z "$TF_VAR_ncaambb_espn_core_api_root_url" ]; then
          echo "::error::NCAAMBB_ESPN_CORE_API_ROOT_URL is not set. Create it under Settings > Secrets and variables > Actions > Variables (value: https://sports.core.api.espn.com/v2/sports/basketball/leagues/mens-college-basketball)."
          exit 1
        fi
        if [ -z "$TF_VAR_cfbd_api_root_url" ]; then
          echo "::error::CFBD_API_ROOT_URL is not set. Create it under Settings > Secrets and variables > Actions > Variables (value: https://api.collegefootballdata.com)."
          exit 1
        fi
        if [ -z "$TF_VAR_jolpica_api_root_url" ]; then
          echo "::error::JOLPICA_API_ROOT_URL is not set. Create it under Settings > Secrets and variables > Actions > Variables (value: https://api.jolpi.ca/ergast/f1 -- https, not http: a plain http request 301-redirects to https, confirmed live 2026-08-31)."
          exit 1
        fi
        if [ -z "$TF_VAR_third_party_api_key_secret_arn" ]; then
          echo "::error::THIRD_PARTY_API_KEYS_SECRET_ARN is not set. Create it under Settings > Secrets and variables > Actions > Secrets (value: the ARN of the development/sports-predictor Secrets Manager secret -- get it via: aws secretsmanager describe-secret --secret-id development/sports-predictor --query ARN --output text). variables.tf has no default for this one -- every terraform plan/apply, for every sport, fails without it."
          exit 1
        fi

    - name: Echo vars
      run: |
        echo "client_image: $TF_VAR_client_image"

    - name: Configure AWS Credentials (via OIDC)
      uses: aws-actions/configure-aws-credentials@v4
      with:
        role-to-assume: ${{ secrets.AWS_DEPLOY_SVC_ACCT_ARN }}
        aws-region: ${{ vars.AWS_RESOURCE_REGION }}

    # Install the latest version of Terraform CLI and configure the Terraform CLI configuration file with a Terraform Cloud user API token
    - name: Setup Terraform
      uses: hashicorp/setup-terraform@v3
      with:
        cli_config_credentials_token: ${{ secrets.TF_API_TOKEN }}

    # Initialize a new or existing Terraform working directory by creating initial files, loading any remote state, downloading modules, etc.
    - name: Terraform Init
      run: terraform -chdir=Terraform init -reconfigure

    # Checks that all Terraform configuration files adhere to a canonical format
    - name: Terraform Format
      run: terraform -chdir=Terraform fmt -check

    # Validate Terraform
    - name: Terraform Validate
      run: terraform -chdir=Terraform validate

    # Generates an execution plan for Terraform
    - name: Terraform Plan
      run: terraform -chdir=Terraform plan

    # Build or change infrastructure according to Terraform configuration files.
    - name: Terraform Apply
      run: terraform -chdir=Terraform apply -auto-approve

    - name: Capture Terraform outputs
      id: tf_outputs
      run: |
        # Fails immediately, with the output name, if `terraform output`
        # errors or returns an empty value.
        capture_output() {
          local name="$1"
          local value
          if ! value="$(terraform -chdir=Terraform output -raw "$name")"; then
            echo "::error::terraform output -raw $name failed (non-zero exit) -- see the error above" >&2
            exit 1
          fi
          if [ -z "$value" ]; then
            echo "::error::terraform output -raw $name succeeded but returned an empty value" >&2
            exit 1
          fi
          echo "Resolved $name = $value"
          echo "$name=$value" >> "$GITHUB_OUTPUT"
        }

        capture_output nfl_ingest_function_name
        capture_output nfl_normalize_function_name
        capture_output nfl_schedule_sync_function_name
        capture_output nfl_predict_function_name
        capture_output season_gate_function_name
        capture_output nfl_predict_read_function_name
        capture_output nfl_live_scores_function_name
        capture_output ncaafb_ingest_function_name
        capture_output ncaafb_normalize_function_name
        capture_output ncaafb_schedule_sync_function_name
        capture_output ncaafb_predict_function_name
        capture_output ncaafb_predict_read_function_name
        capture_output ncaafb_live_scores_function_name
        capture_output nba_ingest_function_name
        capture_output nba_normalize_function_name
        capture_output nba_schedule_sync_function_name
        capture_output nba_predict_function_name
        capture_output nba_predict_read_function_name
        capture_output nba_live_scores_function_name
        capture_output ncaambb_ingest_function_name
        capture_output ncaambb_normalize_function_name
        capture_output ncaambb_schedule_sync_function_name
        capture_output ncaambb_predict_function_name
        capture_output ncaambb_predict_read_function_name
        capture_output ncaambb_live_scores_function_name
        capture_output pga_ingest_function_name
        capture_output pga_normalize_function_name
        capture_output pga_schedule_sync_function_name
        capture_output pga_predict_function_name
        capture_output pga_predict_read_function_name
        capture_output pga_live_scores_function_name
        capture_output f1_ingest_function_name
        capture_output f1_normalize_function_name
        capture_output f1_predict_function_name
        capture_output f1_predict_read_function_name
        capture_output f1_live_scores_function_name
        capture_output cognito_user_pool_id
        capture_output cognito_client_id
        capture_output api_endpoint
        capture_output frontend_bucket_name
        capture_output frontend_distribution_id