# Reusable workflow: builds a Python Lambda deployment ZIP and uploads it as
# a workflow artifact. Deploying it (updating the live function code) is
# python_lambda_deploy.yml's job -- split out of what used to be a single
# combined build+deploy job so a Scan stage can sit strictly between Test
# and Build, and Build strictly before Deploy.
#
# Build layout inside the ZIP:
#   library/   <- shared library, installed via pip --no-deps
#   handler.py <- Lambda entry point
#   <any extra_source_files, placed at ZIP root>
#   <pip-installed deps from requirements.txt>
#
# boto3 is intentionally excluded from requirements.txt for every Lambda
# because it is pre-installed in the Lambda Python runtime. Bundle only
# what the runtime doesn't already provide.
#
# No AWS credentials needed here at all -- nothing is deployed yet.

name: Build Python Lambda

on:
  workflow_call:
    inputs:
      function_name:
        description: 'Exact Lambda function name in AWS (e.g. sports-predictor-nfl-ingest) -- used only to name the build artifact/ZIP here, not to deploy anything'
        required: true
        type: string
      handler_dir:
        description: 'Relative path to the directory containing handler.py and requirements.txt'
        required: true
        type: string
      library_path:
        description: 'Relative path to the shared library to bundle as the `library` package'
        required: false
        type: string
        default: 'Source/library'
      extra_source_files:
        description: 'Space-separated list of extra source files to copy into the ZIP root'
        required: false
        type: string
        default: ''
      python_version:
        description: 'Python version to build with (must match the Lambda runtime)'
        required: false
        type: string
        default: '3.12'
    outputs:
      artifact_name:
        description: 'Name of the uploaded ZIP artifact, for python_lambda_deploy.yml to download'
        value: ${{ jobs.build.outputs.artifact_name }}

permissions:
  contents: read

jobs:
  build:
    name: Build ${{ inputs.function_name }}
    runs-on: ubuntu-latest
    outputs:
      artifact_name: ${{ steps.build-zip.outputs.artifact_name }}

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Python ${{ inputs.python_version }}
        uses: actions/setup-python@v5
        with:
          python-version: ${{ inputs.python_version }}

      - name: Build deployment ZIP
        id: build-zip
        env:
          HANDLER_DIR: ${{ inputs.handler_dir }}
          LIBRARY_PATH: ${{ inputs.library_path }}
          EXTRA_FILES: ${{ inputs.extra_source_files }}
          FUNCTION_NAME: ${{ inputs.function_name }}
        run: |
          mkdir -p package

          # Install Lambda-specific dependencies (excludes boto3 -- runtime provides it)
          if [ -s "$HANDLER_DIR/requirements.txt" ]; then
            pip install --only-binary :all: -r "$HANDLER_DIR/requirements.txt" -t package/
          fi

          # Bundle the shared library without pulling its declared dependencies
          # (boto3 and requests are already handled above or by the runtime)
          pip install --no-deps "$LIBRARY_PATH" -t package/

          # Copy extra source files (e.g. sport-specific modules) to ZIP root
          for f in $EXTRA_FILES; do
            cp "$f" package/
            echo "Bundled extra file: $f"
          done

          # Copy the Lambda handler
          cp "$HANDLER_DIR/handler.py" package/

          # Create the ZIP from inside the package dir so paths are at the root
          cd package
          zip -r "../${FUNCTION_NAME}.zip" .
          cd ..

          echo "Built ${FUNCTION_NAME}.zip ($(du -sh ${FUNCTION_NAME}.zip | cut -f1))"
          echo "artifact_name=${FUNCTION_NAME}-zip" >> "$GITHUB_OUTPUT"

      - name: Upload ZIP artifact
        uses: actions/upload-artifact@v4
        with:
          name: ${{ steps.build-zip.outputs.artifact_name }}
          path: ${{ inputs.function_name }}.zip
          retention-days: 1
