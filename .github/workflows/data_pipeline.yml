# Reusable workflow: builds and deploys a sport's recurring data pipeline
# Lambdas: ingest (writes raw JSON to S3), normalize (S3-triggered, writes
# to DynamoDB), and an optional schedule-sync (EventBridge-triggered
# schedule discovery -- leave schedule_sync_function_name blank for a
# sport with no separate schedule-sync Lambda, e.g. F1, which resolves its
# whole season from within ingest itself). Build+deploy only -- no test,
# no scan. The caller is responsible for testing the relevant code and
# running exactly one SonarQube Cloud scan per pipeline run (gating these
# jobs on that scan via `needs:`), since a scan job can't depend on jobs
# nested inside a called reusable workflow -- only a sibling job in the
# SAME calling file can be a `needs:` target. See nfl_deploy.yml/
# app_deploy.yml for the pattern: explicit `test-*` jobs, one shared
# `scan` job needing all of them, then this workflow needing `scan`.
#
# Terraform (tf_install.yml) creates each Lambda function with a placeholder
# ZIP and lifecycle { ignore_changes } so it never overwrites what this
# workflow deploys. This workflow owns all subsequent code updates.

name: Sport Data Pipeline

on:
  workflow_dispatch:
    inputs: &inputs
      sport:
        description: 'Sport display name for job labels (e.g. NFL, PGA)'
        required: true
        type: string
      ingest_function_name:
        required: true
        type: string
      ingest_handler_dir:
        required: true
        type: string
      ingest_extra_source_files:
        description: 'e.g. enrichment.py for sports whose ingest Lambda has one (NFL, NCAAFB)'
        required: false
        type: string
        default: ''
      normalize_function_name:
        required: true
        type: string
      normalize_handler_dir:
        required: true
        type: string
      schedule_sync_function_name:
        description: 'Leave blank for a sport with no schedule-sync Lambda (e.g. F1)'
        required: false
        type: string
        default: ''
      schedule_sync_handler_dir:
        required: false
        type: string
        default: ''
  workflow_call:
    inputs: *inputs

permissions:
  id-token: write
  contents: read

jobs:
  build-ingest:
    name: Build ${{ inputs.sport }}-ingest Lambda
    uses: ./.github/workflows/python_lambda_build.yml
    with:
      function_name: ${{ inputs.ingest_function_name }}
      handler_dir: ${{ inputs.ingest_handler_dir }}
      library_path: 'Source/library'
      extra_source_files: ${{ inputs.ingest_extra_source_files }}

  deploy-ingest:
    name: Deploy ${{ inputs.sport }}-ingest Lambda
    needs: build-ingest
    uses: ./.github/workflows/python_lambda_deploy.yml
    secrets: inherit
    with:
      function_name: ${{ inputs.ingest_function_name }}
      artifact_name: ${{ needs.build-ingest.outputs.artifact_name }}

  build-normalize:
    name: Build ${{ inputs.sport }}-normalize Lambda
    uses: ./.github/workflows/python_lambda_build.yml
    with:
      function_name: ${{ inputs.normalize_function_name }}
      handler_dir: ${{ inputs.normalize_handler_dir }}
      library_path: 'Source/library'

  deploy-normalize:
    name: Deploy ${{ inputs.sport }}-normalize Lambda
    needs: build-normalize
    uses: ./.github/workflows/python_lambda_deploy.yml
    secrets: inherit
    with:
      function_name: ${{ inputs.normalize_function_name }}
      artifact_name: ${{ needs.build-normalize.outputs.artifact_name }}

  build-schedule-sync:
    name: Build ${{ inputs.sport }}-schedule-sync Lambda
    if: inputs.schedule_sync_function_name != ''
    uses: ./.github/workflows/python_lambda_build.yml
    with:
      function_name: ${{ inputs.schedule_sync_function_name }}
      handler_dir: ${{ inputs.schedule_sync_handler_dir }}
      library_path: 'Source/library'

  deploy-schedule-sync:
    name: Deploy ${{ inputs.sport }}-schedule-sync Lambda
    needs: build-schedule-sync
    uses: ./.github/workflows/python_lambda_deploy.yml
    secrets: inherit
    with:
      function_name: ${{ inputs.schedule_sync_function_name }}
      artifact_name: ${{ needs.build-schedule-sync.outputs.artifact_name }}
