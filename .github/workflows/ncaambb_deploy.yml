# Top-level NCAA MBB deploy pipeline. Runs on every push to an
# ncaambb*/ncaa_mbb* branch, but pauses for manual approval (via the
# environment's required reviewers -- configure this in Settings >
# Environments, it can't be set from this file) before doing anything.
#
# Onboarding in progress (see project-ncaambb-onboarding memory) -- this
# is a real, working, incrementally-growing pipeline, not a placeholder.
# ai_hosting/deploy_predict_lambda/predict_read_deploy joined in step 6
# (inference); live_scores_deploy joined in step 7.
#
# Exactly one SonarQube Cloud scan for this whole pipeline: every
# component's own test job runs directly against run_python_tests.yml
# (not nested inside a category workflow, since a scan job can't depend on
# jobs nested inside a called reusable workflow -- only a sibling job in
# the SAME file), `scan` needs all of them, and every build/deploy job
# needs `scan`.
#
# aws_lambda_function.ncaambb_predict is a container-image Lambda (same
# reasoning as nba_predict -- CreateFunction validates its image tag
# already exists in ECR, and Terraform can't fabricate a placeholder image
# the way it does a placeholder ZIP), so infra depends on ai_hosting
# completing first, mirrored from nba_deploy.yml's own pattern -- wired in
# from ai_hosting's first appearance here, not patched on later (a real
# gap NBA's own history had).

name: NCAA MBB Deploy

on:
  workflow_dispatch:
  push:
    branches:
      - 'ncaambb*'
      - 'ncaambb/*'
      - 'ncaa_mbb*'
      - 'ncaa_mbb/*'
  workflow_call:

# Shared group across every workflow that can reach tf_install.yml's
# terraform apply, since Terraform/main.tf's S3 backend has no state
# locking configured.
concurrency:
  group: terraform-deploy-pipeline
  cancel-in-progress: false

permissions:
  id-token: write
  contents: read
  actions: read

jobs:
  approval:
    name: Await deployment approval
    if: github.event_name != 'workflow_call'
    runs-on: ubuntu-latest
    environment: development
    steps:
      - name: Approved
        run: echo "Deployment approved -- proceeding."

  # Each test job below repeats the same tolerant check against `approval`
  # directly -- approval is intentionally skipped (not failed) when called
  # via workflow_call, and without this tolerant check a skipped `needs`
  # job would cause everything downstream to be skipped too.
  test-backfill:
    name: Run NCAA MBB backfill tests
    needs: approval
    if: |
      always() &&
      (needs.approval.result == 'success' || needs.approval.result == 'skipped')
    uses: ./.github/workflows/run_python_tests.yml
    with:
      test_path: 'Source/tests/data-backfills/ncaambb/'
      requirements_files: 'Source/data-backfills/ncaambb/requirements-dev.txt'

  test-feature-engineering:
    name: Run NCAA MBB feature engineering tests
    needs: approval
    if: |
      always() &&
      (needs.approval.result == 'success' || needs.approval.result == 'skipped')
    uses: ./.github/workflows/run_python_tests.yml
    with:
      test_path: 'Source/tests/library/ Source/tests/feature-engineering/ncaambb/ --ignore=Source/tests/library/ml'
      requirements_files: 'Source/feature-engineering/ncaambb/requirements.in'

  # Covers every model-training/ncaambb/*.py script, including
  # train_ranking_model.py -- feeds both build-train-model-image and
  # build-ranking-model-image below.
  test-train-models:
    name: Run NCAA MBB training model tests
    needs: approval
    if: |
      always() &&
      (needs.approval.result == 'success' || needs.approval.result == 'skipped')
    uses: ./.github/workflows/run_python_tests.yml
    with:
      test_path: 'Source/tests/library/ Source/tests/model-training/ncaambb/'
      requirements_files: 'Source/model-training/ncaambb/requirements.in'

  test-predict:
    name: Run NCAA MBB predict tests
    needs: approval
    if: |
      always() &&
      (needs.approval.result == 'success' || needs.approval.result == 'skipped')
    uses: ./.github/workflows/run_python_tests.yml
    with:
      test_path: >-
        Source/tests/library/
        Source/tests/aws-lambdas/ncaambb/test_live_features.py
        Source/tests/aws-lambdas/ncaambb/test_event_prediction.py
        Source/tests/aws-lambdas/ncaambb/test_predict_handler.py
      requirements_files: 'Source/aws-lambdas/ncaambb/predict/requirements.in Source/aws-lambdas/ncaambb/predict/requirements-nodeps.in'

  test-predict-read:
    name: Run NCAA MBB predict-read tests
    needs: approval
    if: |
      always() &&
      (needs.approval.result == 'success' || needs.approval.result == 'skipped')
    uses: ./.github/workflows/run_python_tests.yml
    with:
      test_path: 'Source/tests/aws-lambdas/ncaambb/test_predict_read_handler.py Source/tests/library/serving/test_ncaambb_reads.py Source/tests/library/storage/test_prediction_cache.py Source/tests/library/storage/test_model_artifacts.py Source/tests/library/aws/test_lambda_invoker.py'
      requirements_files: 'Source/aws-lambdas/ncaambb/predict-read/requirements.txt'

  test-live-scores:
    name: Run NCAA MBB live-scores tests
    needs: approval
    if: |
      always() &&
      (needs.approval.result == 'success' || needs.approval.result == 'skipped')
    uses: ./.github/workflows/run_python_tests.yml
    with:
      test_path: 'Source/tests/aws-lambdas/ncaambb/test_live_scores.py Source/tests/aws-lambdas/ncaambb/test_live_scores_handler.py'
      requirements_files: 'Source/aws-lambdas/ncaambb/live-scores/requirements.txt'

  test-ingest:
    name: Run NCAA MBB ingest tests
    needs: approval
    if: |
      always() &&
      (needs.approval.result == 'success' || needs.approval.result == 'skipped')
    uses: ./.github/workflows/run_python_tests.yml
    with:
      test_path: 'Source/tests/aws-lambdas/ncaambb/test_ingest.py'
      requirements_files: 'Source/aws-lambdas/ncaambb/ingest/requirements.txt'

  test-normalize:
    name: Run NCAA MBB normalize tests
    needs: approval
    if: |
      always() &&
      (needs.approval.result == 'success' || needs.approval.result == 'skipped')
    uses: ./.github/workflows/run_python_tests.yml
    with:
      test_path: 'Source/tests/aws-lambdas/ncaambb/test_normalize.py'
      requirements_files: 'Source/aws-lambdas/ncaambb/normalize/requirements.txt'

  test-schedule-sync:
    name: Run NCAA MBB schedule-sync tests
    needs: approval
    if: |
      always() &&
      (needs.approval.result == 'success' || needs.approval.result == 'skipped')
    uses: ./.github/workflows/run_python_tests.yml
    with:
      test_path: 'Source/tests/aws-lambdas/ncaambb/test_schedule_sync.py'
      requirements_files: 'Source/aws-lambdas/ncaambb/schedule-sync/requirements.txt'

  scan:
    name: SonarQube Cloud scan
    needs: [
      test-backfill, test-feature-engineering, test-train-models, test-predict,
      test-predict-read, test-live-scores, test-ingest, test-normalize, test-schedule-sync,
    ]
    if: |
      always() &&
      (needs.test-backfill.result == 'success' || needs.test-backfill.result == 'skipped') &&
      (needs.test-feature-engineering.result == 'success' || needs.test-feature-engineering.result == 'skipped') &&
      (needs.test-train-models.result == 'success' || needs.test-train-models.result == 'skipped') &&
      (needs.test-predict.result == 'success' || needs.test-predict.result == 'skipped') &&
      (needs.test-predict-read.result == 'success' || needs.test-predict-read.result == 'skipped') &&
      (needs.test-live-scores.result == 'success' || needs.test-live-scores.result == 'skipped') &&
      (needs.test-ingest.result == 'success' || needs.test-ingest.result == 'skipped') &&
      (needs.test-normalize.result == 'success' || needs.test-normalize.result == 'skipped') &&
      (needs.test-schedule-sync.result == 'success' || needs.test-schedule-sync.result == 'skipped')
    uses: ./.github/workflows/sonar_scan.yml
    secrets: inherit
    with:
      environment: ${{ github.event.inputs.environment || 'development' }}
      parent_workflow: ${{ github.workflow }}

  backfill:
    name: Historical backfill (build)
    needs: scan
    uses: ./.github/workflows/docker_image_deploy.yml
    secrets: inherit
    with:
      sport: 'NCAA MBB'
      dockerfile_path: 'Source/data-backfills/ncaambb/Dockerfile'
      image_name: 'ncaambb-backfill'
      image_version: '1.0.0'

  # Builds feature engineering, win-probability/score/player-prop training
  # (shared image), and national-ranking training (separate image).
  ai_training:
    name: AI training (build)
    needs: scan
    uses: ./.github/workflows/ai_training.yml
    secrets: inherit
    with:
      sport: 'NCAA MBB'
      feature_engineering_dockerfile_path: 'Source/feature-engineering/ncaambb/Dockerfile'
      feature_engineering_image_name: 'ncaambb-feature-engineering'
      feature_engineering_image_version: '1.0.0'
      # Also used by train_score_model.py/train_player_prop_model.py via a container command override.
      train_model_dockerfile_path: 'Source/model-training/ncaambb/Dockerfile'
      train_model_image_name: 'ncaambb-train-win-probability-model'
      train_model_image_version: '1.0.0'
      ranking_model_dockerfile_path: 'Source/model-training/ncaambb/Dockerfile.ranking'
      ranking_model_image_name: 'ncaambb-train-ranking-model'
      ranking_model_image_version: '1.0.0'

  # Ensures infra never runs without ncaambb-predict-latest already in ECR.
  ai_hosting:
    name: AI hosting (build)
    needs: scan
    uses: ./.github/workflows/docker_image_deploy.yml
    secrets: inherit
    with:
      sport: 'NCAA MBB'
      dockerfile_path: 'Source/aws-lambdas/ncaambb/predict/Dockerfile'
      image_name: 'ncaambb-predict'
      image_version: '1.0.0'
      platform: 'linux/arm64'

  # Only ai_hosting is a real dependency here -- see app_deploy.yml's own
  # infra job comment for why backfill/ai_training images aren't a
  # terraform-apply-time dependency at all.
  infra:
    name: Apply shared infrastructure
    needs: [ai_hosting]
    uses: ./.github/workflows/tf_install.yml
    secrets: inherit

  # Points ncaambb-predict at whatever ai_hosting just pushed.
  deploy_predict_lambda:
    name: AI hosting (deploy)
    needs: [infra, ai_hosting]
    uses: ./.github/workflows/docker_lambda_deploy.yml
    secrets: inherit
    with:
      function_name: ${{ needs.infra.outputs.ncaambb_predict_function_name }}
      image_tag: ${{ needs.ai_hosting.outputs.image_tag }}
      default_image_tag: 'ncaambb-predict-latest'

  # ncaambb-predict-read -- the light GET /ncaambb/events + GET
  # /ncaambb/models Lambda split out of ncaambb-predict for cold start
  # (see Terraform/lambda-ncaambb-predict-read.tf).
  predict_read_deploy:
    name: NCAA MBB predict-read (deploy)
    needs: [scan, infra]
    uses: ./.github/workflows/zip_lambda_deploy.yml
    secrets: inherit
    with:
      sport: 'NCAA MBB'
      function_name: ${{ needs.infra.outputs.ncaambb_predict_read_function_name }}
      handler_dir: 'Source/aws-lambdas/ncaambb/predict-read'

  data_pipeline:
    name: Data pipeline
    needs: [scan, infra]
    uses: ./.github/workflows/data_pipeline.yml
    secrets: inherit
    with:
      sport: 'NCAA MBB'
      ingest_function_name: ${{ needs.infra.outputs.ncaambb_ingest_function_name }}
      ingest_handler_dir: 'Source/aws-lambdas/ncaambb/ingest'
      normalize_function_name: ${{ needs.infra.outputs.ncaambb_normalize_function_name }}
      normalize_handler_dir: 'Source/aws-lambdas/ncaambb/normalize'
      schedule_sync_function_name: ${{ needs.infra.outputs.ncaambb_schedule_sync_function_name }}
      schedule_sync_handler_dir: 'Source/aws-lambdas/ncaambb/schedule-sync'

  # ncaambb-live-scores -- GET /ncaambb/live-scores + the EventBridge-
  # triggered cache refresh (see Terraform/lambda-ncaambb-live-scores.tf).
  live_scores_deploy:
    name: NCAA MBB live-scores (deploy)
    needs: [scan, infra]
    uses: ./.github/workflows/zip_lambda_deploy.yml
    secrets: inherit
    with:
      sport: 'NCAA MBB'
      function_name: ${{ needs.infra.outputs.ncaambb_live_scores_function_name }}
      handler_dir: 'Source/aws-lambdas/ncaambb/live-scores'
      extra_source_files: 'Source/aws-lambdas/ncaambb/live-scores/live_scores.py'
