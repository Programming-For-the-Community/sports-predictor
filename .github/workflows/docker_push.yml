# Reusable workflow: downloads a docker_build.yml image-tarball artifact and
# pushes it to the shared ECR repo under both tags it was built with. ECS
# task definitions and Lambda's image_uri reference only the floating
# "-latest" tag, so a new push takes effect on the next `aws ecs run-task`
# or Lambda deploy with no task-definition update or terraform apply
# required.

name: Push Docker Image to ECR

on:
  workflow_call:
    inputs:
      artifact_name:
        description: 'Name of the image-tarball artifact produced by docker_build.yml'
        required: true
        type: string
      versioned_tag:
        description: 'Plain immutable-version tag to push (e.g. "nfl-predict-1.0.0"), no registry prefix -- from docker_build.yml. Never the full $URI:$TAG reference; see this job''s own push step comment for why'
        required: true
        type: string
      latest_tag:
        description: 'Plain floating "-latest" tag to push (e.g. "nfl-predict-latest"), no registry prefix -- from docker_build.yml. Never the full $URI:$TAG reference; see this job''s own push step comment for why'
        required: true
        type: string
    outputs:
      versioned_tag:
        description: 'Plain immutable-version tag of the pushed image, no registry prefix (passthrough of the input)'
        value: ${{ inputs.versioned_tag }}
      latest_tag:
        description: 'Plain floating "-latest" tag of the pushed image, no registry prefix (passthrough of the input)'
        value: ${{ inputs.latest_tag }}

permissions:
  id-token: write
  contents: read

jobs:
  push:
    runs-on: ubuntu-latest
    steps:
      - name: Configure AWS credentials from OIDC
        uses: aws-actions/configure-aws-credentials@e1253824e5c10ff9df46874f81ed3ec929e19cfd # v6.3.0
        with:
          role-to-assume: ${{ secrets.AWS_DEPLOY_SVC_ACCT_ARN }}
          aws-region: ${{ vars.AWS_RESOURCE_REGION }}
          role-session-name: GitHubActions-${{ github.run_id }}

      - name: Verify AWS identity
        run: aws sts get-caller-identity

      - name: Download image artifact
        uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: ${{ inputs.artifact_name }}

      - name: Load and push image to Amazon ECR
        # Reconstructs the full $URI:$TAG reference locally, in this job,
        # from its own direct secrets.ECR_URI access -- inputs.versioned_tag/
        # latest_tag are deliberately plain tags with no registry prefix
        # (see this workflow's own input comments), never the full
        # reference, because docker_build.yml's OWN attempt to emit
        # "$URI:$TAG" as a job output got silently dropped by GitHub
        # Actions' secret-leak protection ("Skip output '...' since it may
        # contain secret"), leaving this step's own VERSIONED_TAG/
        # LATEST_TAG empty and `docker push ""` failing with "invalid
        # reference format" on every push -- confirmed live, this exact
        # failure across every image this repo builds.
        env:
          URI: ${{ secrets.ECR_URI }}
          VERSIONED_TAG: ${{ inputs.versioned_tag }}
          LATEST_TAG: ${{ inputs.latest_tag }}
          ARTIFACT_NAME: ${{ inputs.artifact_name }}
        run: |
          ECR_REGISTRY=${URI%/*}

          docker load -i "${ARTIFACT_NAME}.tar"

          aws ecr get-login-password --region ${{ vars.AWS_RESOURCE_REGION }} \
            | docker login --username AWS --password-stdin "$ECR_REGISTRY"

          docker push "$URI:$VERSIONED_TAG"
          docker push "$URI:$LATEST_TAG"

          echo "Pushed: $URI:$VERSIONED_TAG and $URI:$LATEST_TAG"

      # The repository scans every image on push (ECR basic scanning, set on
      # the shared repository outside this repo). Reports this image's
      # findings in the job summary; never fails the deploy.
      - name: Report ECR scan findings
        env:
          URI: ${{ secrets.ECR_URI }}
          VERSIONED_TAG: ${{ inputs.versioned_tag }}
          AWS_REGION: ${{ vars.AWS_RESOURCE_REGION }}
        run: |
          REPOSITORY=${URI#*/}

          if ! aws ecr wait image-scan-complete --repository-name "$REPOSITORY" \
              --image-id imageTag="$VERSIONED_TAG" --region "$AWS_REGION"; then
            echo "::warning::ECR scan for $VERSIONED_TAG did not complete -- findings not reported"
            exit 0
          fi

          COUNTS=$(aws ecr describe-image-scan-findings --repository-name "$REPOSITORY" \
            --image-id imageTag="$VERSIONED_TAG" --region "$AWS_REGION" \
            --query 'imageScanFindings.findingSeverityCounts' --output json)

          {
            echo "### ECR scan findings -- $VERSIONED_TAG"
            echo '```json'
            echo "${COUNTS:-null}"
            echo '```'
          } >> "$GITHUB_STEP_SUMMARY"

          SEVERE=$(echo "${COUNTS:-null}" | jq '(.CRITICAL // 0) + (.HIGH // 0)')
          if [ "$SEVERE" -gt 0 ]; then
            echo "::warning::$VERSIONED_TAG has $SEVERE critical/high vulnerability finding(s) -- see the job summary"
          fi
