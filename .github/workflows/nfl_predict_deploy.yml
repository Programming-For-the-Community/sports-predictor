# Points the nfl-predict Lambda at an already-pushed image. Runs standalone
# (workflow_dispatch, defaulting to the current nfl-predict-latest tag) or
# called from nfl_deploy.yml with a specific versioned tag.

name: NFL Predict Deploy

on:
  workflow_dispatch:
    inputs:
      function_name:
        description: 'NFL predict Lambda function name'
        required: false
        type: string
        default: 'sports-predictor-nfl-predict'
      image_uri:
        description: 'Image URI to deploy (leave blank to use the current nfl-predict-latest tag)'
        required: false
        type: string
  workflow_call:
    inputs:
      function_name:
        description: 'NFL predict Lambda function name (from Terraform output nfl_predict_function_name)'
        required: false
        type: string
        default: 'sports-predictor-nfl-predict'
      image_uri:
        description: 'Image URI to deploy (leave blank to use the current nfl-predict-latest tag)'
        required: false
        type: string

permissions:
  id-token: write
  contents: read

jobs:
  deploy:
    name: Point nfl-predict Lambda at the image
    runs-on: ubuntu-latest
    steps:
      - name: Configure AWS credentials (OIDC)
        uses: aws-actions/configure-aws-credentials@v4
        with:
          role-to-assume: ${{ secrets.AWS_DEPLOY_SVC_ACCT_ARN }}
          aws-region: ${{ vars.AWS_RESOURCE_REGION }}
          role-session-name: GitHubActions-${{ github.run_id }}

      - name: Update function code
        env:
          FUNCTION_NAME: ${{ inputs.function_name || 'sports-predictor-nfl-predict' }}
          IMAGE_URI: ${{ inputs.image_uri }}
          ECR_URI: ${{ secrets.ECR_URI }}
        run: |
          if [ -z "$IMAGE_URI" ]; then
            IMAGE_URI="$ECR_URI:nfl-predict-latest"
          fi

          aws lambda update-function-code \
            --function-name "$FUNCTION_NAME" \
            --image-uri "$IMAGE_URI"

          aws lambda wait function-updated \
            --function-name "$FUNCTION_NAME"

          echo "Deployed $FUNCTION_NAME -> $IMAGE_URI"
