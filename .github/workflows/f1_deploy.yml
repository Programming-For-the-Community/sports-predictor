# Top-level F1 deploy pipeline. Runs on every push to an f1* branch, but
# pauses for manual approval (via the environment's required reviewers --
# configure this in Settings > Environments, it can't be set from this
# file) before doing anything.
#
# Exactly one SonarQube Cloud scan for this whole pipeline: every
# component's own test job runs directly against run_python_tests.yml
# (not nested inside a category workflow, since a scan job can't depend on
# jobs nested inside a called reusable workflow -- only a sibling job in
# the SAME file), `scan` needs all of them, and every build/deploy job
# needs `scan`.

name: F1 Deploy

on:
  workflow_dispatch:
  push:
    branches:
      - 'f1*'
      - 'f1/*'
  workflow_call:

# Shared group across every workflow that can reach tf_install.yml's
# terraform apply, since Terraform/main.tf's S3 backend has no state
# locking configured.
concurrency:
  group: terraform-deploy-pipeline
  cancel-in-progress: false

permissions:
  id-token: write
  contents: read
  actions: read

jobs:
  approval:
    name: Await deployment approval
    if: github.event_name != 'workflow_call'
    runs-on: ubuntu-latest
    environment: development
    steps:
      - name: Approved
        run: echo "Deployment approved -- proceeding."

  # Each test job below repeats the same tolerant check against `approval`
  # directly -- approval is intentionally skipped (not failed) when called
  # via workflow_call, and without this tolerant check a skipped `needs`
  # job would cause everything downstream to be skipped too.
  test-backfill:
    name: Run F1 backfill tests
    needs: approval
    if: |
      always() &&
      (needs.approval.result == 'success' || needs.approval.result == 'skipped')
    uses: ./.github/workflows/run_python_tests.yml
    with:
      test_path: 'Source/tests/data-backfills/f1/'
      requirements_files: 'Source/data-backfills/f1/requirements-dev.txt'

  test-feature-engineering:
    name: Run F1 feature engineering tests
    needs: approval
    if: |
      always() &&
      (needs.approval.result == 'success' || needs.approval.result == 'skipped')
    uses: ./.github/workflows/run_python_tests.yml
    with:
      test_path: 'Source/tests/library/ Source/tests/feature-engineering/f1/ --ignore=Source/tests/library/ml'
      requirements_files: 'Source/feature-engineering/f1/requirements.txt'

  test-train-winprob-model:
    name: Run F1 train win-probability model tests
    needs: approval
    if: |
      always() &&
      (needs.approval.result == 'success' || needs.approval.result == 'skipped')
    uses: ./.github/workflows/run_python_tests.yml
    with:
      test_path: 'Source/tests/library/ Source/tests/model-training/f1/'
      requirements_files: 'Source/model-training/f1/requirements.txt'

  test-predict:
    name: Run F1 predict tests
    needs: approval
    if: |
      always() &&
      (needs.approval.result == 'success' || needs.approval.result == 'skipped')
    uses: ./.github/workflows/run_python_tests.yml
    with:
      test_path: >-
        Source/tests/library/
        Source/tests/aws-lambdas/f1/test_live_features.py
        Source/tests/aws-lambdas/f1/test_event_prediction.py
        Source/tests/aws-lambdas/f1/test_predict_handler.py
        Source/tests/aws-lambdas/f1/test_season_simulation.py
        Source/tests/aws-lambdas/f1/test_season_projection.py
      requirements_files: 'Source/aws-lambdas/f1/predict/requirements.txt Source/aws-lambdas/f1/predict/requirements-nodeps.txt'

  test-predict-read:
    name: Run F1 predict-read tests
    needs: approval
    if: |
      always() &&
      (needs.approval.result == 'success' || needs.approval.result == 'skipped')
    uses: ./.github/workflows/run_python_tests.yml
    with:
      test_path: 'Source/tests/aws-lambdas/f1/test_predict_read_handler.py Source/tests/library/serving/test_f1_reads.py Source/tests/library/serving/test_common.py Source/tests/library/storage/test_prediction_cache.py Source/tests/library/storage/test_model_artifacts.py Source/tests/library/aws/test_lambda_invoker.py'
      requirements_files: 'Source/aws-lambdas/f1/predict-read/requirements.txt'

  test-live-scores:
    name: Run F1 live-scores tests
    needs: approval
    if: |
      always() &&
      (needs.approval.result == 'success' || needs.approval.result == 'skipped')
    uses: ./.github/workflows/run_python_tests.yml
    with:
      test_path: >-
        Source/tests/aws-lambdas/f1/test_live_scores.py
        Source/tests/aws-lambdas/f1/test_live_scores_handler.py
      requirements_files: 'Source/aws-lambdas/f1/live-scores/requirements.txt'

  test-ingest:
    name: Run F1 ingest tests
    needs: approval
    if: |
      always() &&
      (needs.approval.result == 'success' || needs.approval.result == 'skipped')
    uses: ./.github/workflows/run_python_tests.yml
    with:
      test_path: 'Source/tests/aws-lambdas/f1/test_ingest.py'
      requirements_files: 'Source/aws-lambdas/f1/ingest/requirements.txt'

  test-normalize:
    name: Run F1 normalize tests
    needs: approval
    if: |
      always() &&
      (needs.approval.result == 'success' || needs.approval.result == 'skipped')
    uses: ./.github/workflows/run_python_tests.yml
    with:
      test_path: 'Source/tests/aws-lambdas/f1/test_normalize.py'
      requirements_files: 'Source/aws-lambdas/f1/normalize/requirements.txt'

  # No f1-schedule-sync test -- see data_pipeline job's own comment below.
  scan:
    name: SonarQube Cloud scan
    needs: [
      test-backfill, test-feature-engineering, test-train-winprob-model, test-predict,
      test-predict-read, test-live-scores, test-ingest, test-normalize,
    ]
    if: |
      always() &&
      (needs.test-backfill.result == 'success' || needs.test-backfill.result == 'skipped') &&
      (needs.test-feature-engineering.result == 'success' || needs.test-feature-engineering.result == 'skipped') &&
      (needs.test-train-winprob-model.result == 'success' || needs.test-train-winprob-model.result == 'skipped') &&
      (needs.test-predict.result == 'success' || needs.test-predict.result == 'skipped') &&
      (needs.test-predict-read.result == 'success' || needs.test-predict-read.result == 'skipped') &&
      (needs.test-live-scores.result == 'success' || needs.test-live-scores.result == 'skipped') &&
      (needs.test-ingest.result == 'success' || needs.test-ingest.result == 'skipped') &&
      (needs.test-normalize.result == 'success' || needs.test-normalize.result == 'skipped')
    uses: ./.github/workflows/sonar_scan.yml
    secrets: inherit
    with:
      environment: ${{ github.event.inputs.environment || 'development' }}
      parent_workflow: ${{ github.workflow }}

  backfill:
    name: Historical backfill (build)
    needs: scan
    uses: ./.github/workflows/docker_image_deploy.yml
    secrets: inherit
    with:
      sport: 'F1'
      dockerfile_path: 'Source/data-backfills/f1/Dockerfile'
      image_name: 'f1-backfill'
      image_version: '1.0.0'

  # Builds Feature Engineering and Train Win-Probability Model (the latter
  # also serves train_podium_model.py/train_dnf_model.py/
  # train_finish_position_model.py/train_constructor_winprob_model.py/
  # train_qualifying_model.py/train_sprint_grid_model.py/
  # train_sprint_winprob_model.py/train_sprint_podium_model.py --
  # Terraform/ecs-task-f1-train-{podium,dnf,finish-position,constructor-
  # winprob,qualifying,sprint-grid,sprint-winprob,sprint-podium}-model.tf
  # all point at this same image tag and override `command` to run their
  # own script instead, same shared-image/command-override pattern PGA's
  # own train-top10-model image uses for top5/score/cutline/round/match-
  # winprob/cup-winprob).
  ai_training:
    name: AI training (build)
    needs: scan
    uses: ./.github/workflows/ai_training.yml
    secrets: inherit
    with:
      sport: 'F1'
      feature_engineering_dockerfile_path: 'Source/feature-engineering/f1/Dockerfile'
      feature_engineering_image_name: 'f1-feature-engineering'
      feature_engineering_image_version: '1.0.0'
      train_model_dockerfile_path: 'Source/model-training/f1/Dockerfile'
      train_model_image_name: 'f1-train-winprob-model'
      train_model_image_version: '1.0.0'

  # Pushes f1-predict-latest. infra never runs without it already in
  # ECR -- aws_lambda_function.f1_predict is a container-image Lambda,
  # and CreateFunction validates its image tag already exists in ECR
  # before Terraform can create it, same reasoning as ai_training's own
  # comment above for the training ECS task images.
  ai_hosting:
    name: AI hosting (build)
    needs: scan
    uses: ./.github/workflows/docker_image_deploy.yml
    secrets: inherit
    with:
      sport: 'F1'
      dockerfile_path: 'Source/aws-lambdas/f1/predict/Dockerfile'
      image_name: 'f1-predict'
      image_version: '1.0.0'
      platform: 'linux/arm64'

  infra:
    name: Apply shared infrastructure
    needs: [backfill, ai_training, ai_hosting]
    if: |
      always() &&
      (needs.backfill.result == 'success' || needs.backfill.result == 'skipped') &&
      (needs.ai_training.result == 'success' || needs.ai_training.result == 'skipped') &&
      (needs.ai_hosting.result == 'success' || needs.ai_hosting.result == 'skipped')
    uses: ./.github/workflows/tf_install.yml
    secrets: inherit

  deploy_predict_lambda:
    name: AI hosting (deploy)
    needs: [infra, ai_hosting]
    uses: ./.github/workflows/docker_lambda_deploy.yml
    secrets: inherit
    with:
      function_name: ${{ needs.infra.outputs.f1_predict_function_name }}
      image_uri: ${{ needs.ai_hosting.outputs.image_uri }}
      default_image_tag: 'f1-predict-latest'

  predict_read_deploy:
    name: F1 predict-read (deploy)
    needs: [scan, infra]
    uses: ./.github/workflows/zip_lambda_deploy.yml
    secrets: inherit
    with:
      sport: 'F1'
      function_name: ${{ needs.infra.outputs.f1_predict_read_function_name }}
      handler_dir: 'Source/aws-lambdas/f1/predict-read'

  data_pipeline:
    name: Data pipeline
    needs: [scan, infra]
    uses: ./.github/workflows/data_pipeline.yml
    secrets: inherit
    with:
      sport: 'F1'
      ingest_function_name: ${{ needs.infra.outputs.f1_ingest_function_name }}
      ingest_handler_dir: 'Source/aws-lambdas/f1/ingest'
      normalize_function_name: ${{ needs.infra.outputs.f1_normalize_function_name }}
      normalize_handler_dir: 'Source/aws-lambdas/f1/normalize'
      # Unlike PGA, there is no f1-schedule-sync -- Jolpica's own season
      # schedule call (JolpicaClient.get_races) already resolves the whole
      # season in one shot from within f1-ingest itself (see
      # Source/aws-lambdas/f1/ingest/handler.py's own docstring), so no
      # separate discovery Lambda is needed. schedule_sync_function_name
      # is left blank, which skips that chain entirely.

  live_scores_deploy:
    name: F1 live-scores (deploy)
    needs: [scan, infra]
    uses: ./.github/workflows/zip_lambda_deploy.yml
    secrets: inherit
    with:
      sport: 'F1'
      function_name: ${{ needs.infra.outputs.f1_live_scores_function_name }}
      handler_dir: 'Source/aws-lambdas/f1/live-scores'
      extra_source_files: 'Source/aws-lambdas/f1/live-scores/live_scores.py'
