# Top-level F1 deploy pipeline. Runs on every push to an f1* branch, but
# pauses for manual approval (via the environment's required reviewers --
# configure this in Settings > Environments, it can't be set from this
# file) before doing anything.
#
# ai_hosting/deploy_predict_lambda/predict_read_deploy added once F1's own
# serving layer (predict/predict-read Lambda pair) landed, mirroring pga_
# deploy.yml's exact shape. live_scores_deploy added once F1's own
# ESPN-sourced live-scores Lambda landed (see aws-lambdas/f1/live-scores/
# live_scores.py's own docstring for why it's ESPN-, not Jolpica-,
# sourced).
#
# Both this job's `approval` step AND tf_install.yml's own terraform job
# gate on the `development`/`production` environment, so a run through
# this pipeline prompts for approval twice.

name: F1 Deploy

on:
  workflow_dispatch:
  push:
    branches:
      - 'f1*'
      - 'f1/*'
  workflow_call:

# Shared group across every workflow that can reach tf_install.yml's
# terraform apply, since Terraform/main.tf's S3 backend has no state
# locking configured.
concurrency:
  group: terraform-deploy-pipeline
  cancel-in-progress: false

permissions:
  id-token: write
  contents: read

jobs:
  approval:
    name: Await deployment approval
    if: github.event_name != 'workflow_call'
    runs-on: ubuntu-latest
    environment: development
    steps:
      - name: Approved
        run: echo "Deployment approved -- proceeding."

  # approval is intentionally skipped (not failed) when called via
  # workflow_call -- without this, a skipped `needs` job would cause
  # everything downstream to be skipped too. Each build job below repeats
  # this same tolerant check against `approval` directly.
  backfill:
    name: Historical backfill (build)
    needs: approval
    if: |
      always() &&
      (needs.approval.result == 'success' || needs.approval.result == 'skipped')
    uses: ./.github/workflows/f1_backfill.yml
    secrets: inherit

  # Pushes f1-feature-engineering-latest and f1-train-winprob-model-latest.
  # infra never runs without both already in ECR -- same reasoning as
  # PGA's own ai_training job (its images are what the training ECS task
  # definitions' `image` field points at; RunTask fails at runtime, not
  # at `terraform apply`, if the tag doesn't exist yet).
  ai_training:
    name: AI training (build)
    needs: approval
    if: |
      always() &&
      (needs.approval.result == 'success' || needs.approval.result == 'skipped')
    uses: ./.github/workflows/f1_ai_training.yml
    secrets: inherit

  # Pushes f1-predict-latest. infra never runs without it already in
  # ECR -- aws_lambda_function.f1_predict is a container-image Lambda,
  # and CreateFunction validates its image tag already exists in ECR
  # before Terraform can create it, same reasoning as ai_training's own
  # comment above for the training ECS task images.
  ai_hosting:
    name: AI hosting (build)
    needs: approval
    if: |
      always() &&
      (needs.approval.result == 'success' || needs.approval.result == 'skipped')
    uses: ./.github/workflows/f1_ai_hosting.yml
    secrets: inherit

  infra:
    name: Apply shared infrastructure
    needs: [backfill, ai_training, ai_hosting]
    if: |
      always() &&
      (needs.backfill.result == 'success' || needs.backfill.result == 'skipped') &&
      (needs.ai_training.result == 'success' || needs.ai_training.result == 'skipped') &&
      (needs.ai_hosting.result == 'success' || needs.ai_hosting.result == 'skipped')
    uses: ./.github/workflows/tf_install.yml
    secrets: inherit

  deploy_predict_lambda:
    name: AI hosting (deploy)
    needs: [infra, ai_hosting]
    uses: ./.github/workflows/f1_predict_deploy.yml
    secrets: inherit
    with:
      function_name: ${{ needs.infra.outputs.f1_predict_function_name }}
      image_uri: ${{ needs.ai_hosting.outputs.predict_image_uri }}

  predict_read_deploy:
    name: F1 predict-read (test + deploy)
    needs: [approval, infra]
    if: |
      always() &&
      (needs.approval.result == 'success' || needs.approval.result == 'skipped')
    uses: ./.github/workflows/f1_predict_read_deploy.yml
    secrets: inherit
    with:
      function_name: ${{ needs.infra.outputs.f1_predict_read_function_name }}

  data_pipeline:
    name: Data pipeline
    needs: infra
    uses: ./.github/workflows/f1_data_pipeline.yml
    secrets: inherit
    with:
      ingest_function_name: ${{ needs.infra.outputs.f1_ingest_function_name }}
      normalize_function_name: ${{ needs.infra.outputs.f1_normalize_function_name }}

  live_scores_deploy:
    name: F1 live-scores (test + deploy)
    needs: [approval, infra]
    if: |
      always() &&
      (needs.approval.result == 'success' || needs.approval.result == 'skipped')
    uses: ./.github/workflows/f1_live_scores_deploy.yml
    secrets: inherit
    with:
      function_name: ${{ needs.infra.outputs.f1_live_scores_function_name }}
