# Builds, packages, and deploys the NFL AI hosting/inference code. Runs
# standalone (workflow_dispatch) or called from nfl_deploy.yml
# (workflow_call) -- either way the work is identical: build and push
# image(s).
#
# This stage may build more than one image if inference ends up split
# across multiple Lambdas. Once their Dockerfiles exist, give each image
# its OWN version constant below (see nfl_ai_training.yml, which builds
# two independent images this same way) and add one job per image,
# each shaped like:
#
#   build-<component>-image:
#     needs: set-versions
#     uses: ./.github/workflows/docker_build_push.yml
#     secrets: inherit
#     with:
#       dockerfile_path: 'Source/<path>/Dockerfile'
#       docker_context: 'Source/<path>'
#       image_name: 'nfl-<component>'
#       image_version: ${{ needs.set-versions.outputs.<component>_version }}
#
# Each component's version is bumped independently -- unrelated images
# shouldn't need a version bump (and a new tag/deploy) just because a
# sibling image changed.

name: NFL AI Hosting

on:
  workflow_dispatch:
  workflow_call:

env:
  IMAGE_VERSION: '0.1.0'

permissions:
  id-token: write
  contents: read

jobs:
  set-version:
    name: Resolve image version
    runs-on: ubuntu-latest
    outputs:
      version: ${{ steps.out.outputs.version }}
    steps:
      - id: out
        run: echo "version=${{ env.IMAGE_VERSION }}" >> "$GITHUB_OUTPUT"

  # TODO once the NFL inference source code and Dockerfile(s) exist:
  # replace this (and set-version above) with one set-versions job
  # outputting a version per image, and one build-<component>-image job
  # per image, per the comment block above.
  placeholder:
    name: Build, package, and deploy (placeholder)
    needs: set-version
    runs-on: ubuntu-latest
    steps:
      - name: Placeholder
        run: echo "Would build and push NFL AI hosting image(s) at version ${{ needs.set-version.outputs.version }} here."
