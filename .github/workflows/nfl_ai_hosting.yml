# Runs tests, scans with SonarQube Cloud, then builds and pushes the NFL AI
# hosting/inference container image (Source/aws-lambdas/nfl/predict/Dockerfile)
# -- each stage only runs if the one before it passed. Deploying the Lambda
# to point at the pushed image is nfl_predict_deploy.yml's job.

name: NFL AI Hosting

on:
  workflow_dispatch:
  workflow_call:
    outputs:
      predict_image_uri:
        description: 'Versioned tag of the pushed nfl-predict image, for nfl_predict_deploy.yml to point the Lambda at'
        value: ${{ jobs.push-predict-image.outputs.versioned_tag }}

env:
  PREDICT_IMAGE_VERSION: '1.0.0'

permissions:
  id-token: write
  contents: read

jobs:
  test-predict:
    name: Run nfl-predict tests
    uses: ./.github/workflows/run_python_tests.yml
    with:
      test_path: >-
        Source/tests/library/
        Source/tests/aws-lambdas/nfl/test_predict_event_outcome.py
        Source/tests/aws-lambdas/nfl/test_predict_player_props.py
        Source/tests/aws-lambdas/nfl/test_predict_routing.py
        Source/tests/aws-lambdas/nfl/test_predict_compute_and_cache.py
        Source/tests/aws-lambdas/nfl/test_predict_leaders.py
        Source/tests/aws-lambdas/nfl/test_predict_receiving_props.py
        Source/tests/aws-lambdas/nfl/test_predict_rushing_props.py
        Source/tests/aws-lambdas/nfl/test_predict_season_simulation.py
        Source/tests/aws-lambdas/nfl/test_live_features_event.py
        Source/tests/aws-lambdas/nfl/test_live_features_player.py
        Source/tests/aws-lambdas/nfl/test_live_features_leader_candidates.py
        Source/tests/aws-lambdas/nfl/test_live_features_depth_chart.py
        Source/tests/aws-lambdas/nfl/test_live_features_roster.py
        Source/tests/aws-lambdas/nfl/test_model_loader.py
      # Both requirements files are installed so xgboost is importable in this test job.
      requirements_files: 'Source/aws-lambdas/nfl/predict/requirements.txt Source/aws-lambdas/nfl/predict/requirements-nodeps.txt'

  scan:
    name: SonarQube Cloud scan
    needs: test-predict
    uses: ./.github/workflows/sonar_scan.yml
    secrets: inherit

  set-versions:
    name: Resolve image versions
    runs-on: ubuntu-latest
    outputs:
      predict_version: ${{ steps.out.outputs.predict_version }}
    steps:
      - id: out
        run: echo "predict_version=${{ env.PREDICT_IMAGE_VERSION }}" >> "$GITHUB_OUTPUT"

  build-predict-image:
    name: Build predict image
    needs: [set-versions, scan]
    uses: ./.github/workflows/docker_build.yml
    secrets: inherit
    with:
      dockerfile_path: 'Source/aws-lambdas/nfl/predict/Dockerfile'
      docker_context: 'Source'
      image_name: 'nfl-predict'
      image_version: ${{ needs.set-versions.outputs.predict_version }}
      # Matches the nfl-predict Lambda's arm64 architecture.
      platform: 'linux/arm64'

  push-predict-image:
    name: Push predict image
    needs: build-predict-image
    uses: ./.github/workflows/docker_push.yml
    secrets: inherit
    with:
      artifact_name: ${{ needs.build-predict-image.outputs.artifact_name }}
      versioned_tag: ${{ needs.build-predict-image.outputs.versioned_tag }}
      latest_tag: ${{ needs.build-predict-image.outputs.latest_tag }}
