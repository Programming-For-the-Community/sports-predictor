# Reusable workflow: builds a Docker image (build only, no push -- see
# docker_push.yml for that) and uploads it as a workflow artifact for a
# downstream job to push to ECR. Split out so a Scan stage can sit strictly
# between Test and Build, and Build strictly before Push.
#
# --provenance=false --sbom=false: buildx attaches these as attestations by
# default on a build, which wraps the image in an OCI image index (manifest
# list) even for one platform. ECR/ECS tolerate that, but Lambda's
# UpdateFunctionCode rejects it outright ("image manifest, config or layer
# media type ... is not supported") -- these two flags keep the image a
# plain single-manifest image.
#
# No AWS credentials needed here at all -- tagging with the final ECR URI
# is just string formatting (secrets.ECR_URI is a plain secret string, not
# paired with AWS auth), and nothing is pushed yet.

name: Build Docker Image

on:
  workflow_call:
    inputs:
      dockerfile_path:
        description: 'Path to the Dockerfile'
        required: true
        type: string
      docker_context:
        description: 'Docker build context path'
        required: true
        type: string
      image_name:
        description: 'Image name / component identifier (e.g. nfl-backfill)'
        required: true
        type: string
      image_version:
        description: 'Semantic version to tag the image with'
        required: true
        type: string
      platform:
        description: 'Target platform passed to docker buildx build -- linux/arm64 for the arm64 (Graviton) inference Lambda, linux/amd64 (the default) for every other image, which still runs natively on this workflow''s x86_64 runner'
        required: false
        type: string
        default: 'linux/amd64'
    outputs:
      artifact_name:
        description: 'Name of the uploaded image-tarball artifact, for docker_push.yml to download'
        value: ${{ jobs.build.outputs.artifact_name }}
      versioned_tag:
        description: 'Plain immutable-version tag the image was tagged with (e.g. "nfl-predict-1.0.0"), no registry prefix -- see this job''s own "Build and tag image" step comment for why'
        value: ${{ jobs.build.outputs.versioned_tag }}
      latest_tag:
        description: 'Plain floating "-latest" tag the image was tagged with (e.g. "nfl-predict-latest"), no registry prefix -- see this job''s own "Build and tag image" step comment for why'
        value: ${{ jobs.build.outputs.latest_tag }}

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    outputs:
      artifact_name: ${{ steps.build-image.outputs.artifact_name }}
      versioned_tag: ${{ steps.build-image.outputs.versioned_tag }}
      latest_tag: ${{ steps.build-image.outputs.latest_tag }}

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      # Regenerates this component's own hash-locked requirements.txt
      # fresh every build from its committed requirements.in, so
      # --require-hashes in the Dockerfile's pip install never needs a
      # locally-generated file committed to the repo. requirements.in
      # itself is unpinned/loosely-pinned direct dependencies only;
      # pip-compile resolves and hashes the full transitive closure,
      # across every published platform, which is why this step needs no
      # platform-specific handling.
      #
      # requirements-nodeps.in (only present for predict Lambdas that
      # install xgboost with --no-deps to dodge its unconditional
      # nvidia-nccl-cu12 GPU dependency) is handled separately: pip-compile
      # can't be used there since it would resolve and hash that same
      # transitive closure pip-compile is normally relied on for, which
      # --no-deps at install time would then still pull in (every line in
      # a requirements file is installed regardless of --no-deps, which
      # only suppresses fetching EACH line's own further dependencies) --
      # so each package is downloaded individually for the build's own
      # target platform/arch and hashed directly instead.
      - name: Lock Python dependencies for this build
        env:
          PLATFORM: ${{ inputs.platform }}
        run: |
          set -e
          pip install --no-cache-dir --quiet pip-tools
          DOCKERFILE_DIR="$(dirname "${{ inputs.dockerfile_path }}")"

          if [ -f "$DOCKERFILE_DIR/requirements.in" ]; then
            pip-compile --quiet --generate-hashes --allow-unsafe \
              --output-file="$DOCKERFILE_DIR/requirements.txt" \
              "$DOCKERFILE_DIR/requirements.in"
          fi

          if [ -f "$DOCKERFILE_DIR/requirements-nodeps.in" ]; then
            case "$PLATFORM" in
              linux/arm64) WHEEL_ARCH=aarch64 ;;
              *)           WHEEL_ARCH=x86_64 ;;
            esac

            rm -rf /tmp/nodeps_wheels && mkdir -p /tmp/nodeps_wheels
            pip download --no-cache-dir --no-deps --only-binary :all: \
              --platform "manylinux_2_28_${WHEEL_ARCH}" --python-version 312 \
              --implementation cp --abi cp312 \
              -d /tmp/nodeps_wheels -r "$DOCKERFILE_DIR/requirements-nodeps.in"

            : > "$DOCKERFILE_DIR/requirements-nodeps.txt"
            while IFS= read -r pin; do
              pin="${pin%$'\r'}"
              case "$pin" in ''|'#'*) continue ;; esac
              pkg="$(echo "$pin" | cut -d= -f1 | tr '-' '_')"
              wheel="$(ls "/tmp/nodeps_wheels/${pkg}"*.whl)"
              hash="$(pip hash "$wheel" | grep -oP '(?<=--hash=)\S+')"
              {
                echo "$pin \\"
                echo "    --hash=$hash"
              } >> "$DOCKERFILE_DIR/requirements-nodeps.txt"
            done < "$DOCKERFILE_DIR/requirements-nodeps.in"
          fi

      # QEMU lets buildx cross-build linux/arm64 on this runner's native
      # x86_64.
      - name: Set up QEMU
        uses: docker/setup-qemu-action@v3

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Build and tag image
        id: build-image
        env:
          URI: ${{ secrets.ECR_URI }}
          VERSIONED_TAG: ${{ inputs.image_name }}-${{ inputs.image_version }}
          LATEST_TAG: ${{ inputs.image_name }}-latest
          PLATFORM: ${{ inputs.platform }}
          ARTIFACT_NAME: ${{ inputs.image_name }}-image
        run: |
          docker buildx build \
            --platform "$PLATFORM" \
            --provenance=false \
            --sbom=false \
            -t "$URI:$VERSIONED_TAG" \
            -t "$URI:$LATEST_TAG" \
            -f "${{ inputs.dockerfile_path }}" \
            --load \
            "${{ inputs.docker_context }}"

          docker save -o "${ARTIFACT_NAME}.tar" "$URI:$VERSIONED_TAG" "$URI:$LATEST_TAG"

          echo "Built: $URI:$VERSIONED_TAG and $URI:$LATEST_TAG"
          echo "artifact_name=$ARTIFACT_NAME" >> "$GITHUB_OUTPUT"
          # Plain tag only (e.g. "nba-backfill-1.0.0"), never $URI:$TAG --
          # GitHub Actions silently SKIPS setting a step/job output whose
          # value contains a secret substring ("Skip output '...' since it
          # may contain secret"), which is exactly what happened here:
          # this used to emit "$URI:$VERSIONED_TAG", so downstream
          # docker_push.yml always received an EMPTY versioned_tag/
          # latest_tag input, and `docker push ""` failed with "invalid
          # reference format" on every single push job. Confirmed live --
          # every caller of this output (docker_push.yml, and eventually
          # docker_lambda_deploy.yml's own image_tag) now reconstructs the
          # full $URI:$TAG reference itself, from its own direct
          # secrets.ECR_URI access, so the secret never has to cross an
          # output boundary.
          echo "versioned_tag=$VERSIONED_TAG" >> "$GITHUB_OUTPUT"
          echo "latest_tag=$LATEST_TAG" >> "$GITHUB_OUTPUT"

      - name: Upload image artifact
        uses: actions/upload-artifact@v4
        with:
          name: ${{ steps.build-image.outputs.artifact_name }}
          path: ${{ steps.build-image.outputs.artifact_name }}.tar
          retention-days: 1
