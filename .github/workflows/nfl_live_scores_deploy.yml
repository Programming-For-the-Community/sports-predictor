# Tests, scans with SonarQube Cloud, builds, and deploys the NFL live-scores
# Lambda -- GET /nfl/live-scores plus the EventBridge-triggered cache
# refresh. Zip-packaged. Each stage only runs if the one before it passed.

name: NFL Live Scores Deploy

on:
  workflow_dispatch:
  workflow_call:
    inputs:
      function_name:
        description: 'NFL live-scores Lambda function name (from Terraform output nfl_live_scores_function_name)'
        required: false
        type: string
        default: 'sports-predictor-nfl-live-scores'

permissions:
  id-token: write
  contents: read

jobs:
  test:
    name: Run nfl-live-scores tests
    uses: ./.github/workflows/run_python_tests.yml
    with:
      test_path: 'Source/tests/aws-lambdas/nfl/test_live_scores.py Source/tests/aws-lambdas/nfl/test_live_scores_handler.py'
      requirements_files: 'Source/aws-lambdas/nfl/live-scores/requirements.txt'

  scan:
    name: SonarQube Cloud scan
    needs: test
    uses: ./.github/workflows/sonar_scan.yml
    secrets: inherit

  build:
    name: Build nfl-live-scores Lambda
    needs: scan
    uses: ./.github/workflows/python_lambda_build.yml
    with:
      function_name: ${{ inputs.function_name || 'sports-predictor-nfl-live-scores' }}
      handler_dir: 'Source/aws-lambdas/nfl/live-scores'
      library_path: 'Source/library'
      extra_source_files: 'Source/aws-lambdas/nfl/live-scores/live_scores.py'

  deploy:
    name: Deploy nfl-live-scores Lambda
    needs: build
    uses: ./.github/workflows/python_lambda_deploy.yml
    secrets: inherit
    with:
      function_name: ${{ inputs.function_name || 'sports-predictor-nfl-live-scores' }}
      artifact_name: ${{ needs.build.outputs.artifact_name }}
