# Tests and deploys the NFL live-scores Lambda -- GET /nfl/live-scores plus
# the EventBridge-triggered cache refresh, split into its own Lambda (see
# Terraform/lambda-nfl-live-scores.tf's own docstring for why this isn't
# folded into ingest or predict-read). Zip-packaged, so this deploys via
# python_lambda_build.yml directly, same as nfl_predict_read_deploy.yml.
#
# A separate reusable workflow, not jobs inlined into nfl_deploy.yml/
# app_deploy.yml directly -- same reason nfl_predict_read_deploy.yml is its
# own file: BOTH nfl_deploy.yml (nfl*-branch pushes) and app_deploy.yml
# (main-branch pushes, the actual production deploy path) need to run this
# exact same test+deploy pair, and duplicating it inline in each one is
# exactly how nfl_predict_read_deploy.yml's own deploy got missed from
# app_deploy.yml the first time -- see that workflow's own docstring.
#
# Function name is supplied by the caller from a Terraform output, with a
# default so workflow_dispatch (manual, standalone run) still works
# without needing that wiring -- same pattern as nfl_predict_read_deploy.yml.

name: NFL Live Scores Deploy

on:
  workflow_dispatch:
  workflow_call:
    inputs:
      function_name:
        description: 'NFL live-scores Lambda function name (from Terraform output nfl_live_scores_function_name)'
        required: false
        type: string
        default: 'sports-predictor-nfl-live-scores'

permissions:
  id-token: write
  contents: read

jobs:
  test:
    name: Run nfl-live-scores tests
    uses: ./.github/workflows/run_python_tests.yml
    with:
      test_path: 'Source/tests/aws-lambdas/nfl/test_live_scores.py Source/tests/aws-lambdas/nfl/test_live_scores_handler.py'
      requirements_files: 'Source/aws-lambdas/nfl/live-scores/requirements.txt'

  deploy:
    name: Deploy nfl-live-scores Lambda
    needs: test
    uses: ./.github/workflows/python_lambda_build.yml
    secrets: inherit
    with:
      function_name: ${{ inputs.function_name || 'sports-predictor-nfl-live-scores' }}
      handler_dir: 'Source/aws-lambdas/nfl/live-scores'
      library_path: 'Source/library'
      extra_source_files: 'Source/aws-lambdas/nfl/live-scores/live_scores.py'
