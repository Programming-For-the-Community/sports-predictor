[project]
name = "sports-predictor-library"
version = "0.1.0"
description = "Shared Python classes (AWS access, HTTP clients, etc.) reused across sports-predictor's backfill jobs and Lambdas."
requires-python = ">=3.11"
dependencies = [
    "boto3>=1.34",
    "requests>=2.31",
]

[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[tool.setuptools]
packages = ["library", "library.aws", "library.features", "library.http", "library.normalize", "library.schema", "library.storage"]

[tool.setuptools.package-dir]
library = "."