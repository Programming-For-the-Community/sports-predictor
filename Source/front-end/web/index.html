<!DOCTYPE html>
<html>
<head>
  <!--
    If you are serving your web app in a path other than the root, change the
    href value below to reflect the base path you are serving from.

    The path provided below has to start and end with a slash "/" in order for
    it to work correctly.

    For more details:
    * https://developer.mozilla.org/en-US/docs/Web/HTML/Element/base

    This is a placeholder for base href that will be replaced by the value of
    the `--base-href` argument provided to `flutter build`.
  -->
  <base href="$FLUTTER_BASE_HREF">

  <meta charset="UTF-8">
  <meta content="IE=Edge" http-equiv="X-UA-Compatible">
  <meta name="description" content="AI-powered sports predictions -- win probability, scores, player props, and season projections.">
  <meta name="theme-color" content="#0a0e17">

  <!-- iOS meta tags & icons -->
  <meta name="mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="black">
  <meta name="apple-mobile-web-app-title" content="Sports Predictor">
  <!-- ?v=2 cache-busts mobile browsers' icon caching (iOS Safari caches
       apple-touch-icon independently of normal HTTP cache headers).
       Bump this version marker any time the logo changes. -->
  <link rel="apple-touch-icon" href="icons/Icon-192.png?v=2">

  <!-- Favicon -->
  <link rel="icon" type="image/png" href="favicon.png?v=2"/>

  <title>Sports Predictor</title>
  <link rel="manifest" href="manifest.json">

  <!-- Paints the app's own dark background immediately, before Flutter's
       JS engine finishes booting and renders its first frame -- without
       this the browser's default white shows through for that entire
       window instead. Matches AppColors.bg (app_colors.dart) exactly. -->
  <style>
    html, body { background: #0a0e17; height: 100%; margin: 0; }
  </style>
</head>
<body>
  <script src="flutter_bootstrap.js" async></script>
</body>
</html>
