[pytest]
# Puts Source/ on sys.path for every test run, repo-wide, so `import
# library` resolves directly to Source/library/*.py -- no pip install of
# the library package itself needed. Source/library's own pyproject.toml
# package-dir mapping ({"library": "."}) means Source/library IS the
# library package already; this is just a plain sys.path lookup, not an
# install of any kind, so it sidesteps PEP 660 editable-install mode
# entirely (both editable modes are incompatible with that package-dir
# mapping, confirmed by direct testing).
#
# This also fixes coverage: installing library non-editably into
# site-packages meant test runs executed the site-packages COPY, which
# coverage.py's `--source=Source` explicitly excludes from tracing
# ("falls outside the --source spec") -- so library/* code always reported
# 0% covered, confirmed via direct inspection of a .coverage file's own
# line_bits table. With Source on sys.path, the code that actually runs
# IS Source/library/*.py, so coverage traces it directly like every other
# Source/ file.
pythonpath = Source
